<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

🦴 Skeleton Explorer

</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
'Segoe UI',
sans-serif;

background:
linear-gradient(
#eef8ff,
#ffffff
);

min-height:100vh;

overflow-x:hidden;

}

/* SPLASH */

#splashScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:white;

display:flex;

justify-content:center;
align-items:center;

z-index:9999;

}

#splashLogo{

width:320px;

max-width:85%;

animation:
logoZoom 1.5s ease;

}

@keyframes logoZoom{

0%{
opacity:0;
transform:scale(.6);
}

100%{
opacity:1;
transform:scale(1);
}

}

/* INTRO */

#introScreen{

display:none;

min-height:100vh;

justify-content:center;
align-items:center;

padding:20px;

}

.introCard{

background:white;

max-width:1000px;

width:100%;

padding:35px;

border-radius:30px;

text-align:center;

box-shadow:
0 10px 30px
rgba(0,0,0,.15);

}

.logo{

width:220px;

margin-bottom:20px;

}

.title{

font-size:3rem;

font-weight:bold;

color:#1565c0;

margin-bottom:20px;

}

.story{

font-size:1.2rem;

line-height:1.9;

color:#444;

}

.startBtn{

margin-top:25px;

padding:
18px 45px;

border:none;

border-radius:20px;

background:#1976d2;

color:white;

font-size:1.2rem;

font-weight:bold;

cursor:pointer;

}

/* GAME */

#gameScreen{

display:none;

padding:20px;

}

.gameHeader{

text-align:center;

margin-bottom:20px;

}

.gameLogo{

width:180px;

margin-bottom:10px;

}

.gameTitle{

font-size:2.8rem;

font-weight:bold;

color:#1565c0;

}

.hud{

display:grid;

grid-template-columns:
1fr 1fr;

gap:15px;

max-width:1100px;

margin:auto;

margin-bottom:20px;

}

.hudBox{

padding:18px;

border-radius:18px;

text-align:center;

font-size:1.2rem;

font-weight:bold;

color:white;

}

.scoreBox{

background:#43a047;

}

.questionBox{

background:#1976d2;

}

.mainCard{

max-width:1100px;

margin:auto;

background:white;

padding:25px;

border-radius:30px;

box-shadow:
0 10px 30px
rgba(0,0,0,.15);

}

/* SKELETON IMAGE */

.skeletonImage{

display:block;

margin:auto;

max-width:450px;

width:100%;

margin-bottom:20px;

}

/* QUESTION */

.questionText{

font-size:1.8rem;

font-weight:bold;

text-align:center;

margin-bottom:25px;

color:#1565c0;

}

/* OPTIONS */

.optionsGrid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:15px;

}

.optionBtn{

padding:18px;

border:none;

border-radius:18px;

font-size:1.1rem;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.optionBtn:hover{

transform:translateY(-2px);

}

.optionA{
background:#e8f5e9;
}

.optionB{
background:#e3f2fd;
}

.optionC{
background:#fff8e1;
}

.optionD{
background:#fce4ec;
}

.feedback{

margin-top:20px;

text-align:center;

font-size:1.15rem;

font-weight:bold;

min-height:80px;

}

@media(max-width:900px){

.optionsGrid{

grid-template-columns:1fr;

}

.title{

font-size:2rem;

}

.gameTitle{

font-size:2rem;

}

.questionText{

font-size:1.3rem;

}

}

</style>

</head>

<body>

<div id="splashScreen">

<img
id="splashLogo"
src="assets/innovine-logo.png">

</div>

<div id="introScreen">

<div class="introCard">

<img
src="assets/innovine-logo.png"
class="logo">

<h1 class="title">

🦴 SKELETON EXPLORER

</h1>

<div class="story">

Study the skeleton carefully.

<br><br>

Read each question and choose the correct answer.

<br><br>

Learn about the important bones of the human body.

<br><br>

🏆 Score points and become a Skeleton Explorer!

</div>

<button
class="startBtn"
onclick="startGame()">

🚀 START GAME

</button>

</div>

</div>

<div id="gameScreen">

<div class="gameHeader">

<img
src="assets/innovine-logo.png"
class="gameLogo">

<div class="gameTitle">

🦴 SKELETON EXPLORER

</div>

</div>

<div class="hud">

<div class="hudBox scoreBox">

⭐ Score:
<span id="score">

0

</span>

</div>

<div class="hudBox questionBox">

📚 Question:
<span id="questionNo">

1

</span>/9

</div>

</div>

<div class="mainCard">

<img
src="assets/skeleton.png"
class="skeletonImage">

<div
id="questionText"
class="questionText">

Loading...

</div>

<div
id="optionsGrid"
class="optionsGrid">

</div>

<div
id="feedback"
class="feedback">

</div>
</div>

</div>

<!-- AUDIO -->

<audio
id="correctSound"
src="assets/correct.mp3">
</audio>

<audio
id="wrongSound"
src="assets/wrong.mp3">
</audio>

<audio
id="clapSound"
src="assets/clapping.mp3">
</audio>

<script>

/* =========================
   SPLASH
========================= */

setTimeout(()=>{

document.getElementById(
"splashScreen"
).style.display =
"none";

document.getElementById(
"introScreen"
).style.display =
"flex";

},1500);

/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let currentQuestion = 0;

/* =========================
   QUESTION BANK
========================= */

const questions = [

{
question:
"Which bone protects the brain?",

answer:
"Skull",

fact:
"🧠 The skull protects the brain.",

options:[
"Femur",
"Skull",
"Ribs",
"Tibia"
]

},

{
question:
"Which bones protect the heart and lungs?",

answer:
"Ribs",

fact:
"❤️ The ribs protect the heart and lungs.",

options:[
"Radius",
"Femur",
"Ribs",
"Ulna"
]

},

{
question:
"Which bone supports the body and helps us stand upright?",

answer:
"Backbone",

fact:
"🏃 The backbone supports the body and keeps us upright.",

options:[
"Backbone",
"Fibula",
"Femur",
"Radius"
]

},

{
question:
"Which bone is found in the upper arm?",

answer:
"Humerus",

fact:
"💪 The humerus is the upper arm bone.",

options:[
"Humerus",
"Tibia",
"Fibula",
"Ribs"
]

},

{
question:
"Which forearm bone helps the arm rotate?",

answer:
"Radius",

fact:
"✋ The radius helps the forearm rotate.",

options:[
"Ulna",
"Radius",
"Femur",
"Backbone"
]

},

{
question:
"Which forearm bone supports the forearm?",

answer:
"Ulna",

fact:
"🦾 The ulna supports the forearm.",

options:[
"Radius",
"Humerus",
"Ulna",
"Ribs"
]

},

{
question:
"Which is the longest bone in the human body?",

answer:
"Femur",

fact:
"🦵 The femur is the longest bone in the body.",

options:[
"Tibia",
"Femur",
"Ulna",
"Skull"
]

},

{
question:
"Which is the larger shin bone?",

answer:
"Tibia",

fact:
"🚶 The tibia is the larger shin bone.",

options:[
"Fibula",
"Tibia",
"Radius",
"Backbone"
]

},

{
question:
"Which bone supports the lower leg beside the tibia?",

answer:
"Fibula",

fact:
"🦶 The fibula supports the lower leg.",

options:[
"Femur",
"Fibula",
"Ribs",
"Humerus"
]

}

];

/* =========================
   SHUFFLE QUESTIONS
========================= */

function shuffleQuestions(){

for(
let i=
questions.length-1;
i>0;
i--
){

const j=
Math.floor(
Math.random()*(i+1)
);

[
questions[i],
questions[j]
]
=
[
questions[j],
questions[i]
];

}

}

/* =========================
   START GAME
========================= */

function startGame(){

document.getElementById(
"introScreen"
).style.display =
"none";

document.getElementById(
"gameScreen"
).style.display =
"block";

shuffleQuestions();

loadQuestion();

}
/* =========================
   SHUFFLE OPTIONS
========================= */

function shuffleArray(
array
){

const copy =
[...array];

for(
let i=
copy.length-1;
i>0;
i--
){

const j=
Math.floor(
Math.random()*(i+1)
);

[
copy[i],
copy[j]
]
=
[
copy[j],
copy[i]
];

}

return copy;

}

/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

if(
currentQuestion >=
questions.length
){

showCertificate();

return;

}

/* UPDATE HUD */

document.getElementById(
"score"
).innerHTML =
score;

document.getElementById(
"questionNo"
).innerHTML =
currentQuestion + 1;

/* GET QUESTION */

const q =
questions[
currentQuestion
];

/* QUESTION */

document.getElementById(
"questionText"
).innerHTML =
q.question;

/* CLEAR FEEDBACK */

document.getElementById(
"feedback"
).innerHTML =
"";

/* OPTIONS */

const optionsGrid =
document.getElementById(
"optionsGrid"
);

optionsGrid.innerHTML =
"";

/* SHUFFLE OPTIONS */

const shuffledOptions =
shuffleArray(
q.options
);

const classes = [

"optionA",
"optionB",
"optionC",
"optionD"

];

/* CREATE BUTTONS */

shuffledOptions.forEach(

(
option,
index
)=>{

const btn =
document.createElement(
"button"
);

btn.className =
`optionBtn ${classes[index]}`;

btn.innerHTML =
option;

btn.onclick =
()=>checkAnswer(
option
);

optionsGrid.appendChild(
btn
);

}

);

}

/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
selectedOption
){

const q =
questions[
currentQuestion
];

/* CORRECT */

if(
selectedOption ===
q.answer
){

const correctSound =
document.getElementById(
"correctSound"
);

correctSound.currentTime = 0;

correctSound.play().catch(()=>{});

score += 10;

document.getElementById(
"score"
).innerHTML =
score;

document.getElementById(
"feedback"
).innerHTML =

`
<div
style="
color:#2e7d32;
">

✅ Correct!

<br><br>

${q.fact}

</div>
`;

setTimeout(()=>{

currentQuestion++;

loadQuestion();

},1800);

}

/* WRONG */

else{

const wrongSound =
document.getElementById(
"wrongSound"
);

wrongSound.currentTime = 0;

wrongSound.play().catch(()=>{});

document.getElementById(
"feedback"
).innerHTML =

`
<div
style="
color:#c62828;
">

❌ Incorrect

<br><br>

Try again carefully.

</div>
`;

}

}
/* =========================
   CERTIFICATE SCREEN
========================= */

function showCertificate(){

/* HIDE HEADER */

document.querySelector(
".gameHeader"
).style.display =
"none";

/* PLAY CLAPS */

const clapSound =
document.getElementById(
"clapSound"
);

clapSound.currentTime = 0;

clapSound.play().catch(()=>{});

/* SHOW CERTIFICATE */

document.querySelector(
".mainCard"
).innerHTML =

`
<div
style="
text-align:center;
padding:20px;
">

<h1
style="
font-size:3rem;
color:#1565c0;
margin-bottom:15px;
">

🏆 MASTER SKELETON EXPLORER

</h1>

<div
style="
font-size:4rem;
margin-bottom:20px;
">

🦴 🧠 ❤️ 💪 🦵

</div>

<p
style="
font-size:1.2rem;
line-height:1.8;
max-width:700px;
margin:auto;
">

Congratulations!

<br><br>

You successfully explored the major bones of the human skeleton and answered all the questions correctly.

</p>

<br>

<div
style="
background:#eef8ff;
padding:20px;
border-radius:20px;
max-width:500px;
margin:auto;
font-size:1.1rem;
line-height:2;
font-weight:bold;
color:#1565c0;
">

🦴 Skull<br>

🦴 Ribs<br>

🦴 Backbone<br>

🦴 Humerus<br>

🦴 Radius<br>

🦴 Ulna<br>

🦴 Femur<br>

🦴 Tibia<br>

🦴 Fibula

</div>

<br><br>

<h2
style="
color:#2e7d32;
font-size:2rem;
">

⭐ Final Score:
${score}/90

</h2>

<br>

<div
style="
font-size:1.2rem;
font-weight:bold;
color:#ef6c00;
">

🎉 Excellent Work!

</div>

<br><br>

<button

onclick="playAgain()"

style="
padding:18px 40px;
border:none;
border-radius:20px;
background:#1976d2;
color:white;
font-size:1.2rem;
font-weight:bold;
cursor:pointer;
">

🔄 PLAY AGAIN

</button>

</div>
`;

}

/* =========================
   PLAY AGAIN
========================= */

function playAgain(){

location.reload();

}

</script>

</body>

</html>
