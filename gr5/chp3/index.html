<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrient Detective</title>

<style>

/* ================= GLOBAL ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;

/* FIXED BACKGROUND DEPTH */
background:
radial-gradient(circle at center,
rgba(255,255,255,0.75),
rgba(255,255,255,0.92)),
url("assets/clinic-bg.png");

background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* ================= SPLASH ================= */
#splash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

#splash img{
width:240px;
animation:fade 1s ease;
}

@keyframes fade{
from{opacity:0;transform:scale(0.7);}
to{opacity:1;transform:scale(1);}
}

/* ================= SCREENS ================= */
.screen{
display:none;
padding:15px;
}

/* ================= INTRO ================= */
.card{
background:rgba(255,255,255,0.96);
max-width:900px;
margin:auto;
padding:20px;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
text-align:center;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
width:100%;
}

.start{
background:#2e7d32;
color:white;
}

/* ================= GAME WRAPPER (NEW FIX) ================= */
.game-wrapper{
display:grid;
grid-template-columns:1fr;
gap:15px;
max-width:1100px;
margin:auto;
}

/* ================= HUD ================= */
.hud{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
font-weight:bold;
font-size:14px;
margin-bottom:10px;
background:rgba(255,255,255,0.85);
padding:10px;
border-radius:12px;
}

/* ================= CASE PANEL ================= */
.case-panel{
background:rgba(255,255,255,0.95);
padding:15px;
border-radius:16px;
box-shadow:0 6px 15px rgba(0,0,0,0.12);
}

.case-title{
background:#1976d2;
color:white;
padding:8px;
border-radius:10px;
font-weight:bold;
margin-bottom:10px;
}

.symptoms{
background:#fff3e0;
padding:10px;
border-radius:10px;
margin-top:10px;
}

/* ================= QUESTION PANEL ================= */
.q-panel{
background:rgba(255,255,255,0.96);
padding:15px;
border-radius:16px;
box-shadow:0 6px 15px rgba(0,0,0,0.12);
}

.option{
margin:8px 0;
padding:12px;
background:#e3f2fd;
border-radius:10px;
cursor:pointer;
}

/* ================= FEEDBACK ================= */
.correct{background:#c8e6c9;padding:10px;border-radius:10px;margin-top:10px;}
.wrong{background:#ffcdd2;padding:10px;border-radius:10px;margin-top:10px;}
.hint{background:#fff3cd;padding:10px;border-radius:10px;margin-top:10px;}

/* ================= DESKTOP UPGRADE ================= */
@media(min-width:900px){
.game-wrapper{
grid-template-columns: 1fr 1fr;
align-items:start;
}
}

/* ================= MOBILE ================= */
@media(max-width:768px){
button{font-size:15px;}
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png">
</div>

<!-- INTRO -->
<div class="screen" id="intro">
<div class="card">
<img src="assets/innovine-logo.png" style="width:140px;">
<h2>🏥 Nutrient Detective</h2>
<p>Diagnose patients using symptoms and nutrition clues</p>
<button class="start" onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div class="screen" id="game">

<div class="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div>❤️ Lives: <span id="life">2</span></div>
<div>📌 Q: <span id="qno">1</span></div>
</div>

<div class="game-wrapper">

<!-- CASE PANEL -->
<div class="case-panel">
<div class="case-title">🏥 CASE FILE</div>

<div id="caseText">
Patient shows unusual symptoms. Diagnose carefully.
</div>

<div class="symptoms" id="symptoms">
Observe symptoms and choose correct nutrient.
</div>
</div>

<!-- QUESTION PANEL -->
<div class="q-panel">

<h3 id="question"></h3>

<div id="options"></div>

<div id="feedback"></div>

</div>

</div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
<div class="card">
<h2>🏁 Mission Complete</h2>
<p>Final Score: <span id="final"></span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

/* ================= SPLASH ================= */
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="block";
},3000);

/* ================= START ================= */
function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
loadQ();
}

/* ================= STATE ================= */
let score=0;
let life=2;
let qIndex=0;
let attempt=1;
let lock=false;

/* ================= DATA ================= */
const data=[
{
q:"A child cannot see in dim light. Which nutrient is missing?",
case:"Night vision problem detected in child patient.",
sym:"Difficulty seeing in low light conditions.",
o:["Vitamin A","Vitamin C","Iron","Calcium"],
a:"Vitamin A",
hint:"Think about eyes 👁️"
},
{
q:"Bleeding gums and slow healing?",
case:"Gum bleeding observed in patient.",
sym:"Wounds take long time to heal.",
o:["Vitamin C","Vitamin A","Iron","Calcium"],
a:"Vitamin C",
hint:"Think immunity 🩹"
},
{
q:"Pale skin and tiredness?",
case:"Patient looks weak and exhausted.",
sym:"Low energy and shortness of breath.",
o:["Iron","Calcium","Vitamin A","Iodine"],
a:"Iron",
hint:"Think blood ❤️"
},
{
q:"Swollen thyroid gland?",
case:"Neck swelling observed.",
sym:"Slow physical and mental growth.",
o:["Iodine","Iron","Vitamin C","Calcium"],
a:"Iodine",
hint:"Think thyroid 🧠"
},
{
q:"Weak bones and teeth decay?",
case:"Bone weakness detected.",
sym:"Tooth decay reported.",
o:["Calcium","Iron","Vitamin A","Vitamin C"],
a:"Calcium",
hint:"Think bones 🦴"
}
];

/* ================= LOAD ================= */
function loadQ(){

if(qIndex>=data.length){
end();
return;
}

attempt=1;
lock=false;

let q=data[qIndex];

document.getElementById("qno").innerText=qIndex+1;
document.getElementById("question").innerText=q.q;

document.getElementById("caseText").innerText=q.case;
document.getElementById("symptoms").innerText=q.sym;

let html="";
q.o.forEach(opt=>{
html+=`<div class="option" onclick="check('${opt}')">${opt}</div>`;
});

document.getElementById("options").innerHTML=html;
document.getElementById("feedback").innerHTML="";
}

/* ================= CHECK ================= */
function check(ans){

if(lock) return;

let q=data[qIndex];

if(ans===q.a){

document.getElementById("correctSound").play();

score+=10;
document.getElementById("feedback").innerHTML="✅ Correct Diagnosis!";
document.getElementById("feedback").className="correct";

lock=true;

setTimeout(()=>{
qIndex++;
updateHUD();
loadQ();
},1200);

}else{

document.getElementById("wrongSound").play();
life--;
updateHUD();

if(attempt===1){

document.getElementById("feedback").innerHTML="💡 Hint: "+q.hint;
document.getElementById("feedback").className="hint";
attempt=2;
lock=false;

}else{

document.getElementById("feedback").innerHTML="❌ Correct Answer: "+q.a;
document.getElementById("feedback").className="wrong";

lock=true;

setTimeout(()=>{
qIndex++;
loadQ();
},1500);

}

if(life<0){
end();
}

}
}

/* ================= HUD ================= */
function updateHUD(){
document.getElementById("score").innerText=score;
document.getElementById("life").innerText=life;
}

/* ================= END ================= */
function end(){
document.getElementById("game").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("final").innerText=score;
document.getElementById("clapSound").play();
}

</script>

</body>
</html>
