<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Innovine Cell Sort Challenge</title>

<style>

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Trebuchet MS',sans-serif;

background:
linear-gradient(
135deg,
#edf7ee 0%,
#f8fffa 50%,
#e8f4ff 100%
);

min-height:100vh;

overflow-x:hidden;

position:relative;

}

/* =========================
   SPLASH SCREEN
========================= */

#splashScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:white;

display:flex;

justify-content:center;

align-items:center;

z-index:9999;

}

#splashLogo{

width:350px;

max-width:85%;

animation:fadeZoom 2s ease;

}

@keyframes fadeZoom{

0%{
opacity:0;
transform:scale(.7);
}

100%{
opacity:1;
transform:scale(1);
}

}

/* =========================
   FLOATING SCIENCE ICONS
========================= */

.bgIcon{

position:fixed;

font-size:90px;

opacity:.05;

pointer-events:none;

animation:float 14s infinite ease-in-out;

z-index:0;

}

.i1{
top:5%;
left:3%;
}

.i2{
top:12%;
right:4%;
animation-delay:2s;
}

.i3{
bottom:10%;
left:6%;
animation-delay:4s;
}

.i4{
bottom:8%;
right:8%;
animation-delay:6s;
}

.i5{
top:50%;
left:1%;
animation-delay:3s;
}

.i6{
top:55%;
right:1%;
animation-delay:5s;
}

@keyframes float{

0%{
transform:
translateY(0px)
rotate(0deg);
}

50%{
transform:
translateY(-30px)
rotate(10deg);
}

100%{
transform:
translateY(0px)
rotate(0deg);
}

}

/* =========================
   MAIN GAME
========================= */

#gameContainer{

display:none;

position:relative;

z-index:10;

max-width:1300px;

margin:20px auto;

background:white;

border-radius:30px;

padding:25px;

box-shadow:
0 12px 30px rgba(0,0,0,.12);

}

/* =========================
   HEADER
========================= */

.header{

text-align:center;

margin-bottom:20px;

}

.gameTitle{

font-size:2.3rem;

color:#2e7d32;

font-weight:bold;

margin-bottom:15px;

}

.instruction{

background:#fff8e1;

border:2px solid #ffd54f;

padding:15px;

border-radius:15px;

font-weight:bold;

font-size:1rem;

}

/* =========================
   SCORE BAR
========================= */

.scoreBar{

display:flex;

justify-content:space-between;

flex-wrap:wrap;

gap:10px;

margin:20px 0;

}

.stat{

background:#e3f2fd;

padding:12px 18px;

border-radius:12px;

font-weight:bold;

font-size:1rem;

}

/* =========================
   FEATURE CARD
========================= */

.featureCard{

max-width:700px;

margin:25px auto;

background:#1976d2;

color:white;

padding:25px;

border-radius:22px;

text-align:center;

font-size:1.5rem;

font-weight:bold;

box-shadow:
0 5px 15px rgba(0,0,0,.2);

}

/* =========================
   CELL OPTIONS
========================= */

.cellArea{

display:grid;

grid-template-columns:1fr 1fr;

gap:25px;

margin-top:20px;

}

.cellCard{

background:#fafafa;

border:3px solid #dbeafe;

border-radius:25px;

padding:20px;

text-align:center;

cursor:pointer;

transition:.2s;

}

.cellCard:hover{

transform:scale(1.02);

}

.cellTitle{

font-size:1.7rem;

font-weight:bold;

color:#1565c0;

margin-bottom:10px;

}

.cellImage{

width:280px;

max-width:100%;

display:block;

margin:auto;

}

/* =========================
   FEEDBACK
========================= */

.feedback{

text-align:center;

font-size:1.2rem;

font-weight:bold;

min-height:80px;

margin-top:20px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

.cellArea{

grid-template-columns:1fr;

}

.featureCard{

font-size:1.15rem;

}

.gameTitle{

font-size:1.8rem;

}

}

</style>

</head>

<body>

<!-- SPLASH SCREEN -->

<div id="splashScreen">

<img
src="assets/innovine-logo.png"
id="splashLogo"
alt="Innovine Logo">

</div>

<!-- FLOATING ICONS -->

<div class="bgIcon i1">🧬</div>
<div class="bgIcon i2">🔬</div>
<div class="bgIcon i3">🌿</div>
<div class="bgIcon i4">🦠</div>
<div class="bgIcon i5">🧫</div>
<div class="bgIcon i6">🔍</div>

<!-- MAIN GAME -->

<div id="gameContainer">

<div class="header">

<h1 class="gameTitle">

🔬 Cell Sort Challenge

</h1>

<div class="instruction">

👉 Read the feature carefully and tap the correct cell type.

</div>

</div>

<div class="scoreBar">

<div class="stat">

⭐ Score:
<span id="score">0</span>

</div>

<div class="stat">

Question:
<span id="questionNumber">1</span>/10

</div>

</div>

<div
id="featureCard"
class="featureCard">

Loading...

</div>

<div class="cellArea">

<div
class="cellCard"
onclick="checkAnswer('animal')">

<div class="cellTitle">

Animal Cell

</div>

<img
src="assets/animal-cell.png"
class="cellImage"
alt="Animal Cell">

</div>

<div
class="cellCard"
onclick="checkAnswer('plant')">

<div class="cellTitle">

Plant Cell

</div>

<img
src="assets/plant-cell.png"
class="cellImage"
alt="Plant Cell">

</div>

</div>

<div
id="feedback"
class="feedback">

</div>

</div>

<!-- AUDIO -->

<audio
id="correctSound"
src="assets/correct.mp3">
</audio>

<audio
id="wrongSound"
src="assets/wrong.mp3">
</audio>

<audio
id="clapSound"
src="assets/freesound_community-claps-44774.mp3">
</audio>

<script>

/* =========================
   SPLASH SCREEN
========================= */

setTimeout(()=>{

document.getElementById(
"splashScreen"
).style.display="none";

document.getElementById(
"gameContainer"
).style.display="block";

},2000);

/* =========================
   GAME DATA
========================= */

const features = [

{
text:"Smaller in size",
type:"animal"
},

{
text:"Do not have a cell wall",
type:"animal"
},

{
text:"Vacuoles are absent or small",
type:"animal"
},

{
text:"Do not have chloroplast",
type:"animal"
},

{
text:"Store food as glycogen",
type:"animal"
},

{
text:"Larger in size",
type:"plant"
},

{
text:"Have a cell wall",
type:"plant"
},

{
text:"Large central vacuole",
type:"plant"
},

{
text:"Contain chloroplast",
type:"plant"
},

{
text:"Store food as starch",
type:"plant"
}

];

let currentQuestion = 0;
let score = 0;
let answering = false;

/* =========================
   RANDOMIZE QUESTIONS
========================= */

for(
let i = features.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() * (i + 1)
);

[
features[i],
features[j]
]
=
[
features[j],
features[i]
];

}

/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

if(
currentQuestion >=
features.length
){

showCompletionScreen();

return;

}

document
.getElementById(
"questionNumber"
)
.innerHTML =
currentQuestion + 1;

document
.getElementById(
"featureCard"
)
.innerHTML =

features[
currentQuestion
].text;

document
.getElementById(
"feedback"
)
.innerHTML = "";

}

/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
selectedType
){

if(answering){

return;

}

answering = true;

const current =
features[
currentQuestion
];

const feedback =
document.getElementById(
"feedback"
);

/* CORRECT */

if(
selectedType ===
current.type
){

const correctSound =
document.getElementById(
"correctSound"
);

correctSound.currentTime = 0;

correctSound.play().catch(()=>{});

score += 10;

document
.getElementById(
"score"
)
.innerHTML =
score;

feedback.style.color =
"#2e7d32";

feedback.innerHTML =

`
🎉 Correct!

<br><br>

<b>${current.text}</b>

belongs to

<b>
${
selectedType==="animal"
?
"Animal Cell"
:
"Plant Cell"
}
</b>
`;

}

/* WRONG */

else{

const wrongSound =
document.getElementById(
"wrongSound"
);

wrongSound.currentTime = 0;

wrongSound.play().catch(()=>{});

feedback.style.color =
"#c62828";

feedback.innerHTML =

`
❌ Not Quite!

<br><br>

<b>${current.text}</b>

belongs to

<b>
${
current.type==="animal"
?
"Animal Cell"
:
"Plant Cell"
}
</b>
`;

}

/* NEXT QUESTION */

setTimeout(()=>{

currentQuestion++;

answering = false;

loadQuestion();

},1800);

}

/* =========================
   COMPLETION SCREEN
========================= */

function showCompletionScreen(){

const clapSound =
document.getElementById(
"clapSound"
);

clapSound.currentTime = 0;

clapSound.play().catch(()=>{});

let badge =
"🌟";

let title =
"Cell Learner";

if(score >= 80){

badge =
"🏆";

title =
"Cell Expert";

}
else if(score >= 60){

badge =
"🥇";

title =
"Cell Champion";

}

document
.getElementById(
"gameContainer"
)
.innerHTML =

`
<div
style="
text-align:center;
padding:40px;
">

<img
src="assets/innovine-logo.png"
style="
width:220px;
max-width:80%;
margin-bottom:25px;
">

<div
style="
font-size:100px;
">

${badge}

</div>

<h1
style="
color:#2e7d32;
margin-bottom:15px;
">

${title}

</h1>

<p
style="
font-size:1.2rem;
line-height:1.8;
max-width:700px;
margin:auto;
">

You helped Animal Cells and Plant Cells remember their characteristics.

Excellent work!

</p>

<br>

<h2
style="
color:#1565c0;
">

⭐ Final Score:
${score}/100

</h2>

<br>

<button

onclick="restartGame()"

style="
padding:15px 30px;
border:none;
border-radius:15px;
background:#1565c0;
color:white;
font-size:1rem;
font-weight:bold;
cursor:pointer;
">

🔄 Play Again

</button>

</div>
`;

}

/* =========================
   RESTART
========================= */

function restartGame(){

location.reload();

}

/* =========================
   START GAME
========================= */

loadQuestion();

</script>

</body>
</html>
