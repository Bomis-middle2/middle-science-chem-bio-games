<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cell Sort Challenge</title>

<style>

/* =========================
   GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Trebuchet MS',sans-serif;

background:
linear-gradient(
135deg,
#e8f5e9 0%,
#f5fff7 50%,
#e3f2fd 100%
);

min-height:100vh;

overflow:hidden;

}

/* =========================
   SPLASH SCREEN
========================= */

#splashScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:white;

display:flex;

justify-content:center;

align-items:center;

z-index:1000;

}

#splashLogo{

width:320px;

max-width:80%;

animation:logoPulse 2s ease-in-out;

}

@keyframes logoPulse{

0%{
opacity:0;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}

/* =========================
   FLOATING BACKGROUND
========================= */

.bgIcon{

position:absolute;

font-size:80px;

opacity:.06;

animation:float 14s infinite ease-in-out;

pointer-events:none;

}

.i1{
top:5%;
left:5%;
}

.i2{
top:15%;
right:8%;
animation-delay:2s;
}

.i3{
bottom:15%;
left:8%;
animation-delay:4s;
}

.i4{
bottom:10%;
right:10%;
animation-delay:6s;
}

.i5{
top:45%;
left:2%;
animation-delay:3s;
}

.i6{
top:55%;
right:3%;
animation-delay:5s;
}

@keyframes float{

0%{
transform:
translateY(0px)
rotate(0deg);
}

50%{
transform:
translateY(-30px)
rotate(10deg);
}

100%{
transform:
translateY(0px)
rotate(0deg);
}

}

/* =========================
   GAME AREA
========================= */

#gameContainer{

display:none;

position:relative;

z-index:10;

max-width:1200px;

margin:20px auto;

background:white;

padding:25px;

border-radius:25px;

box-shadow:
0 10px 25px rgba(0,0,0,.15);

}

/* =========================
   HEADER
========================= */

.header{

text-align:center;

margin-bottom:20px;

}

.header h1{

color:#2e7d32;

font-size:2.2rem;

margin-bottom:10px;

}

.instruction{

background:#fff8e1;

padding:15px;

border-radius:12px;

font-weight:bold;

border:2px solid #ffd54f;

}

/* =========================
   SCORE BAR
========================= */

.scoreBar{

display:flex;

justify-content:space-between;

margin:20px 0;

gap:10px;

flex-wrap:wrap;

}

.stat{

background:#e3f2fd;

padding:12px 18px;

border-radius:12px;

font-weight:bold;

}

/* =========================
   FEATURE CARD
========================= */

.featureCard{

background:#1976d2;

color:white;

padding:25px;

border-radius:20px;

text-align:center;

font-size:1.4rem;

font-weight:bold;

max-width:700px;

margin:20px auto;

box-shadow:
0 5px 15px rgba(0,0,0,.2);

}

/* =========================
   CELL CHOICES
========================= */

.cellChoices{

display:grid;

grid-template-columns:1fr 1fr;

gap:25px;

margin-top:25px;

}

.cellCard{

background:#fafafa;

border:3px solid #dbeafe;

border-radius:20px;

padding:20px;

text-align:center;

cursor:pointer;

transition:.2s;

}

.cellCard:hover{

transform:scale(1.02);

}

.cellCard img{

width:260px;

max-width:100%;

}

.cellTitle{

font-size:1.5rem;

font-weight:bold;

margin-bottom:10px;

color:#1565c0;

}

/* =========================
   FEEDBACK
========================= */

.feedback{

text-align:center;

font-size:1.2rem;

font-weight:bold;

min-height:70px;

margin-top:20px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

.cellChoices{

grid-template-columns:1fr;

}

.featureCard{

font-size:1.1rem;

}

}

</style>

</head>

<body>

<!-- SPLASH -->

<div id="splashScreen">

<img
src="assets/innovine-logo.png"
id="splashLogo"
alt="Innovine Logo">

</div>

<!-- FLOATING ICONS -->

<div class="bgIcon i1">🧬</div>
<div class="bgIcon i2">🔬</div>
<div class="bgIcon i3">🌿</div>
<div class="bgIcon i4">🦠</div>
<div class="bgIcon i5">🧫</div>
<div class="bgIcon i6">🔍</div>

<!-- GAME -->

<div id="gameContainer">

<div class="header">

<h1>

🔬 Cell Sort Challenge

</h1>

<div class="instruction">

Tap the correct cell type for the feature shown below.

</div>

</div>

<div class="scoreBar">

<div class="stat">

⭐ Score:
<span id="score">

0

</span>

</div>

<div class="stat">

Question:
<span id="questionNumber">

1

</span>/10

</div>

</div>

<div
id="featureCard"
class="featureCard">

Loading...

</div>

<div class="cellChoices">

<div
class="cellCard"
onclick="checkAnswer('animal')">

<div class="cellTitle">

Animal Cell

</div>

<img
src="assets/animal-cell.png"
alt="Animal Cell">

</div>

<div
class="cellCard"
onclick="checkAnswer('plant')">

<div class="cellTitle">

Plant Cell

</div>

<img
src="assets/plant-cell.png"
alt="Plant Cell">

</div>

</div>

<div
id="feedback"
class="feedback">

</div>

</div>

<script>

/* =========================
   SPLASH SCREEN
========================= */

setTimeout(()=>{

document.getElementById(
"splashScreen"
).style.display="none";

document.getElementById(
"gameContainer"
).style.display="block";

},2000);

/* =========================
   GAME DATA
========================= */

const features = [

{
text:"Smaller in size",
type:"animal"
},

{
text:"Do not have a cell wall",
type:"animal"
},

{
text:"Vacuoles are absent or small",
type:"animal"
},

{
text:"Do not have chloroplast",
type:"animal"
},

{
text:"Store food as glycogen",
type:"animal"
},

{
text:"Larger in size",
type:"plant"
},

{
text:"Have a cell wall",
type:"plant"
},

{
text:"Large central vacuole",
type:"plant"
},

{
text:"Contain chloroplast",
type:"plant"
},

{
text:"Store food as starch",
type:"plant"
}

];

let currentQuestion = 0;
let score = 0;

/* =========================
   RANDOMIZE QUESTIONS
========================= */

for(
let i = features.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() * (i + 1)
);

[
features[i],
features[j]
]
=
[
features[j],
features[i]
];

}

/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

if(
currentQuestion >=
features.length
){

showCompletionScreen();

return;

}

document
.getElementById(
"questionNumber"
)
.innerHTML =
currentQuestion + 1;

document
.getElementById(
"featureCard"
)
.innerHTML =

features[
currentQuestion
].text;

document
.getElementById(
"feedback"
)
.innerHTML = "";

}

/* =========================
   CHECK ANSWER
========================= */

let answering = false;

function checkAnswer(
selectedType
){

if(answering) return;

answering = true;

const current =
features[
currentQuestion
];

const feedback =
document.getElementById(
"feedback"
);

if(
selectedType ===
current.type
){

score += 10;

document
.getElementById(
"score"
)
.innerHTML =
score;

feedback.style.color =
"#2e7d32";

feedback.innerHTML =

`
🎉 Correct!

<br><br>

<b>${current.text}</b>

belongs to

<b>
${
selectedType==="animal"
?
"Animal Cell"
:
"Plant Cell"
}
</b>
`;

}
else{

feedback.style.color =
"#c62828";

feedback.innerHTML =

`
❌ Not Quite!

<br><br>

<b>${current.text}</b>

belongs to

<b>
${
current.type==="animal"
?
"Animal Cell"
:
"Plant Cell"
}
</b>
`;

}

/* AUTO NEXT */

setTimeout(()=>{

currentQuestion++;

answering = false;

loadQuestion();

},1800);

}

/* =========================
   COMPLETION SCREEN
========================= */

function showCompletionScreen(){

let badge =
"🌟";

let title =
"Cell Learner";

if(score >= 80){

badge =
"🏆";

title =
"Cell Expert";

}
else if(score >= 60){

badge =
"🥇";

title =
"Cell Champion";

}

document
.getElementById(
"gameContainer"
)
.innerHTML =

`
<div
style="
text-align:center;
padding:40px;
">

<img
src="assets/innovine-logo.png"
style="
width:220px;
max-width:80%;
margin-bottom:25px;
">

<div
style="
font-size:100px;
">

${badge}

</div>

<h1
style="
color:#2e7d32;
margin-bottom:15px;
">

${title}

</h1>

<p
style="
font-size:1.2rem;
line-height:1.8;
max-width:700px;
margin:auto;
">

You helped Animal Cells and Plant Cells remember their characteristics.

Excellent work!

</p>

<br>

<h2
style="
color:#1565c0;
">

⭐ Final Score:
${score}/100

</h2>

<br>

<button

onclick="restartGame()"

style="
padding:15px 30px;
border:none;
border-radius:15px;
background:#1565c0;
color:white;
font-size:1rem;
font-weight:bold;
cursor:pointer;
">

🔄 Play Again

</button>

</div>
`;

}

/* =========================
   RESTART
========================= */

function restartGame(){

location.reload();

}

/* =========================
   START GAME
========================= */

loadQuestion();

</script>

</body>
</html>
