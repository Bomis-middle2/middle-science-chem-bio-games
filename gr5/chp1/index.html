<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innovine Pyramid Game</title>

<style>

body{
margin:0;
font-family:Arial;
background:#eaf6ff;
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
}

#splash img{width:140px;}

/* INSTRUCTIONS */
#instructions{
display:none;
padding:20px;
text-align:center;
}

.card{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
}

/* GAME */
#game{
display:none;
padding:10px;
}

.main{
display:grid;
grid-template-columns:280px 1fr 260px;
gap:15px;
align-items:start;
}

/* MOBILE */
@media(max-width:900px){
.main{
grid-template-columns:1fr;
}

.side{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
}

.foodCard{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
cursor:pointer;
}

.foodEmoji{font-size:4rem;}

.pyramidBox{
background:white;
padding:10px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

svg{width:100%;height:auto;}

.sideBox{
background:white;
padding:10px;
border-radius:12px;
margin-bottom:10px;
min-height:90px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.sideTitle{font-weight:bold;}

.item{font-size:1.6rem;margin:3px;display:inline-block;}

#feedback{
text-align:center;
font-weight:bold;
margin-top:10px;
}

.btn{
padding:10px 15px;
background:#2e7d32;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

#endScreen{
display:none;
text-align:center;
padding:40px;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png">
<h2>Innovine Learning</h2>
</div>

<!-- INSTRUCTIONS -->
<div id="instructions">
<div class="card">
<h2>Instructions</h2>
<p>Tap food → tap pyramid → build diet pyramid</p>
<button class="btn" onclick="startGame()">Start Game</button>
</div>
</div>

<!-- GAME -->
<div id="game">

<div class="main">

<!-- LEFT -->
<div>
<div class="foodCard" id="foodCard">
<div class="foodEmoji" id="emoji">🍎</div>
<h3 id="name">Apple</h3>
</div>

<p id="feedback">Tap food first</p>
</div>

<!-- CENTER -->
<div class="pyramidBox">

<svg viewBox="0 0 600 600">

<polygon points="300,40 360,140 240,140" fill="#ef9a9a"/>
<polygon points="240,140 360,140 420,260 180,260" fill="#90caf9"/>
<polygon points="180,260 420,260 500,420 100,420" fill="#a5d6a7"/>
<polygon points="100,420 500,420 560,560 40,560" fill="#ffe082"/>

<text x="300" y="100" text-anchor="middle">Less</text>
<text x="300" y="210" text-anchor="middle">Moderate</text>
<text x="300" y="340" text-anchor="middle">More</text>
<text x="300" y="500" text-anchor="middle">Most</text>

</svg>

</div>

<!-- RIGHT -->
<div class="side">

<div class="sideBox"><div class="sideTitle">Less</div><div id="less"></div></div>
<div class="sideBox"><div class="sideTitle">Moderate</div><div id="moderate"></div></div>
<div class="sideBox"><div class="sideTitle">More</div><div id="more"></div></div>
<div class="sideBox"><div class="sideTitle">Most</div><div id="most"></div></div>

</div>

</div>

</div>

<!-- ================= END SCREEN (CLOSURE FIX) ================= -->
<div id="endScreen">

<h1>🎉 Congratulations!</h1>

<h2>You completed the Food Pyramid!</h2>

<div style="font-size:5rem;">🏆</div>

<p>Great job building a healthy balanced diet.</p>

<button class="btn" onclick="location.reload()">Play Again</button>

</div>

<script>

/* SPLASH */
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("instructions").style.display="block";
},2000);

/* FOOD DATA */
const foods=[
{name:"Apple",emoji:"🍎",group:"more"},
{name:"Rice",emoji:"🍚",group:"most"},
{name:"Milk",emoji:"🥛",group:"moderate"},
{name:"Chips",emoji:"🍟",group:"less"},
{name:"Carrot",emoji:"🥕",group:"more"},
{name:"Candy",emoji:"🍬",group:"less"},
{name:"Fish",emoji:"🐟",group:"moderate"},
{name:"Bread",emoji:"🍞",group:"most"}
];

let shuffled=[];
let i=0;
let active=false;

/* START */
function startGame(){
document.getElementById("instructions").style.display="none";
document.getElementById("game").style.display="block";

shuffled=[...foods].sort(()=>Math.random()-0.5);

loadFood();
}

/* LOAD */
function loadFood(){
active=false;
document.getElementById("emoji").textContent=shuffled[i].emoji;
document.getElementById("name").textContent=shuffled[i].name;
document.getElementById("feedback").textContent="Tap food first";
}

/* ACTIVATE */
document.getElementById("foodCard").onclick=()=>{
active=true;
document.getElementById("feedback").textContent="Now tap pyramid";
};

/* CLICK ZONES */
document.querySelectorAll("polygon").forEach((p,index)=>{

p.addEventListener("click",()=>{

if(!active){
document.getElementById("feedback").textContent="Tap food first!";
return;
}

const zones=["less","moderate","more","most"];

check(zones[index]);

});

});

/* CHECK */
function check(zone){

const food=shuffled[i];

if(zone===food.group){

document.getElementById(zone).innerHTML+=
`<div class="item">${food.emoji}</div>`;

i++;

if(i<shuffled.length){
loadFood();
}else{
showEnd();
}

}else{
document.getElementById("feedback").textContent="Try again!";
}

}

/* ================= FINAL CLOSURE FIX ================= */
function showEnd(){

document.getElementById("game").style.display="none";
document.getElementById("instructions").style.display="none";
document.getElementById("endScreen").style.display="block";

}

</script>

</body>
</html>
