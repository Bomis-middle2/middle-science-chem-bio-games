<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atmosphere Explorer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Segoe UI',sans-serif;

background:
linear-gradient(
180deg,
#dff4ff,
#ffffff
);

min-height:100vh;

overflow-x:hidden;

}


/* ================= SPLASH ================= */

#splashScreen{

position:fixed;
inset:0;

background:white;

display:flex;
justify-content:center;
align-items:center;

z-index:9999;

}

#splashLogo{

width:260px;
max-width:80%;

}


/* ================= INTRO ================= */

#introScreen{

display:none;

min-height:100vh;

justify-content:center;
align-items:center;

padding:20px;

}


.introCard{

background:white;

width:100%;
max-width:700px;

padding:30px;

border-radius:25px;

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,.15);

}


.logo{

width:180px;

margin-bottom:15px;

}


.title{

font-size:clamp(28px,5vw,48px);

color:#1565c0;

font-weight:bold;

margin-bottom:15px;

}


.story{

font-size:18px;

line-height:1.7;

color:#444;

}


.startBtn{

margin-top:25px;

padding:15px 40px;

border:none;

border-radius:20px;

background:#1976d2;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


/* ================= GAME ================= */


#gameScreen{

display:none;

padding:15px;

}



.gameHeader{

text-align:center;

margin-bottom:15px;

}


.gameLogo{

width:140px;

}



.gameTitle{

font-size:clamp(24px,5vw,42px);

font-weight:bold;

color:#1565c0;

}



.mainCard{

background:white;

max-width:1000px;

margin:auto;

padding:20px;

border-radius:25px;

box-shadow:
0 10px 30px rgba(0,0,0,.15);

}



.promptBox{

background:#1976d2;

color:white;

padding:15px;

border-radius:18px;

font-size:clamp(18px,3vw,26px);

font-weight:bold;

text-align:center;

margin-bottom:15px;

}



.scoreBox{

text-align:center;

font-size:20px;

font-weight:bold;

color:#2e7d32;

margin-bottom:15px;

}



/* ================= IMAGE AREA ================= */


.atmosphereContainer{

position:relative;

width:100%;

max-width:850px;

margin:auto;

aspect-ratio:16/9;

}



.atmosphereImage{

width:100%;

height:100%;

object-fit:contain;

display:block;

border-radius:20px;

}



/* ================= LAYER BUTTONS ================= */


.layerBtn{

position:absolute;

width:28%;

height:10%;

border-radius:40px;

border:3px solid #0d47a1;

background:white;

color:#0d47a1;

font-size:clamp(12px,2vw,22px);

font-weight:bold;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:5px;

transition:.3s;

}


.layerBtn:hover{

transform:scale(1.05);

}



.filled{

background:#e8f5e9!important;

border-color:#43a047!important;

color:#2e7d32!important;

font-size:clamp(10px,2vw,18px)!important;

}



/* ================= FEEDBACK ================= */


.feedback{

text-align:center;

font-size:20px;

font-weight:bold;

margin-top:15px;

min-height:35px;

}



/* ================= MOBILE ================= */


@media(max-width:768px){


#gameScreen{

padding:10px;

}


.mainCard{

padding:12px;

border-radius:18px;

}


.gameLogo{

width:110px;

}


.gameTitle{

font-size:26px;

}


.promptBox{

font-size:16px;

padding:12px;

}


.scoreBox{

font-size:16px;

}



.atmosphereContainer{

aspect-ratio:3/4;

}



.atmosphereImage{

object-fit:cover;

}



.layerBtn{

width:38%;

height:8%;

font-size:12px;

border-width:2px;

}


}



/* SMALL MOBILE */


@media(max-width:400px){


.layerBtn{

font-size:10px;

}


.gameTitle{

font-size:22px;

}


}

</style>

</head>


<body>


<!-- SPLASH -->

<div id="splashScreen">

<img 
id="splashLogo"
src="assets/innovine-logo.png">

</div>



<!-- INTRO -->


<div id="introScreen">


<div class="introCard">


<img
src="assets/innovine-logo.png"
class="logo">


<h1 class="title">

🌍 ATMOSPHERE EXPLORER

</h1>


<div class="story">

Professor Sky has lost the names of Earth's atmospheric layers.

<br><br>

Help place each atmospheric layer in the correct position.

<br><br>

Tap the correct layer button to complete the atmosphere map.

</div>



<button
class="startBtn"
onclick="startGame()">

🚀 START EXPLORING

</button>


</div>

</div>



<!-- GAME -->


<div id="gameScreen">


<div class="gameHeader">


<img
src="assets/innovine-logo.png"
class="gameLogo">


<div class="gameTitle">

🌍 ATMOSPHERE EXPLORER

</div>


</div>



<div class="mainCard">


<div
id="promptBox"
class="promptBox">

Loading...

</div>


<div class="scoreBox">

⭐ Score:
<span id="score">0</span>

</div>



<div class="atmosphereContainer">


<img
src="assets/atmosphere.png"
class="atmosphereImage">



<button
id="layerA"
class="layerBtn"
style="
top:8%;
left:50%;
transform:translateX(-50%);
">

A

</button>



<button
id="layerB"
class="layerBtn"
style="
top:24%;
left:50%;
transform:translateX(-50%);
">

B

</button>



<button
id="layerC"
class="layerBtn"
style="
top:40%;
left:50%;
transform:translateX(-50%);
">

C

</button>



<button
id="layerD"
class="layerBtn"
style="
top:56%;
left:50%;
transform:translateX(-50%);
">

D

</button>



<button
id="layerE"
class="layerBtn"
style="
top:72%;
left:50%;
transform:translateX(-50%);
">

E

</button>



</div>



<div
id="feedback"
class="feedback">

Tap the correct layer.

</div>


</div>


</div>


<!-- AUDIO -->


<audio id="correctSound"
src="assets/correct.mp3"></audio>


<audio id="wrongSound"
src="assets/wrong.mp3"></audio>


<audio id="clapSound"
src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

/* =========================
   SPLASH SCREEN
========================= */

setTimeout(()=>{

document.getElementById("splashScreen").style.display="none";

document.getElementById("introScreen").style.display="flex";

},3000);



/* =========================
   GAME DATA
========================= */


const layers=[

{
name:"Exosphere",
target:"layerA"
},

{
name:"Thermosphere",
target:"layerB"
},

{
name:"Mesosphere",
target:"layerC"
},

{
name:"Stratosphere",
target:"layerD"
},

{
name:"Troposphere",
target:"layerE"
}

];



let score=0;

let current=0;

let shuffled=[];

let locked=false;



/* =========================
   AUDIO SAFE PLAY
========================= */


function playSound(id){

let sound=document.getElementById(id);

if(sound){

sound.currentTime=0;

sound.play().catch(()=>{});

}

}



/* =========================
   START GAME
========================= */


function startGame(){

document.getElementById("introScreen").style.display="none";

document.getElementById("gameScreen").style.display="block";


score=0;

current=0;

document.getElementById("score").innerHTML=score;


/* Reset buttons */

document.querySelectorAll(".layerBtn").forEach(btn=>{

btn.disabled=false;

btn.classList.remove("filled");

btn.innerHTML=btn.id.replace("layer","");


});


shuffled=[...layers].sort(()=>Math.random()-0.5);


loadRound();

}




/* =========================
   LOAD ROUND
========================= */


function loadRound(){


if(current>=shuffled.length){

showCertificate();

return;

}


locked=false;


document.getElementById("promptBox").innerHTML=

`
Place:

<b>${shuffled[current].name}</b>
`;



document.getElementById("feedback").innerHTML=

"Tap the correct layer.";



}



/* =========================
   BUTTON EVENTS
========================= */


document
.getElementById("layerA")
.onclick=()=>checkLayer("layerA");


document
.getElementById("layerB")
.onclick=()=>checkLayer("layerB");


document
.getElementById("layerC")
.onclick=()=>checkLayer("layerC");


document
.getElementById("layerD")
.onclick=()=>checkLayer("layerD");


document
.getElementById("layerE")
.onclick=()=>checkLayer("layerE");




/* =========================
   CHECK ANSWER
========================= */


function checkLayer(selected){


if(locked) return;


let answer=shuffled[current];



if(selected===answer.target){


locked=true;


score+=10;


document.getElementById("score").innerHTML=score;



playSound("correctSound");



let btn=document.getElementById(selected);


btn.innerHTML=answer.name;


btn.classList.add("filled");

btn.disabled=true;



document.getElementById("feedback").innerHTML=

"✅ Correct!";


current++;



setTimeout(()=>{

loadRound();

},1200);



}

else{


playSound("wrongSound");


document.getElementById("feedback").innerHTML=

"❌ Try Again";


}

}




/* =========================
   CERTIFICATE
========================= */


function showCertificate(){


playSound("clapSound");


document.querySelector(".mainCard").innerHTML=

`

<div style="
text-align:center;
padding:20px;
">


<img
src="assets/innovine-logo.png"
style="
width:150px;
margin-bottom:15px;
">


<h1 style="
color:#1565c0;
font-size:clamp(25px,6vw,45px);
">

🏆 Atmosphere Explorer

</h1>


<div style="
font-size:55px;
margin:20px;
">

🌍 ☁️ ✈️ 🛰️

</div>


<h2 style="
color:#2e7d32;
">

Excellent Work!

</h2>


<p style="
font-size:18px;
line-height:1.6;
">

You correctly identified all layers of Earth's atmosphere.

</p>


<br>


<div style="
background:#e3f2fd;
padding:15px;
border-radius:15px;
font-weight:bold;
line-height:2;
">

Exosphere<br>

Thermosphere<br>

Mesosphere<br>

Stratosphere<br>

Troposphere

</div>


<br>


<h2>

⭐ Final Score:
${score}

</h2>


<br>


<button
onclick="location.reload()"
style="
padding:15px 35px;
background:#43a047;
color:white;
border:none;
border-radius:20px;
font-size:18px;
font-weight:bold;
">

🔄 PLAY AGAIN

</button>


</div>

`;

}



</script>


</body>

</html>
