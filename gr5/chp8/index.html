<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 Atmosphere Explorer</title>

<style>

/* ================= RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(180deg,#dff4ff,#f5fbff);
min-height:100vh;
overflow-x:hidden;
}

/* ================= SPLASH ================= */
#splashScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#splashLogo{
width:300px;
max-width:80%;
animation:zoom 1.5s ease;
}

@keyframes zoom{
from{transform:scale(.6);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* ================= INTRO ================= */
#introScreen{
display:none;
min-height:100vh;
justify-content:center;
align-items:center;
padding:20px;
}

.introCard{
background:white;
max-width:900px;
width:100%;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{width:200px;margin-bottom:15px;}

.title{
font-size:2.5rem;
color:#1565c0;
margin-bottom:15px;
}

.story{
font-size:1.1rem;
line-height:1.6;
color:#444;
}

.startBtn{
margin-top:20px;
padding:15px 35px;
border:none;
border-radius:15px;
background:#1976d2;
color:white;
font-size:1.1rem;
cursor:pointer;
}

/* ================= GAME ================= */
#gameScreen{
display:none;
padding:20px;
}

.gameHeader{
text-align:center;
margin-bottom:15px;
}

.gameLogo{width:150px;}

.gameTitle{
font-size:2rem;
color:#1565c0;
}

/* ================= MAIN CARD ================= */
.mainCard{
max-width:1100px;
margin:auto;
background:white;
padding:20px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

/* ================= PROMPT ================= */
.promptBox{
background:#1976d2;
color:white;
padding:12px;
border-radius:15px;
text-align:center;
font-size:1.2rem;
margin-bottom:15px;
}

/* ================= SCORE ================= */
.scoreBox{
text-align:center;
font-weight:bold;
margin-bottom:15px;
color:#2e7d32;
}

/* ================= ATMOSPHERE ================= */
.atmosphereContainer{
position:relative;
max-width:700px;
margin:auto;
}

.atmosphereImage{
width:100%;
border-radius:15px;
display:block;
}

/* ================= NEW GRID OVERLAY ================= */
.layerGrid{
position:absolute;
inset:0;
display:grid;
grid-template-rows:repeat(5,1fr);
place-items:center;
}

/* ================= BUTTONS ================= */
.layerBtn{
width:60%;
max-width:220px;
height:45px;
border-radius:25px;
border:2px solid #0d47a1;
background:white;
font-size:1rem;
font-weight:bold;
color:#0d47a1;
cursor:pointer;
transition:0.2s;
}

.layerBtn:hover{
transform:scale(1.05);
}

.filled{
background:#e8f5e9 !important;
border:2px solid #43a047 !important;
color:#2e7d32 !important;
}

/* ================= FEEDBACK ================= */
.feedback{
text-align:center;
margin-top:15px;
font-size:1.1rem;
font-weight:bold;
min-height:30px;
}

/* ================= MOBILE FIX ================= */
@media(max-width:768px){

.title{font-size:1.8rem;}
.gameTitle{font-size:1.5rem;}

.layerBtn{
width:80%;
font-size:0.9rem;
}

.promptBox{
font-size:1rem;
}

}

</style>
</head>

<body>

<!-- ================= SPLASH ================= -->
<div id="splashScreen">
<img id="splashLogo" src="assets/innovine-logo.png">
</div>

<!-- ================= INTRO ================= -->
<div id="introScreen">

<div class="introCard">

<img class="logo" src="assets/innovine-logo.png">

<h1 class="title">🌍 ATMOSPHERE EXPLORER</h1>

<div class="story">
Professor Sky has lost the atmospheric layers.<br><br>
Tap the correct layer position for each layer.
</div>

<button class="startBtn" onclick="startGame()">🚀 START</button>

</div>

</div>

<!-- ================= GAME ================= -->
<div id="gameScreen">

<div class="gameHeader">
<img class="gameLogo" src="assets/innovine-logo.png">
<div class="gameTitle">🌍 ATMOSPHERE EXPLORER</div>
</div>

<div class="mainCard">

<div class="promptBox" id="promptBox">Loading...</div>

<div class="scoreBox">⭐ Score: <span id="score">0</span></div>

<div class="atmosphereContainer">

<img class="atmosphereImage" src="assets/atmosphere.png">

<!-- GRID BUTTONS -->
<div class="layerGrid">

<button id="layerA" class="layerBtn">A</button>
<button id="layerB" class="layerBtn">B</button>
<button id="layerC" class="layerBtn">C</button>
<button id="layerD" class="layerBtn">D</button>
<button id="layerE" class="layerBtn">E</button>

</div>

</div>

<div class="feedback" id="feedback">Tap the correct layer</div>

</div>

</div>

<!-- ================= AUDIO ================= -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

/* ================= SPLASH ================= */
setTimeout(()=>{
document.getElementById("splashScreen").style.display="none";
document.getElementById("introScreen").style.display="flex";
},1500);

/* ================= START GAME ================= */
function startGame(){
document.getElementById("introScreen").style.display="none";
document.getElementById("gameScreen").style.display="block";
startRound();
}

/* ================= SCORE ================= */
let score=0;

/* ================= DATA ================= */
const layers=[
{name:"Troposphere",target:"layerE"},
{name:"Stratosphere",target:"layerD"},
{name:"Mesosphere",target:"layerC"},
{name:"Thermosphere",target:"layerB"},
{name:"Exosphere",target:"layerA"}
];

/* ================= SHUFFLE ================= */
function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}

let gameLayers=shuffle([...layers]);
let index=0;

/* ================= ROUND ================= */
function startRound(){

if(index>=gameLayers.length){
showEnd();
return;
}

document.getElementById("promptBox").innerHTML=
"Place: <b>"+gameLayers[index].name+"</b>";

}

/* ================= CLICK ================= */
document.querySelectorAll(".layerBtn").forEach(btn=>{
btn.onclick=()=>check(btn.id);
});

/* ================= CHECK ================= */
function check(id){

let current=gameLayers[index];

if(id===current.target){

document.getElementById("correctSound").play();

score+=10;
document.getElementById("score").innerText=score;

document.getElementById(id).innerText=current.name;
document.getElementById(id).classList.add("filled");

document.getElementById("feedback").innerText="Correct!";

index++;
setTimeout(startRound,800);

}else{

document.getElementById("wrongSound").play();
document.getElementById("feedback").innerText="Try Again!";

}

}

/* ================= END ================= */
function showEnd(){

document.getElementById("clapSound").play();

document.querySelector(".mainCard").innerHTML=`
<div style="text-align:center;padding:20px;">

<img src="assets/innovine-logo.png" style="width:200px;">

<h1>🎉 Great Job!</h1>

<p>You completed Atmosphere Explorer</p>

<div style="font-size:3rem;">🌍☁️🚀</div>

<h2>Final Score: ${score}</h2>

<button class="startBtn" onclick="location.reload()">Play Again</button>

</div>
`;

}

</script>

</body>
</html>
