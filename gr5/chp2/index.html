<style>

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
"Trebuchet MS",
Arial,
sans-serif;

background:
linear-gradient(
180deg,
#a5d8ff,
#d8f3dc
);

overflow-x:hidden;

}

/* =========================
   APP
========================= */

#app{

max-width:1200px;

margin:auto;

padding:15px;

}

/* =========================
   TOP BAR
========================= */

.topBar{

display:flex;

flex-wrap:wrap;

gap:10px;

justify-content:center;

margin-bottom:15px;

}

.statCard{

background:white;

padding:12px 18px;

border-radius:15px;

font-weight:bold;

box-shadow:
0 4px 10px
rgba(0,0,0,.12);

min-width:140px;

text-align:center;

}

/* =========================
   SCREEN
========================= */

.screen{

background:white;

border-radius:25px;

padding:20px;

box-shadow:
0 8px 20px
rgba(0,0,0,.15);

min-height:70vh;

}

/* =========================
   BUTTONS
========================= */

.gameBtn{

border:none;

background:#2e7d32;

color:white;

padding:15px 25px;

border-radius:15px;

font-size:1rem;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

.gameBtn:hover{

transform:
translateY(-2px);

}

.optionBtn{

width:100%;

padding:15px;

margin-top:10px;

border:none;

border-radius:15px;

background:#1976d2;

color:white;

font-size:1rem;

cursor:pointer;

}

.optionBtn:hover{

opacity:.9;

}

/* =========================
   START SCREEN
========================= */

.startContainer{

text-align:center;

}

.gameTitle{

font-size:
clamp(
2rem,
6vw,
4rem
);

color:#4a148c;

margin-bottom:10px;

}

.subtitle{

font-size:1.1rem;

margin-bottom:20px;

}

.mascot{

width:220px;

margin:auto;

display:block;

}

/* =========================
   MAP
========================= */

.mapContainer{

text-align:center;

}

.mapPath{

display:flex;

flex-direction:column;

align-items:center;

gap:12px;

margin-top:20px;

}

.mapNode{

background:#fff3cd;

padding:12px 20px;

border-radius:20px;

font-weight:bold;

width:280px;

box-shadow:
0 3px 8px
rgba(0,0,0,.12);

}

/* =========================
   LEVEL
========================= */

.levelTitle{

text-align:center;

font-size:2rem;

margin-bottom:15px;

color:#4a148c;

}

.challengeBox{

background:#f8f9fa;

padding:20px;

border-radius:20px;

margin-top:15px;

}

.question{

font-size:1.2rem;

font-weight:bold;

margin-bottom:15px;

text-align:center;

}

/* =========================
   PARTICLE BOX
========================= */

.particleArea{

height:220px;

border-radius:20px;

background:#eef7ff;

position:relative;

overflow:hidden;

margin-bottom:15px;

}

/* =========================
   FEEDBACK
========================= */

#feedback{

margin-top:15px;

font-weight:bold;

text-align:center;

min-height:40px;

}

/* =========================
   BADGE POPUP
========================= */

.badgePopup{

background:#fff3cd;

padding:20px;

border-radius:20px;

text-align:center;

margin-top:20px;

}

/* =========================
   CERTIFICATE
========================= */

.certificate{

border:8px solid gold;

border-radius:25px;

padding:30px;

text-align:center;

background:#fffdf5;

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

.levelTitle{

font-size:1.5rem;

}

.optionBtn{

font-size:.95rem;

}

}

</style>

/* =========================

function startLevel(

challenge=0;

}

/* =========================

========================= */

/* =========================
   LOAD CHALLENGE
========================= */

function loadChallenge(){

const currentLevel =
levels[level];

const currentChallenge =
currentLevel.challenges[challenge];

let visualHTML = "";

if(
currentChallenge.type==="state"
){

visualHTML =

`
<div class="particleArea"
id="particleArea">

</div>
`;

}

if(
currentChallenge.type==="heat"
){

visualHTML =

`
<div style="
font-size:6rem;
text-align:center;
margin:20px;
">

${currentChallenge.visual}

</div>
`;

}

document
.getElementById(
"gameScreen"
)
.innerHTML=

`
<h2 class="levelTitle">

${currentLevel.theme}
${currentLevel.name}

</h2>

<div class="challengeBox">

<div class="question">

${currentChallenge.question}

</div>

${visualHTML}

<div id="optionsArea">

</div>

<div id="feedback">

</div>

</div>
`;

renderOptions();

if(
currentChallenge.type==="state"
){

renderParticles(
currentChallenge.particleType
);

}

}

/* =========================
   PARTICLE ANIMATION
========================= */

function renderParticles(
type
){

const area =
document.getElementById(
"particleArea"
);

if(!area)return;

area.innerHTML="";

let count = 15;

for(
let i=0;
i<count;
i++
){

const particle =
document.createElement(
"div"
);

particle.style.position=
"absolute";

particle.style.width=
"14px";

particle.style.height=
"14px";

particle.style.borderRadius=
"50%";

particle.style.background=
"#1976d2";

if(
type==="solid"
){

particle.style.left=
(40+(i%5)*25)+"px";

particle.style.top=
(50+Math.floor(i/5)*25)+"px";

}

else if(
type==="gas"
){

particle.style.left=
Math.random()*250+"px";

particle.style.top=
Math.random()*150+"px";

animateGas(
particle
);

}

area.appendChild(
particle
);

}

}

/* =========================
   GAS MOVEMENT
========================= */

function animateGas(
particle
){

let x=
parseFloat(
particle.style.left
);

let y=
parseFloat(
particle.style.top
);

setInterval(()=>{

x+=
(Math.random()*10)-5;

y+=
(Math.random()*10)-5;

if(x<0)x=0;
if(y<0)y=0;

if(x>260)x=260;
if(y>160)y=160;

particle.style.left=
x+"px";

particle.style.top=
y+"px";

},500);

}

/* =========================
   OPTIONS
========================= */

function renderOptions(){

const currentLevel =
levels[level];

const currentChallenge =
currentLevel.challenges[challenge];

const optionsArea =
document.getElementById(
"optionsArea"
);

currentChallenge.options.forEach(
option=>{

optionsArea.innerHTML +=

`
<button

class="optionBtn"

onclick="checkAnswer('${option}')">

${option}

</button>
`;

});

}

/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
selected
){

const currentLevel =
levels[level];

const currentChallenge =
currentLevel.challenges[challenge];

const feedback =
document.getElementById(
"feedback"
);

if(
selected===
currentChallenge.answer
){

score += 10;

document
.getElementById(
"score"
)
.innerHTML=
score;

feedback.innerHTML=

`
✅ Correct!
`;

feedback.style.color=
"green";

setTimeout(()=>{

nextChallenge();

},800);

}
else{

feedback.innerHTML=

`
❌ Try Again
`;

feedback.style.color=
"red";

}

}

/* =========================
   NEXT CHALLENGE
========================= */

function nextChallenge(){

const currentLevel =
levels[level];

challenge++;

if(
challenge<
currentLevel.challenges.length
){

loadChallenge();

}
else{

awardBadge();

}

}

/* =========================
   BADGE SCREEN
========================= */

function awardBadge(){

const currentLevel =
levels[level];

badgeCount++;

earnedBadges.push(
currentLevel.badge
);

document
.getElementById(
"badges"
)
.innerHTML=
badgeCount;

.getElementById(
"gameScreen"
)
.innerHTML=

`
<div class="badgePopup">

<h2>

${currentLevel.badge}

</h2>

<br>

<p>

Mission Complete!

</p>

<br>

<button

class="gameBtn"

onclick="nextLevel()">

</button>

</div>
`;

/* =========================
   NEXT LEVEL
========================= */

function nextLevel(){

level++;

if(
level<
levels.length
){

level

}
else{

showCertificate();

}

}
/* =========================
   ENHANCED VISUALS
========================= */

function getVisualHTML(
challengeData
){

/* =========================
   PARTICLE LAB
========================= */

if(
challengeData.type==="state"
){

return

`
<div
class="particleArea"
id="particleArea">

</div>
`;

}

/* =========================
   HEAT ROOM
========================= */

if(
challengeData.type==="heat"
){

return

`
<div
style="
text-align:center;
">

<div
id="heatVisual"
style="
font-size:6rem;
margin:20px;
">

${challengeData.visual}

</div>

<div
style="
font-size:2rem;
">

🔥 ➜ ❄️

</div>

</div>
`;

}

/* =========================
   FACTORY
========================= */

if(
challengeData.type==="factory"
){

const parts=
challengeData.question.split(
"→"
);

return

`
<div
style="
text-align:center;
font-size:4rem;
padding:20px;
">

<span>

${parts[0]}

</span>

➡️

<span>

${parts[1]}

</span>

</div>

<div
style="
background:#eceff1;
height:20px;
border-radius:20px;
margin-top:10px;
">

</div>
`;

}

/* =========================
   WEATHER
========================= */

if(
challengeData.type==="weather"
){

let icon="🌦️";

if(
challengeData.question
.includes("dew")
){

icon="🌿";

}

if(
challengeData.question
.includes("clothes")
){

icon="👕";

}

return

`
<div
style="
text-align:center;
font-size:6rem;
padding:20px;
">

${icon}

</div>
`;

}

/* =========================
   FINALE
========================= */

if(
challengeData.type==="finale"
){

let icon="🌎";

if(
challengeData.question
.includes("mirror")
){

icon="🪞";

}

if(
challengeData.question
.includes("key")
){

icon="🗝️";

}

if(
challengeData.question
.includes("cloud")
){

icon="☁️";

}

if(
challengeData.question
.includes("rain")
){

icon="🌧️";

}

return

`
<div
style="
text-align:center;
font-size:6rem;
padding:20px;
">

${icon}

</div>
`;

}

return "";

}
