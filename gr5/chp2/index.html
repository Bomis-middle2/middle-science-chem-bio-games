<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Mysteries Challenge</title>

<style>

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:
linear-gradient(
180deg,
#dff6ff,
#ffffff
);

min-height:100vh;

padding:20px;

display:flex;

justify-content:center;

align-items:center;

}

/* =========================
   GAME CONTAINER
========================= */

.gameContainer{

width:100%;

max-width:900px;

background:white;

border-radius:25px;

padding:25px;

box-shadow:
0 10px 25px rgba(0,0,0,.15);

}

/* =========================
   HEADER
========================= */

.topBar{

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:10px;

margin-bottom:20px;

}

.scoreBox{

background:#e3f2fd;

padding:10px 18px;

border-radius:15px;

font-weight:bold;

}

.progressBox{

background:#fff3cd;

padding:10px 18px;

border-radius:15px;

font-weight:bold;

}

/* =========================
   TITLE
========================= */

.gameTitle{

text-align:center;

font-size:
clamp(1.8rem,4vw,3rem);

color:#1565c0;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#555;

margin-bottom:25px;

}

/* =========================
   CARD
========================= */

.card{

text-align:center;

}

.cardImage{

width:100%;

max-width:700px;

height:auto;

border-radius:20px;

box-shadow:
0 5px 15px rgba(0,0,0,.15);

margin-bottom:20px;

}

.question{

font-size:1.25rem;

font-weight:bold;

margin-bottom:20px;

line-height:1.5;

}

/* =========================
   OPTIONS
========================= */

.options{

max-width:550px;

margin:auto;

}

.optionBtn{

display:block;

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:15px;

background:#2196f3;

color:white;

font-size:1rem;

font-weight:bold;

cursor:pointer;

transition:.2s;

}

.optionBtn:hover{

transform:scale(1.02);

}

/* =========================
   FEEDBACK
========================= */

#feedback{

margin-top:20px;

font-size:1.1rem;

font-weight:bold;

min-height:70px;

}

.correct{

color:#2e7d32;

}

.wrong{

color:#c62828;

}

/* =========================
   NEXT BUTTON
========================= */

.nextBtn{

background:#43a047;

color:white;

border:none;

padding:14px 25px;

border-radius:15px;

font-size:1rem;

font-weight:bold;

cursor:pointer;

margin-top:15px;

display:none;

}

/* =========================
   RESULT SCREEN
========================= */

.resultScreen{

text-align:center;

padding:30px;

}

.resultScore{

font-size:3rem;

margin:20px 0;

color:#1565c0;

}

.playAgain{

background:#1565c0;

color:white;

border:none;

padding:15px 30px;

border-radius:15px;

font-size:1rem;

font-weight:bold;

cursor:pointer;

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

.question{

font-size:1.05rem;

}

.optionBtn{

font-size:.95rem;

}

}

</style>

</head>

<body>

<div class="gameContainer">

<div class="topBar">

<div class="scoreBox">

⭐ Score:
<span id="score">

0

</span>

</div>

<div class="progressBox">

Mystery
<span id="progress">

1

</span>

/4

</div>

</div>

<h1 class="gameTitle">

🌦️ Weather Mysteries Challenge

</h1>

<p class="subtitle">

Solve the mystery using your knowledge of states of matter.

</p>

<div id="gameArea">

</div>

</div>

<!-- OPTIONAL AUDIO -->

<audio
id="correctSound"
src="assets/correct.mp3">
</audio>

<audio
id="wrongSound"
src="assets/wrong.mp3">
</audio>

<script>

/* =========================
   GAME DATA
========================= */

const mysteries = [

{
image:
"assets/morning-dew.png",

question:
"Tiny water droplets appeared on the grass early in the morning. How did they form?",

options:[
"Condensation",
"Evaporation",
"Freezing"
],

answer:
"Condensation",

feedback:
"Water vapour in the air cooled and changed into tiny liquid droplets."
},

{
image:
"assets/missing-puddle.png",

question:
"A puddle was seen in the morning but disappeared by afternoon. What happened to the water?",

options:[
"Evaporation",
"Freezing",
"Melting"
],

answer:
"Evaporation",

feedback:
"The Sun heated the water and changed it into water vapour."
},

{
image:
"assets/foggy-window.png",

question:
"The window became covered with tiny water droplets. What caused this?",

options:[
"Condensation",
"Freezing",
"Melting"
],

answer:
"Condensation",

feedback:
"Water vapour cooled when it touched the cold glass."
},

{
image:
"assets/frozen-bottle.png",

question:
"The water inside the bottle turned into ice. Which change took place?",

options:[
"Freezing",
"Melting",
"Evaporation"
],

answer:
"Freezing",

feedback:
"Water lost heat and changed from liquid to solid."
}

];

let currentQuestion = 0;

let score = 0;

/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

const q =
mysteries[
currentQuestion
];
const gameArea =
document.getElementById(
"gameArea"
);

document.getElementById(
"progress"
).innerHTML =
currentQuestion + 1;

let optionsHTML = "";

q.options.forEach(option=>{

optionsHTML +=

`
<button

class="optionBtn"

onclick="checkAnswer('${option}')">

${option}

</button>
`;

});

gameArea.innerHTML =

`
<div class="card">

<img
src="${q.image}"
class="cardImage">

<div class="question">

${q.question}

</div>

<div class="options">

${optionsHTML}

</div>

<div
id="feedback">

</div>

<button

id="nextBtn"

class="nextBtn"

onclick="nextQuestion()">

Next Mystery →

</button>

</div>
`;

}

/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
selected
){

const q =
mysteries[
currentQuestion
];

const feedback =
document.getElementById(
"feedback"
);

const nextBtn =
document.getElementById(
"nextBtn"
);

const buttons =
document.querySelectorAll(
".optionBtn"
);

buttons.forEach(btn=>{

btn.disabled = true;

});

if(
selected === q.answer
){

if(selected === q.answer){
    score += 10;
}

document
.getElementById(
"score"
)
.innerHTML =
score;

const correctSound =
document.getElementById(
"correctSound"
);

if(correctSound){

correctSound.play().catch(()=>{});

}

feedback.className =
"correct";

feedback.innerHTML =

`
✅ Correct!

<br><br>

${q.feedback}
`;

}
else{

const wrongSound =
document.getElementById(
"wrongSound"
);

if(wrongSound){

wrongSound.play().catch(()=>{});

}

feedback.className =
"wrong";

feedback.innerHTML =

`
❌ Incorrect

<br><br>

Correct Answer:
<b>${q.answer}</b>

<br><br>

${q.feedback}
`;

}

nextBtn.style.display =
"inline-block";

}

/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

currentQuestion++;

if(
currentQuestion <
mysteries.length
){

loadQuestion();

}
else{

showResults();

}

}

/* =========================
   RESULTS
========================= */

function showResults(){

let message =
"Great Job!";

if(score === 40){

message =
"🏆 Weather Expert!";
}
else if(score >= 30){

message =
"🌟 Excellent Detective!";
}
else if(score >= 20){

message =
"👍 Good Observation Skills!";
}

gameArea.innerHTML =

`
<div class="resultScreen">

<h2>

🎉 Challenge Complete

</h2>

<div
class="resultScore">

${score}/40

</div>

<h3>

${message}

</h3>

<br>

<p>

You solved all four weather mysteries.

</p>

<br>

<button

class="playAgain"

onclick="restartGame()">

🔄 Play Again

</button>

</div>
`;

}

/* =========================
   RESTART
========================= */

function restartGame(){

currentQuestion = 0;

score = 0;

document
.getElementById(
"score"
)
.innerHTML = "0";

document
.getElementById(
"progress"
)
.innerHTML = "1";

loadQuestion();

}

/* =========================
   START GAME
========================= */

loadQuestion();

</script>

</body>
</html>
