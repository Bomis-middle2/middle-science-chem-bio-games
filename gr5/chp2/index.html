<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Detective Deluxe</title>

<style>

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:linear-gradient(
180deg,
#dff6ff,
#f5fbff
);
min-height:100vh;
overflow-x:hidden;
}

/* =========================
   APP
========================= */

#app{
max-width:1200px;
margin:auto;
padding:15px;
}

/* =========================
   TOP BAR
========================= */

.topBar{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:15px;
}

.statCard{
background:white;
padding:12px 18px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
font-weight:bold;
min-width:150px;
text-align:center;
}

/* =========================
   MAIN SCREEN
========================= */

.screen{
background:white;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
padding:20px;
min-height:75vh;
}

/* =========================
   START SCREEN
========================= */

.startScreen{
text-align:center;
}

.startScreen img{
width:min(260px,80%);
margin-bottom:20px;
}

.gameTitle{
font-size:clamp(2rem,5vw,4rem);
color:#1b4965;
margin-bottom:10px;
}

.subtitle{
font-size:1.1rem;
margin-bottom:25px;
color:#444;
}

/* =========================
   BUTTONS
========================= */

.gameBtn{
background:#1976d2;
color:white;
border:none;
padding:15px 25px;
border-radius:15px;
font-size:1rem;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.gameBtn:hover{
transform:translateY(-2px);
}

.optionBtn{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:15px;
background:#2196f3;
color:white;
font-size:1rem;
cursor:pointer;
}

.optionBtn:hover{
opacity:.9;
}

/* =========================
   DETECTIVE BOARD
========================= */

.boardTitle{
text-align:center;
font-size:2rem;
margin-bottom:20px;
color:#1b4965;
}

.caseBoard{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.caseCard{

background:#f8fbff;

border:3px solid #dbeafe;

border-radius:20px;

padding:20px;

text-align:center;

cursor:pointer;

transition:.2s;

}

.caseCard:hover{
transform:scale(1.02);
}

.caseCard.locked{
opacity:.5;
cursor:not-allowed;
}

.caseIcon{
font-size:3rem;
margin-bottom:10px;
}

.caseName{
font-weight:bold;
font-size:1.1rem;
}

/* =========================
   CASE SCREEN
========================= */

.caseHeader{
text-align:center;
margin-bottom:15px;
}

.caseHeader h2{
color:#1b4965;
}

.caseImage{
width:100%;
max-width:700px;
display:block;
margin:auto;
border-radius:20px;
box-shadow:0 5px 12px rgba(0,0,0,.15);
margin-bottom:20px;
}

.question{
font-size:1.2rem;
font-weight:bold;
text-align:center;
margin-bottom:15px;
}

.feedback{
text-align:center;
font-weight:bold;
margin-top:15px;
min-height:40px;
}

/* =========================
   SOLVED SCREEN
========================= */

.solvedScreen{
text-align:center;
}

.solvedScreen img{
width:220px;
margin-bottom:20px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

.caseBoard{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div id="app">

<div class="topBar">

<div class="statCard">
⭐ Score:
<span id="score">0</span>
</div>

<div class="statCard">
🏅 Cases Solved:
<span id="casesSolved">0</span>
</div>

<div class="statCard">
🕵️ Rank:
<span id="rank">Rookie</span>
</div>

</div>

<div id="gameScreen" class="screen">

<!-- JS WILL LOAD CONTENT -->

</div>

</div>

<!-- AUDIO -->

<audio
id="correctSound"
src="assets/correct.mp3">
</audio>

<audio
id="wrongSound"
src="assets/wrong.mp3">
</audio>

<audio
id="clapSound"
src="assets/freesound_community-claps-44774.mp3">
</audio>

<script>

/* =========================
   GAME STATE
========================= */

let score = 0;

let solvedCases = 0;

let currentCase = 0;

/* =========================
   CASE LOCKS
========================= */

const unlockedCases = [true,false,false,false,false];

/* =========================
   CASE ICONS
========================= */

const caseIcons = [

"🌿",
"💧",
"🚪",
"❄️",
"🏆"

];

/* =========================
   CASE NAMES
========================= */

const caseNames = [

"Morning Mystery",
"Missing Puddle",
"Foggy Window",
"Frozen Bottle",
"Final Challenge"

];

/* =========================
   START SCREEN
========================= */

function showStartScreen(){

document.getElementById(
"gameScreen"
).innerHTML =

`
<div class="startScreen">

<img
src="assets/professor-particle.png"
alt="Professor Particle">

<h1 class="gameTitle">

Weather Detective Deluxe

</h1>

<p class="subtitle">

Professor Particle needs your help!

Solve all weather mysteries
and become a Master Weather Detective.

</p>

<button
class="gameBtn"
onclick="showDetectiveBoard()">

🔍 Start Investigation

</button>

</div>
`;

}

/* =========================
   DETECTIVE BOARD
========================= */

function showDetectiveBoard(){

let boardHTML = "";

for(let i=0;i<5;i++){

boardHTML +=

`
<div

class="caseCard
${unlockedCases[i] ? '' : 'locked'}"

onclick="
${unlockedCases[i]
? `openCase(${i})`
: ''}
">

<div class="caseIcon">

${unlockedCases[i]
? caseIcons[i]
: '🔒'}

</div>

<div class="caseName">

${caseNames[i]}

</div>

</div>
`;

}

document.getElementById(
"gameScreen"
).innerHTML =

`
<h2 class="boardTitle">

🕵️ Detective Headquarters

</h2>

<div class="caseBoard">

${boardHTML}

</div>
`;

}

showStartScreen();
/* =========================
   CASE DATA
========================= */

const cases = [

{
title:"Morning Mystery",

image:"assets/morning-dew.png",

question:
"How did the water droplets on the grass form?",

options:[
"Condensation",
"Evaporation",
"Freezing"
],

answer:"Condensation",

explanation:
"Water vapour cooled and changed into tiny liquid droplets."
},

{
title:"Missing Puddle",

image:"assets/missing-puddle.png",

question:
"Where did the puddle go?",

options:[
"Evaporation",
"Melting",
"Freezing"
],

answer:"Evaporation",

explanation:
"The Sun heated the water and it changed into water vapour."
},

{
title:"Foggy Window",

image:"assets/foggy-window.png",

question:
"Why did the window become foggy?",

options:[
"Condensation",
"Freezing",
"Melting"
],

answer:"Condensation",

explanation:
"Water vapour touched the cool glass and became liquid droplets."
},

{
title:"Frozen Bottle",

image:"assets/frozen-bottle.png",

question:
"What change happened to the water?",

options:[
"Freezing",
"Melting",
"Evaporation"
],

answer:"Freezing",

explanation:
"The liquid water cooled and became solid ice."
}

];

/* =========================
   OPEN CASE
========================= */

function openCase(index){

currentCase = index;

const c = cases[index];

document.getElementById(
"gameScreen"
).innerHTML =

`
<div class="caseHeader">

<h2>

🕵️ ${c.title}

</h2>

</div>

<img
src="${c.image}"
class="caseImage">

<div class="question">

${c.question}

</div>

<div id="optionsArea">

</div>

<div
id="feedback"
class="feedback">

</div>
`;

renderOptions();

}

/* =========================
   RENDER OPTIONS
========================= */

function renderOptions(){

const c = cases[currentCase];

const area =
document.getElementById(
"optionsArea"
);

let html="";

c.options.forEach(option=>{

html +=

`
<button

class="optionBtn"

onclick="checkAnswer('${option}')">

${option}

</button>
`;

});

area.innerHTML = html;

}

/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(answer){

const c =
cases[currentCase];

const feedback =
document.getElementById(
"feedback"
);

if(
answer===c.answer
){

document
.getElementById(
"correctSound"
).play();

score += 10;

document
.getElementById(
"score"
).innerHTML =
score;

feedback.style.color=
"green";

feedback.innerHTML=

`
✅ Correct!

<br><br>

${c.explanation}
`;

setTimeout(()=>{

showSolvedScreen();

},1500);

}
else{

document
.getElementById(
"wrongSound"
).play();

feedback.style.color=
"red";

feedback.innerHTML=

`
❌ Not Quite.

Try Again.
`;

}

}

/* =========================
   CASE SOLVED
========================= */

function showSolvedScreen(){

solvedCases++;

document
.getElementById(
"casesSolved"
).innerHTML =
solvedCases;

if(
solvedCases===1
){
document
.getElementById(
"rank"
).innerHTML =
"Junior Detective";
}

if(
solvedCases===2
){
document
.getElementById(
"rank"
).innerHTML =
"Weather Detective";
}

if(
solvedCases===3
){
document
.getElementById(
"rank"
).innerHTML =
"Senior Detective";
}

if(
solvedCases===4
){
document
.getElementById(
"rank"
).innerHTML =
"Master Detective";
}

unlockedCases[
currentCase+1
] = true;

document
.getElementById(
"gameScreen"
).innerHTML =

`
<div class="solvedScreen">

<img
src="assets/case-solved.png">

<h2>

CASE SOLVED!

</h2>

<br>

<p>

Excellent Detective Work!

</p>

<br>

<button

class="gameBtn"

onclick="continueInvestigation()">

Continue

</button>

</div>
`;

}

/* =========================
   CONTINUE
========================= */

function continueInvestigation(){

if(
solvedCases < 4
){

showDetectiveBoard();

}
else{

showFinalChallenge();

}

}
/* =========================
   FINAL CHALLENGE DATA
========================= */

const finalQuestions = [

{
emoji:"🍦",
question:"Ice cream dripping on a hot day",

options:[
"Melting",
"Freezing",
"Condensation"
],

answer:"Melting"
},

{
emoji:"👕",
question:"Clothes drying in sunlight",

options:[
"Evaporation",
"Freezing",
"Melting"
],

answer:"Evaporation"
},

{
emoji:"☁️",
question:"Clouds forming in the sky",

options:[
"Condensation",
"Evaporation",
"Melting"
],

answer:"Condensation"
},

{
emoji:"🧊",
question:"Water becoming ice",

options:[
"Freezing",
"Evaporation",
"Melting"
],

answer:"Freezing"
}

];

let finalIndex = 0;

/* =========================
   FINAL CHALLENGE
========================= */

function showFinalChallenge(){

finalIndex = 0;

loadFinalQuestion();

}

/* =========================
   LOAD FINAL QUESTION
========================= */

function loadFinalQuestion(){

const q =
finalQuestions[
finalIndex
];

let buttons="";

q.options.forEach(option=>{

buttons +=

`
<button

class="optionBtn"

onclick="checkFinalAnswer('${option}')">

${option}

</button>
`;

});

document
.getElementById(
"gameScreen"
).innerHTML =

`
<div
style="
text-align:center;
">

<h2>

🏆 Master Detective Challenge

</h2>

<br>

<p>

Question
${finalIndex+1}
of
4

</p>

<br>

<div
style="
font-size:6rem;
">

${q.emoji}

</div>

<br>

<div
class="question">

${q.question}

</div>

${buttons}

<div
id="feedback"
class="feedback">

</div>

</div>
`;

}

/* =========================
   CHECK FINAL ANSWER
========================= */

function checkFinalAnswer(
answer
){

const q =
finalQuestions[
finalIndex
];

const feedback =
document
.getElementById(
"feedback"
);

if(
answer===
q.answer
){

document
.getElementById(
"correctSound"
).play();

score += 10;

document
.getElementById(
"score"
).innerHTML =
score;

feedback.style.color=
"green";

feedback.innerHTML=

`
✅ Correct!
`;

setTimeout(()=>{

finalIndex++;

if(
finalIndex <
finalQuestions.length
){

loadFinalQuestion();

}
else{

showMasterAward();

}

},1000);

}
else{

document
.getElementById(
"wrongSound"
).play();

feedback.style.color=
"red";

feedback.innerHTML=

`
❌ Try Again
`;

}

}

/* =========================
   MASTER DETECTIVE AWARD
========================= */

function showMasterAward(){

document
.getElementById(
"clapSound"
).play();

document
.getElementById(
"rank"
).innerHTML =
"Master Detective";

document
.getElementById(
"gameScreen"
).innerHTML =

`
<div
style="
text-align:center;
padding:20px;
">

<h1>

🏆

</h1>

<h2>

MASTER WEATHER DETECTIVE

</h2>

<br>

<p>

You solved all weather mysteries!

</p>

<br>

<h2>

⭐ Score:
${score}

</h2>

<br>

<button

class="gameBtn"

onclick="showCertificateForm()">

🎓 Claim Certificate

</button>

</div>
`;

}

/* =========================
   CERTIFICATE FORM
========================= */

function showCertificateForm(){

document
.getElementById(
"gameScreen"
).innerHTML =

`
<div
style="
text-align:center;
">

<h2>

🎓 Certificate

</h2>

<br>

<input

id="studentName"

type="text"

placeholder="Enter Student Name"

style="
padding:12px;
width:300px;
max-width:90%;
border-radius:12px;
border:1px solid #ccc;
">

<br><br>

<button

class="gameBtn"

onclick="generateCertificate()">

Generate

</button>

</div>
`;

}
/* =========================
   GENERATE CERTIFICATE
========================= */

function generateCertificate(){

const studentName =
document
.getElementById(
"studentName"
)
.value
.trim();

if(
studentName === ""
){

alert(
"Please enter your name."
);

return;

}

document
.getElementById(
"gameScreen"
).innerHTML =

`
<div
style="
max-width:900px;
margin:auto;
background:#fffdf5;
border:8px solid gold;
border-radius:25px;
padding:30px;
text-align:center;
">

<div
style="
font-size:4rem;
">

🏆

</div>

<h1
style="
color:#1b4965;
">

MASTER WEATHER DETECTIVE

</h1>

<br>

<h2>

Certificate of Achievement

</h2>

<br><br>

<p>

This certificate is proudly awarded to

</p>

<br>

<h1
style="
color:#1976d2;
">

${studentName}

</h1>

<br>

<p>

for successfully solving all weather mysteries and demonstrating excellent understanding of

</p>

<br>

<h2>

States of Matter & Changes of State

</h2>

<br>

<h2>

⭐ Final Score:
${score}

</h2>

<br>

<div
style="
font-size:5rem;
">

🏅

</div>

<br>

<div
style="
font-size:1.3rem;
font-weight:bold;
color:#1b4965;
">

Professor Particle

</div>

<div>

Lead Investigator

</div>

<br>

<button

class="gameBtn"

onclick="playAgain()">

🔄 Play Again

</button>

</div>
`;

}

/* =========================
   PLAY AGAIN
========================= */

function playAgain(){

score = 0;

solvedCases = 0;

currentCase = 0;

for(
let i=1;
i<unlockedCases.length;
i++
){

unlockedCases[i] = false;

}

document
.getElementById(
"score"
)
.innerHTML = "0";

document
.getElementById(
"casesSolved"
)
.innerHTML = "0";

document
.getElementById(
"rank"
)
.innerHTML = "Rookie";

showStartScreen();

}

/* =========================
   END GAME
========================= */

</script>

</body>
</html>
