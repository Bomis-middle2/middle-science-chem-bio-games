<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

🚜 Farming Master

</title>

<style>

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
'Segoe UI',
sans-serif;

background:
linear-gradient(
rgba(255,255,255,.88),
rgba(255,255,255,.88)
),
url('assets/bg-farming.png');

background-size:cover;
background-position:center;
background-attachment:fixed;

min-height:100vh;

overflow-x:hidden;

}

/* =========================
   SPLASH SCREEN
========================= */

#splashScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:white;

display:flex;

justify-content:center;
align-items:center;

z-index:9999;

}

#splashLogo{

width:320px;
max-width:85%;

animation:
logoZoom 1.5s ease;

}

@keyframes logoZoom{

0%{
opacity:0;
transform:scale(.6);
}

100%{
opacity:1;
transform:scale(1);
}

}

/* =========================
   INTRO SCREEN
========================= */

#introScreen{

display:none;

min-height:100vh;

justify-content:center;
align-items:center;

padding:20px;

}

.introCard{

background:
rgba(255,255,255,.97);

max-width:1000px;
width:100%;

padding:35px;

border-radius:30px;

text-align:center;

box-shadow:
0 10px 30px
rgba(0,0,0,.15);

}

.logo{

width:220px;

margin-bottom:20px;

}

.title{

font-size:3rem;

font-weight:bold;

color:#2e7d32;

margin-bottom:20px;

}

.story{

font-size:1.2rem;

line-height:1.8;

color:#444;

}

.startBtn{

margin-top:25px;

padding:
18px 45px;

border:none;

border-radius:20px;

background:#43a047;

color:white;

font-size:1.2rem;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.startBtn:hover{

transform:scale(1.05);

}

/* =========================
   GAME SCREEN
========================= */

#gameScreen{

display:none;

padding:20px;

}

.gameHeader{

text-align:center;

margin-bottom:20px;

}

.gameLogo{

width:180px;

margin-bottom:10px;

}

.gameTitle{

font-size:2.8rem;

font-weight:bold;

color:#2e7d32;

}

.mainCard{

max-width:1500px;

margin:auto;

background:
rgba(255,255,255,.97);

padding:25px;

border-radius:30px;

box-shadow:
0 10px 30px
rgba(0,0,0,.15);

}

/* =========================
   CURRENT STEP CARD
========================= */

.currentStepCard{

background:#1976d2;

color:white;

padding:20px;

border-radius:20px;

text-align:center;

font-size:1.5rem;

font-weight:bold;

margin-bottom:20px;

min-height:120px;

line-height:1.6;

display:block;

}

/* =========================
   IMAGE AREA
========================= */

.imageContainer{

position:relative;

max-width:1400px;

margin:auto;

}

.farmingImage{

width:100%;

display:block;

border-radius:20px;

}

/* =========================
   DROP BOXES
========================= */

.dropBox{

position:absolute;

width:180px;
height:45px;

background:white;

border:3px dashed #64b5f6;

border-radius:12px;

display:flex;

justify-content:center;
align-items:center;

font-size:.9rem;

font-weight:bold;

text-align:center;

padding:5px;

cursor:pointer;

transition:.3s;

}

.dropBox:hover{

background:#f5fbff;

}

.filled{

background:#e8f5e9 !important;

border:3px solid #43a047 !important;

color:#1b5e20;

}

.feedback{

margin-top:20px;

text-align:center;

font-size:1.2rem;

font-weight:bold;

min-height:40px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

.dropBox{

width:90px;
height:30px;

font-size:.55rem;

}

.title{

font-size:2rem;

}

.gameTitle{

font-size:2rem;

}

.currentStepCard{

font-size:1rem;

}

}

</style>

</head>

<body>

<!-- SPLASH -->

<div id="splashScreen">

<img
id="splashLogo"
src="assets/innovine-logo.png">

</div>

<!-- INTRO -->

<div id="introScreen">

<div class="introCard">

<img
src="assets/innovine-logo.png"
class="logo">

<h1 class="title">

🚜 FARMING MASTER

</h1>

<div class="story">

Help Farmer Raju complete the farming cycle.

<br><br>

A farming step will appear at the top.

<br><br>

Tap the correct blank under the matching picture.

<br><br>

Complete all 8 farming steps to become a Farming Master.

</div>

<button
class="startBtn"
onclick="startGame()">

🚀 START GAME

</button>

</div>

</div>

<!-- GAME SCREEN -->

<div id="gameScreen">

<div class="gameHeader">

<img
src="assets/innovine-logo.png"
class="gameLogo">

<div class="gameTitle">

🚜 FARMING MASTER

</div>

</div>

<div class="mainCard">

<div
id="currentStepCard"
class="currentStepCard">

Loading...

</div>

<div class="imageContainer">

<img
src="assets/steps-of-farming.png"
class="farmingImage">

<!-- DROP BOXES WILL BE ADDED IN PART 2 -->
<!-- =========================
     DROP BOXES
========================= -->

<!-- TOP ROW -->

<div
id="box1"
class="dropBox"
style="
left:2%;
top:48%;
">
?
</div>

<div
id="box2"
class="dropBox"
style="
left:27%;
top:48%;
">
?
</div>

<div
id="box3"
class="dropBox"
style="
left:52%;
top:48%;
">
?
</div>

<div
id="box4"
class="dropBox"
style="
left:78%;
top:48%;
">
?
</div>

<!-- BOTTOM ROW -->

<div
id="box5"
class="dropBox"
style="
left:78%;
top:92%;
">
?
</div>

<div
id="box6"
class="dropBox"
style="
left:52%;
top:92%;
">
?
</div>

<div
id="box7"
class="dropBox"
style="
left:27%;
top:92%;
">
?
</div>

<div
id="box8"
class="dropBox"
style="
left:2%;
top:92%;
">
?
</div>

</div>

<div
id="feedback"
class="feedback">
</div>

</div>

</div>

<!-- =========================
     AUDIO
========================= -->

<audio
id="correctSound"
src="assets/correct.mp3">
</audio>

<audio
id="wrongSound"
src="assets/wrong.mp3">
</audio>

<audio
id="clapSound"
src="assets/clapping.mp3">
</audio>

<script>

/* =========================
   SPLASH
========================= */

setTimeout(()=>{

document.getElementById(
"splashScreen"
).style.display =
"none";

document.getElementById(
"introScreen"
).style.display =
"flex";

},1500);

/* =========================
   START GAME
========================= */

function startGame(){

document.getElementById(
"introScreen"
).style.display =
"none";

document.getElementById(
"gameScreen"
).style.display =
"block";

shuffleSteps();

showNextStep();

}

/* =========================
   FARMING STEPS
========================= */

const farmingSteps = [

{
name:"Preparation of Soil",
target:"box1"
},

{
name:"Sowing",
target:"box2"
},

{
name:"Adding Manures & Fertilisers",
target:"box3"
},

{
name:"Irrigation",
target:"box4"
},

{
name:"Weeding",
target:"box5"
},

{
name:"Harvesting",
target:"box6"
},

{
name:"Threshing",
target:"box7"
},

{
name:"Storage",
target:"box8"
}

];

let gameSteps = [];

let currentStepIndex = 0;

let score = 0;

/* =========================
   SHUFFLE
========================= */

function shuffleSteps(){

gameSteps =
[...farmingSteps];

for(
let i =
gameSteps.length-1;
i>0;
i--
){

const j =
Math.floor(
Math.random()*(i+1)
);

[
gameSteps[i],
gameSteps[j]
]
=
[
gameSteps[j],
gameSteps[i]
];

}

}

/* =========================
   SHOW NEXT STEP
========================= */

function showNextStep(){

if(
currentStepIndex >=
gameSteps.length
){

showCertificate();

return;

}

document.getElementById(
"currentStepCard"
).innerHTML =

`
<div style="
font-size:1rem;
opacity:.9;
">

🌾 PLACE THIS FARMING STEP

</div>

<div style="
font-size:2rem;
font-weight:bold;
margin-top:10px;
">

${gameSteps[currentStepIndex].name}

</div>
`;

}
/* =========================
   CLICK EVENTS
========================= */

document
.querySelectorAll(
".dropBox"
)
.forEach(box=>{

box.addEventListener(
"click",
()=>selectBox(box)
);

});

/* =========================
   SELECT BOX
========================= */

function selectBox(box){

/* Ignore already solved boxes */

if(
box.classList.contains(
"filled"
)
){

return;

}

const currentStep =
gameSteps[
currentStepIndex
];

/* =========================
   CORRECT
========================= */

if(
box.id ===
currentStep.target
){

const correctSound =
document.getElementById(
"correctSound"
);

correctSound.currentTime = 0;

correctSound.play().catch(()=>{});

box.innerHTML =
currentStep.name;

box.classList.add(
"filled"
);

box.style.pointerEvents =
"none";

score++;

document.getElementById(
"feedback"
).innerHTML =

`
✅ Excellent!

<br>

${currentStep.name}
placed correctly.
`;

currentStepIndex++;

setTimeout(()=>{

showNextStep();

},1200);

}

/* =========================
   WRONG
========================= */

else{

const wrongSound =
document.getElementById(
"wrongSound"
);

wrongSound.currentTime = 0;

wrongSound.play().catch(()=>{});

box.style.background =
"#ffebee";

box.style.border =
"3px solid #e53935";

document.getElementById(
"feedback"
).innerHTML =

`
❌ Try Again

<br>

Look carefully at the farming process.
`;

setTimeout(()=>{

if(
!box.classList.contains(
"filled"
)
){

box.style.background =
"white";

box.style.border =
"3px dashed #64b5f6";

}

},800);

}

}

/* =========================
   EDUCATIONAL FACTS
========================= */

const farmingFacts = {

"Preparation of Soil":
"🚜 Soil is loosened before planting seeds.",

"Sowing":
"🌱 Healthy seeds are planted in the field.",

"Adding Manures & Fertilisers":
"🌿 Nutrients help crops grow better.",

"Irrigation":
"💧 Crops need water for healthy growth.",

"Weeding":
"🌾 Unwanted plants are removed.",

"Harvesting":
"🌽 Mature crops are cut and collected.",

"Threshing":
"🌾 Grains are separated from stalks.",

"Storage":
"📦 Grains are stored safely for future use."

};

/* =========================
   SHOW FACT
========================= */

function showFact(stepName){

document.getElementById(
"feedback"
).innerHTML =

`
✅ Correct!

<br><br>

${farmingFacts[stepName]}
`;

}
/* =========================
   UPDATE CORRECT SECTION
========================= */

/*
Inside selectBox(),
replace this section:

document.getElementById(
"feedback"
).innerHTML =

`
✅ Excellent!

<br>

${currentStep.name}
placed correctly.
`;

with:

showFact(
currentStep.name
);
*/

/* =========================
   CERTIFICATE SCREEN
========================= */

function showCertificate(){

const clapSound =
document.getElementById(
"clapSound"
);

clapSound.currentTime = 0;

clapSound.play().catch(()=>{});

document.querySelector(
".mainCard"
).innerHTML =

`
<div
style="
text-align:center;
padding:20px;
">

<img
src="assets/innovine-logo.png"
style="
width:220px;
margin-bottom:20px;
">

<h1
style="
font-size:3rem;
color:#2e7d32;
margin-bottom:15px;
">

🏆 FARMING MASTER

</h1>

<div
style="
font-size:4rem;
margin-bottom:20px;
">

🚜 🌱 💧 🌾 📦

</div>

<p
style="
font-size:1.2rem;
line-height:1.8;
max-width:800px;
margin:auto;
">

Congratulations!

<br><br>

You successfully completed the entire farming cycle and identified all farming stages correctly.

</p>

<br>

<div
style="
font-size:1.15rem;
line-height:2;
color:#2e7d32;
font-weight:bold;
">

1️⃣ Preparation of Soil<br>

2️⃣ Sowing<br>

3️⃣ Adding Manures & Fertilisers<br>

4️⃣ Irrigation<br>

5️⃣ Weeding<br>

6️⃣ Harvesting<br>

7️⃣ Threshing<br>

8️⃣ Storage

</div>

<br>

<h2
style="
color:#1976d2;
">

⭐ Score:
${score} / 8

</h2>

<br>

<button

onclick="playAgain()"

style="
padding:18px 40px;
border:none;
border-radius:20px;
background:#43a047;
color:white;
font-size:1.2rem;
font-weight:bold;
cursor:pointer;
">

🔄 PLAY AGAIN

</button>

</div>
`;

}

/* =========================
   PLAY AGAIN
========================= */

function playAgain(){

location.reload();

}

</script>

</body>
</html>
