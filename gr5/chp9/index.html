<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

🚜 Farming Master

</title>

<style>

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
'Segoe UI',
sans-serif;

background:
linear-gradient(
rgba(255,255,255,.88),
rgba(255,255,255,.88)
),
url('assets/bg-farming.png');

background-size:cover;
background-position:center;
background-attachment:fixed;

min-height:100vh;

overflow-x:hidden;

}

/* =========================
   SPLASH SCREEN
========================= */

#splashScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:white;

display:flex;

justify-content:center;
align-items:center;

z-index:9999;

}

#splashLogo{

width:320px;
max-width:85%;

animation:
logoZoom 1.5s ease;

}

@keyframes logoZoom{

0%{
opacity:0;
transform:scale(.6);
}

100%{
opacity:1;
transform:scale(1);
}

}

/* =========================
   INTRO SCREEN
========================= */

#introScreen{

display:none;

min-height:100vh;

justify-content:center;
align-items:center;

padding:20px;

}

.introCard{

background:
rgba(255,255,255,.97);

max-width:1000px;
width:100%;

padding:35px;

border-radius:30px;

text-align:center;

box-shadow:
0 10px 30px
rgba(0,0,0,.15);

}

.logo{

width:220px;

margin-bottom:20px;

}

.title{

font-size:3rem;

font-weight:bold;

color:#2e7d32;

margin-bottom:20px;

}

.story{

font-size:1.2rem;

line-height:1.8;

color:#444;

}

.startBtn{

margin-top:25px;

padding:
18px 45px;

border:none;

border-radius:20px;

background:#43a047;

color:white;

font-size:1.2rem;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.startBtn:hover{

transform:scale(1.05);

}

/* =========================
   GAME SCREEN
========================= */

#gameScreen{

display:none;

padding:20px;

}

.gameHeader{

text-align:center;

margin-bottom:20px;

}

.gameLogo{

width:180px;

margin-bottom:10px;

}

.gameTitle{

font-size:2.8rem;

font-weight:bold;

color:#2e7d32;

}

.mainCard{

max-width:1500px;

margin:auto;

background:
rgba(255,255,255,.97);

padding:25px;

border-radius:30px;

box-shadow:
0 10px 30px
rgba(0,0,0,.15);

}

/* =========================
   INSTRUCTIONS
========================= */

.instructions{

background:#e8f5e9;

padding:18px;

border-radius:18px;

font-size:1.1rem;

font-weight:bold;

text-align:center;

margin-bottom:20px;

color:#1b5e20;

}

/* =========================
   FARM IMAGE
========================= */

.imageContainer{

position:relative;

max-width:1400px;

margin:auto;

}

.farmingImage{

width:100%;

display:block;

border-radius:20px;

}

/* =========================
   BLANK BOXES
========================= */

.dropBox{

position:absolute;

width:180px;
height:45px;

background:white;

border:3px dashed #90caf9;

border-radius:12px;

display:flex;

justify-content:center;
align-items:center;

font-size:.9rem;

font-weight:bold;

text-align:center;

cursor:pointer;

padding:5px;

transition:.3s;

}

.dropBox:hover{

background:#f5fbff;

}

.filled{

border:3px solid #43a047;

background:#e8f5e9;

}

/* =========================
   WORD BANK
========================= */

.wordBank{

margin-top:30px;

padding:20px;

background:#f5fff5;

border-radius:20px;

}

.wordTitle{

font-size:1.3rem;

font-weight:bold;

text-align:center;

margin-bottom:15px;

color:#2e7d32;

}

.wordsContainer{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:12px;

}

.wordTile{

padding:
12px 18px;

background:#1976d2;

color:white;

border-radius:12px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.wordTile:hover{

transform:scale(1.05);

}

.wordSelected{

background:#ef6c00 !important;

}

.wordUsed{

display:none;

}

/* =========================
   BUTTON
========================= */

.checkBtn{

display:block;

margin:25px auto;

padding:
16px 40px;

border:none;

border-radius:20px;

background:#43a047;

color:white;

font-size:1.1rem;

font-weight:bold;

cursor:pointer;

}

.feedback{

text-align:center;

font-size:1.2rem;

font-weight:bold;

min-height:50px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

.dropBox{

width:90px;
height:30px;

font-size:.55rem;

}

.title{

font-size:2rem;

}

.gameTitle{

font-size:2rem;

}

}

</style>

</head>

<body>

<!-- SPLASH -->

<div id="splashScreen">

<img
id="splashLogo"
src="assets/innovine-logo.png">

</div>

<!-- INTRO -->

<div id="introScreen">

<div class="introCard">

<img
src="assets/innovine-logo.png"
class="logo">

<h1 class="title">

🚜 FARMING MASTER

</h1>

<div class="story">

Observe the farming cycle carefully.

<br><br>

Tap a word from the Word Bank and then tap the correct blank below the image.

<br><br>

Fill all 8 farming steps correctly.

</div>

<button
class="startBtn"
onclick="startGame()">

🚀 START GAME

</button>

</div>

</div>

<!-- GAME -->

<div id="gameScreen">

<div class="gameHeader">

<img
src="assets/innovine-logo.png"
class="gameLogo">

<div class="gameTitle">

🚜 FARMING MASTER

</div>

</div>

<div class="mainCard">

<div class="instructions">

Select a farming step from the Word Bank and place it in the correct blank.

</div>

<div class="imageContainer">

<img
src="assets/steps-of-farming.png"
class="farmingImage">

<!-- DROP BOXES WILL COME IN PART 2 -->
<!-- =========================
     DROP BOXES
========================= -->

<!-- TOP ROW -->

<div
class="dropBox"
id="box1"
style="
left:2%;
top:47%;
">
</div>

<div
class="dropBox"
id="box2"
style="
left:28%;
top:47%;
">
</div>

<div
class="dropBox"
id="box3"
style="
left:53%;
top:47%;
">
</div>

<div
class="dropBox"
id="box4"
style="
left:79%;
top:47%;
">
</div>

<!-- BOTTOM ROW -->

<div
class="dropBox"
id="box5"
style="
left:79%;
top:93%;
">
</div>

<div
class="dropBox"
id="box6"
style="
left:53%;
top:93%;
">
</div>

<div
class="dropBox"
id="box7"
style="
left:28%;
top:93%;
">
</div>

<div
class="dropBox"
id="box8"
style="
left:2%;
top:93%;
">
</div>

</div>

<!-- =========================
     WORD BANK
========================= -->

<div class="wordBank">

<div class="wordTitle">

🌾 WORD BANK

</div>

<div
id="wordsContainer"
class="wordsContainer">

</div>

</div>

<button
class="checkBtn"
onclick="checkAnswers()">

✅ CHECK ANSWERS

</button>

<div
id="feedback"
class="feedback">

</div>

</div>

</div>

<!-- =========================
     AUDIO
========================= -->

<audio
id="correctSound"
src="assets/correct.mp3">
</audio>

<audio
id="wrongSound"
src="assets/wrong.mp3">
</audio>

<audio
id="clapSound"
src="assets/clapping.mp3">
</audio>

<script>

/* =========================
   SPLASH SCREEN
========================= */

setTimeout(()=>{

document.getElementById(
"splashScreen"
).style.display="none";

document.getElementById(
"introScreen"
).style.display="flex";

},1500);

/* =========================
   START GAME
========================= */

function startGame(){

document.getElementById(
"introScreen"
).style.display="none";

document.getElementById(
"gameScreen"
).style.display="block";

createWordBank();

}

/* =========================
   CORRECT ANSWERS
========================= */

const correctAnswers = {

box1:
"Preparation of Soil",

box2:
"Sowing",

box3:
"Adding Manures & Fertilisers",

box4:
"Irrigation",

box5:
"Weeding",

box6:
"Harvesting",

box7:
"Threshing",

box8:
"Storage"

};

/* =========================
   WORD LIST
========================= */

const words = [

"Preparation of Soil",

"Sowing",

"Adding Manures & Fertilisers",

"Irrigation",

"Weeding",

"Harvesting",

"Threshing",

"Storage"

];

let selectedWord = null;
let selectedTile = null;

/* =========================
   SHUFFLE
========================= */

function shuffleArray(array){

const copy = [...array];

for(
let i=copy.length-1;
i>0;
i--
){

const j =
Math.floor(
Math.random()*(i+1)
);

[
copy[i],
copy[j]
]
=
[
copy[j],
copy[i]
];

}

return copy;

}

/* =========================
   WORD BANK
========================= */

function createWordBank(){

const container =
document.getElementById(
"wordsContainer"
);

container.innerHTML="";

const shuffled =
shuffleArray(words);

shuffled.forEach(word=>{

const tile =
document.createElement(
"div"
);

tile.className =
"wordTile";

tile.innerHTML =
word;

tile.onclick =
()=>selectWord(
tile,
word
);

container.appendChild(
tile
);

});

}
/* =========================
   SELECT WORD
========================= */

function selectWord(
tile,
word
){

document
.querySelectorAll(
".wordTile"
)
.forEach(
t=>t.classList.remove(
"wordSelected"
)
);

tile.classList.add(
"wordSelected"
);

selectedWord =
word;

selectedTile =
tile;

}

/* =========================
   DROP BOX CLICK EVENTS
========================= */

document
.querySelectorAll(
".dropBox"
)
.forEach(box=>{

box.addEventListener(
"click",
()=>placeWord(box)
);

});

/* =========================
   PLACE WORD
========================= */

function placeWord(
box
){

if(
!selectedWord
){

document
.getElementById(
"feedback"
)
.innerHTML =

"⚠️ Select a word first.";

return;

}

/* RETURN OLD WORD */

if(
box.dataset.word
){

restoreWord(
box.dataset.word
);

}

/* PLACE NEW WORD */

box.innerHTML =
selectedWord;

box.dataset.word =
selectedWord;

box.classList.add(
"filled"
);

/* REMOVE TILE */

selectedTile.classList.add(
"wordUsed"
);

selectedTile.classList.remove(
"wordSelected"
);

selectedWord = null;
selectedTile = null;

document
.getElementById(
"feedback"
)
.innerHTML =

"";

}

/* =========================
   RESTORE WORD
========================= */

function restoreWord(
word
){

const tiles =
document.querySelectorAll(
".wordTile"
);

tiles.forEach(tile=>{

if(
tile.innerHTML ===
word
){

tile.classList.remove(
"wordUsed"
);

}

});

}

/* =========================
   RESET BOXES
========================= */

function clearHighlights(){

document
.querySelectorAll(
".dropBox"
)
.forEach(box=>{

box.style.border =
"3px dashed #90caf9";

box.style.background =
"white";

});

}

/* =========================
   COUNT FILLED BOXES
========================= */

function countFilledBoxes(){

let count = 0;

document
.querySelectorAll(
".dropBox"
)
.forEach(box=>{

if(
box.dataset.word
){

count++;

}

});

return count;

}
/* =========================
   CHECK ANSWERS
========================= */

function checkAnswers(){

clearHighlights();

if(
countFilledBoxes() < 8
){

const wrongSound =
document.getElementById(
"wrongSound"
);

wrongSound.currentTime = 0;

wrongSound.play().catch(()=>{});

document.getElementById(
"feedback"
).innerHTML =

"⚠️ Fill all 8 blanks first.";

return;

}

let allCorrect = true;

Object.keys(
correctAnswers
).forEach(boxId=>{

const box =
document.getElementById(
boxId
);

const userAnswer =
box.dataset.word;

const correctAnswer =
correctAnswers[
boxId
];

if(
userAnswer ===
correctAnswer
){

box.style.background =
"#e8f5e9";

box.style.border =
"3px solid #43a047";

}
else{

box.style.background =
"#ffebee";

box.style.border =
"3px solid #e53935";

allCorrect = false;

}

});

/* =========================
   ALL CORRECT
========================= */

if(allCorrect){

const correctSound =
document.getElementById(
"correctSound"
);

correctSound.currentTime = 0;

correctSound.play().catch(()=>{});

document.getElementById(
"feedback"
).innerHTML =

"🎉 Excellent! All farming steps are correct.";

setTimeout(()=>{

showCertificate();

},1800);

}

/* =========================
   SOME WRONG
========================= */

else{

const wrongSound =
document.getElementById(
"wrongSound"
);

wrongSound.currentTime = 0;

wrongSound.play().catch(()=>{});

document.getElementById(
"feedback"
).innerHTML =

"❌ Some answers are incorrect. Check the red boxes and try again.";

}

}

/* =========================
   CERTIFICATE
========================= */

function showCertificate(){

const clapSound =
document.getElementById(
"clapSound"
);

clapSound.currentTime = 0;

clapSound.play().catch(()=>{});

document.querySelector(
".mainCard"
).innerHTML =

`
<div
style="
text-align:center;
padding:20px;
">

<img
src="assets/innovine-logo.png"
style="
width:220px;
margin-bottom:20px;
">

<h1
style="
font-size:3rem;
color:#2e7d32;
margin-bottom:15px;
">

🏆 FARMING MASTER

</h1>

<div
style="
font-size:4rem;
margin-bottom:20px;
">

🚜 🌱 💧 🌾

</div>

<p
style="
font-size:1.2rem;
line-height:1.8;
max-width:800px;
margin:auto;
">

Congratulations!

<br><br>

You successfully identified all stages of crop production.

</p>

<br>

<div
style="
font-size:1.2rem;
line-height:2;
color:#2e7d32;
font-weight:bold;
">

1. Preparation of Soil<br>
2. Sowing<br>
3. Adding Manures & Fertilisers<br>
4. Irrigation<br>
5. Weeding<br>
6. Harvesting<br>
7. Threshing<br>
8. Storage

</div>

<br>

<button

onclick="playAgain()"

style="
padding:18px 40px;
border:none;
border-radius:20px;
background:#43a047;
color:white;
font-size:1.2rem;
font-weight:bold;
cursor:pointer;
">

🔄 PLAY AGAIN

</button>

</div>
`;

}

/* =========================
   PLAY AGAIN
========================= */

function playAgain(){

location.reload();

}

</script>

</body>
</html>
