<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Atomic Research Lab

</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
radial-gradient(
circle,
#06111c,
#01050a
);

color:white;

min-height:100vh;

overflow-x:hidden;

}

.container{

max-width:1400px;

margin:auto;

padding:20px;

}

.title{

text-align:center;

font-size:3rem;

font-weight:bold;

color:#46d8ff;

margin-bottom:20px;

text-shadow:
0 0 20px #46d8ff;

}

.game{

display:grid;

grid-template-columns:

280px
1fr
300px;

gap:20px;

}

.panel{

background:
rgba(255,255,255,.05);

padding:20px;

border-radius:20px;

border:
1px solid rgba(
255,
255,
255,
0.1
);

}

.particle{

width:80px;
height:80px;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

font-size:2rem;

font-weight:bold;

margin:10px auto;

cursor:grab;

}

.proton{

background:#ff3b30;

}

.neutron{

background:#8b5cf6;

}

.electron{

background:#2563eb;

}

.atomArea{

position:relative;

height:800px;

}

.shell1{

position:absolute;

width:320px;
height:320px;

border:
4px solid rgba(
255,
255,
255,
0.6
);

border-radius:50%;

left:50%;
top:50%;

transform:
translate(
-50%,
-50%
);

}

.shell2{

position:absolute;

width:560px;
height:560px;

border:
4px solid rgba(
255,
255,
255,
0.6
);

border-radius:50%;

left:50%;
top:50%;

transform:
translate(
-50%,
-50%
);

}

#nucleus{

position:absolute;

width:220px;
height:220px;

border-radius:50%;

background:
rgba(
255,
200,
0,
0.15
);

border:
4px solid gold;

left:50%;
top:50%;

transform:
translate(
-50%,
-50%
);

display:flex;

flex-wrap:wrap;

justify-content:center;
align-items:center;

padding:10px;

}

.nucleusParticle{

width:40px;
height:40px;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

margin:2px;

font-weight:bold;

}

.slot{

position:absolute;

width:60px;
height:60px;

border-radius:50%;

border:
3px dashed #46d8ff;

display:none;

justify-content:center;
align-items:center;

font-size:1.5rem;

}

/* K SHELL */

#kTop{
left:50%;
top:30%;
transform:translateX(-50%);
}

#kBottom{
left:50%;
bottom:30%;
transform:translateX(-50%);
}

/* L SHELL */

#lTop{
left:50%;
top:10%;
transform:translateX(-50%);
}

#lRight{
right:8%;
top:50%;
transform:translateY(-50%);
}

#lBottom{
left:50%;
bottom:10%;
transform:translateX(-50%);
}

#lLeft{
left:8%;
top:50%;
transform:translateY(-50%);
}

button{

background:#22c55e;

border:none;

padding:12px 20px;

border-radius:12px;

color:white;

cursor:pointer;

font-size:1rem;

}

.success{

margin-top:20px;

font-size:1.2rem;

color:#22c55e;

}

</style>

</head>

<body>

<div class="container">

<div class="title">

🧪 ATOMIC RESEARCH LAB

</div>

<div class="game">

<div class="panel">

<h2>

Particles

</h2>

<div id="particleBank"></div>

</div>

<div class="panel">

<div class="atomArea">

<div class="shell2"></div>

<div class="shell1"></div>

<div id="nucleus"></div>

<div class="slot" id="kTop"></div>
<div class="slot" id="kBottom"></div>

<div class="slot" id="lTop"></div>
<div class="slot" id="lRight"></div>
<div class="slot" id="lBottom"></div>
<div class="slot" id="lLeft"></div>

</div>

</div>

<div class="panel">

<h2>

Mission

</h2>

<br>

<div id="stageText">

Stage 1:
Build Nucleus

</div>

<br>

<button onclick="checkStage()">

Check Stage

</button>

<div
id="result"
class="success">

</div>

</div>

</div>
<!-- PART 2 -->

<script>

/* -----------------------------
   PARTICLE CREATION
----------------------------- */

const particleBank =
document.getElementById(
"particleBank"
);

/* 6 PROTONS */

for(let i=0;i<6;i++){

particleBank.innerHTML +=
`
<div
class="particle proton"
draggable="true"
data-type="proton">

+

</div>
`;

}

/* 6 NEUTRONS */

for(let i=0;i<6;i++){

particleBank.innerHTML +=
`
<div
class="particle neutron"
draggable="true"
data-type="neutron">

0

</div>
`;

}

/* 6 ELECTRONS */

for(let i=0;i<6;i++){

particleBank.innerHTML +=
`
<div
class="particle electron"
draggable="true"
data-type="electron">

−

</div>
`;

}

/* -----------------------------
   DRAGGING
----------------------------- */

let draggedItem=null;

document.addEventListener(
"dragstart",
e=>{

if(
e.target.classList.contains(
"particle"
)
){

draggedItem=e.target;

}

}
);

/* -----------------------------
   NUCLEUS DROP
----------------------------- */

const nucleus=
document.getElementById(
"nucleus"
);

nucleus.addEventListener(
"dragover",
e=>{

e.preventDefault();

}
);

nucleus.addEventListener(
"drop",
()=>{

if(!draggedItem) return;

const type=
draggedItem.dataset.type;

if(
type==="electron"
){

return;

}

const particle=
document.createElement(
"div"
);

particle.className=
"nucleusParticle";

if(type==="proton"){

particle.style.background=
"#ff3b30";

particle.innerHTML="+";

}

if(type==="neutron"){

particle.style.background=
"#8b5cf6";

particle.innerHTML="0";

}

nucleus.appendChild(
particle
);

draggedItem.remove();

}
);

/* -----------------------------
   ELECTRON SLOTS
----------------------------- */

const slots=
document.querySelectorAll(
".slot"
);

slots.forEach(slot=>{

slot.addEventListener(
"dragover",
e=>{

e.preventDefault();

}
);

slot.addEventListener(
"drop",
()=>{

if(!draggedItem) return;

if(
draggedItem.dataset.type
!=="electron"
){

return;

}

if(
slot.innerHTML!==""
){

return;

}

slot.innerHTML="🔵";

slot.dataset.filled=
"yes";

draggedItem.remove();

}
);

});

/* -----------------------------
   COUNT HELPERS
----------------------------- */

function countNeutrons(){

let count=0;

nucleus.querySelectorAll(
".nucleusParticle"
).forEach(p=>{

if(
p.innerHTML==="0"
){

count++;

}

});

return count;

}

function countProtons(){

let total=
nucleus.querySelectorAll(
".nucleusParticle"
).length;

return total-countNeutrons();

}

function countElectrons(){

let count=0;

slots.forEach(slot=>{

if(
slot.dataset.filled==="yes"
){

count++;

}

});

return count;

}

/* -----------------------------
   GAME STAGE
----------------------------- */

let stage=1;

</script>
<!-- PART 3 -->

<script>

/* -----------------------------
   STAGE CHECKER
----------------------------- */

function checkStage(){

if(stage===1){

checkNucleus();

}

else if(stage===2){

checkKShell();

}

else if(stage===3){

checkLShell();

}

}

/* -----------------------------
   STAGE 1
   BUILD NUCLEUS
----------------------------- */

function checkNucleus(){

const protons=
countProtons();

const neutrons=
countNeutrons();

if(

protons===6 &&
neutrons===6

){

document
.getElementById(
"result"
).innerHTML=

"🎉 Nucleus Complete!";

stage=2;

document
.getElementById(
"stageText"
).innerHTML=

`
Stage 2:
Place 2 Electrons
in K Shell
`;

showKShell();

}

else{

document
.getElementById(
"result"
).innerHTML=

`
Need:

6 Protons

6 Neutrons

Current:

Protons:
${protons}/6

Neutrons:
${neutrons}/6
`;

}

}

/* -----------------------------
   SHOW K SHELL
----------------------------- */

function showKShell(){

document
.getElementById(
"kTop"
).style.display=
"flex";

document
.getElementById(
"kBottom"
).style.display=
"flex";

}

/* -----------------------------
   STAGE 2
----------------------------- */

function checkKShell(){

let count=0;

if(
document
.getElementById(
"kTop"
).dataset.filled==="yes"
){

count++;

}

if(
document
.getElementById(
"kBottom"
).dataset.filled==="yes"
){

count++;

}

if(count===2){

document
.getElementById(
"result"
).innerHTML=

"🎉 K Shell Complete!";

stage=3;

document
.getElementById(
"stageText"
).innerHTML=

`
Stage 3:
Place 4 Electrons
in L Shell
`;

showLShell();

}

else{

document
.getElementById(
"result"
).innerHTML=

`
K Shell requires
2 electrons.

Current:
${count}/2
`;

}

}

/* -----------------------------
   SHOW L SHELL
----------------------------- */

function showLShell(){

document
.getElementById(
"lTop"
).style.display=
"flex";

document
.getElementById(
"lRight"
).style.display=
"flex";

document
.getElementById(
"lBottom"
).style.display=
"flex";

document
.getElementById(
"lLeft"
).style.display=
"flex";

}

/* -----------------------------
   STAGE 3
----------------------------- */

function checkLShell(){

let count=0;

[
"lTop",
"lRight",
"lBottom",
"lLeft"
]
.forEach(id=>{

if(
document
.getElementById(id)
.dataset.filled==="yes"
){

count++;

}

});

if(count===4){

document
.getElementById(
"result"
).innerHTML=

`
🏆 Carbon Atom Built!

Atomic Number = 6

Electronic Configuration = 2,4
`;

showQuiz();

}

else{

document
.getElementById(
"result"
).innerHTML=

`
L Shell requires
4 electrons.

Current:
${count}/4
`;

}

}

</script>
<!-- PART 4 -->

<script>

/* -----------------------------
   QUIZ SCREEN
----------------------------- */

const quizHTML=

`
<div
id="quizScreen"
class="panel"
style="
margin-top:20px;
display:none;
">

<h2>

🧠 Carbon Challenge

</h2>

<br>

<p>

1. What is the Atomic Number of Carbon?

</p>

<br>

<input
id="q1"
type="number"
style="
width:100%;
padding:10px;
border-radius:10px;
">

<br><br>

<p>

2. What is the Mass Number of Carbon-12?

</p>

<br>

<input
id="q2"
type="number"
style="
width:100%;
padding:10px;
border-radius:10px;
">

<br><br>

<p>

3. How many Valence Electrons does Carbon have?

</p>

<br>

<input
id="q3"
type="number"
style="
width:100%;
padding:10px;
border-radius:10px;
">

<br><br>

<button
onclick="checkQuiz()">

Submit Quiz

</button>

</div>
`;

document
.querySelector(
".container"
)
.insertAdjacentHTML(
"beforeend",
quizHTML
);

/* -----------------------------
   SHOW QUIZ
----------------------------- */

function showQuiz(){

document
.getElementById(
"quizScreen"
)
.style.display=
"block";

}

/* -----------------------------
   QUIZ CHECK
----------------------------- */

function checkQuiz(){

const q1=
document.getElementById(
"q1"
).value;

const q2=
document.getElementById(
"q2"
).value;

const q3=
document.getElementById(
"q3"
).value;

if(

q1==="6" &&
q2==="12" &&
q3==="4"

){

showCertificate();

}

else{

alert(
"Some answers are incorrect. Try again!"
);

}

}

/* -----------------------------
   CERTIFICATE
----------------------------- */

const certificateHTML=

`
<div
id="certificateScreen"
class="panel"
style="
display:none;
margin-top:20px;
text-align:center;
">

<h1>

🏆 CERTIFICATE OF ACHIEVEMENT

</h1>

<br>

<p>

This certifies that

</p>

<br>

<input
id="studentName"
placeholder="Enter Student Name"
style="
padding:12px;
width:300px;
border-radius:10px;
text-align:center;
">

<br><br>

<button
onclick="generateCertificate()">

Generate Certificate

</button>

<br><br>

<div
id="certificateContent"
style="display:none;">

<h2
id="studentDisplay">

</h2>

<br>

<p>

Successfully built a Carbon Atom

</p>

<br>

<p>

Atomic Number: 6

</p>

<p>

Mass Number: 12

</p>

<p>

Electronic Configuration: 2,4

</p>

<p>

Valence Electrons: 4

</p>

<br>

<h2>

⭐ Carbon Atom Master ⭐

</h2>

<br>

<button
onclick="location.reload()">

Play Again

</button>

</div>

</div>
`;

document
.querySelector(
".container"
)
.insertAdjacentHTML(
"beforeend",
certificateHTML
);

/* -----------------------------
   SHOW CERTIFICATE
----------------------------- */

function showCertificate(){

document
.getElementById(
"certificateScreen"
)
.style.display=
"block";

window.scrollTo({

top:
document.body.scrollHeight,

behavior:"smooth"

});

}

/* -----------------------------
   GENERATE CERTIFICATE
----------------------------- */

function generateCertificate(){

const name=
document
.getElementById(
"studentName"
)
.value
.trim();

if(name===""){

alert(
"Please enter a student name."
);

return;

}

document
.getElementById(
"studentDisplay"
)
.innerHTML=name;

document
.getElementById(
"certificateContent"
)
.style.display=
"block";

}

</script>

</body>

</html>
