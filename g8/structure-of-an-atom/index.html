<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Carbon Atom Lab v5

</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
180deg,
#08131d,
#02070c
);

color:white;

min-height:100vh;

padding:15px;

overflow-x:hidden;

}

.container{

max-width:1400px;

margin:auto;

}

.title{

text-align:center;

font-size:
clamp(
2rem,
4vw,
3rem
);

color:#4fd8ff;

margin-bottom:20px;

}

.game{

display:grid;

grid-template-columns:

280px
1fr
280px;

gap:20px;

}

@media(max-width:900px){

.game{

grid-template-columns:
1fr;

}

}

/* PANELS */

.panel{

background:
rgba(
255,
255,
255,
0.05
);

padding:20px;

border-radius:20px;

border:
1px solid rgba(
255,
255,
255,
0.1
);

}

/* INSTRUCTIONS */

.instructions{

line-height:1.8;

font-size:1rem;

}

/* PARTICLE AREA */

#particleArea{

display:flex;

justify-content:center;

align-items:center;

height:180px;

}

/* DRAG PARTICLES */

.particle{

width:90px;
height:90px;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

font-size:2rem;

font-weight:bold;

cursor:grab;

user-select:none;

}

.proton{

background:#ff3b30;

}

.neutron{

background:#e7d54a;

color:#333;

}

.electron{

background:#2563eb;

}

/* ATOM */

.atomArea{

position:relative;

height:700px;

}

/* OUTER SHELL */

.shell2{

position:absolute;

width:520px;
height:520px;

border-radius:50%;

border:
3px solid rgba(
255,
255,
255,
0.4
);

left:50%;
top:50%;

transform:
translate(
-50%,
-50%
);

}

/* INNER SHELL */

.shell1{

position:absolute;

width:300px;
height:300px;

border-radius:50%;

border:
3px solid rgba(
255,
255,
255,
0.7
);

left:50%;
top:50%;

transform:
translate(
-50%,
-50%
);

}

/* NUCLEUS */

#nucleus{

position:absolute;

width:220px;
height:220px;

border-radius:50%;

border:
4px solid gold;

background:
rgba(
255,
200,
0,
0.1
);

left:50%;
top:50%;

transform:
translate(
-50%,
-50%
);

}

/* PARTICLES INSIDE NUCLEUS */

.nucleusParticle{

position:absolute;

width:34px;
height:34px;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

font-weight:bold;

font-size:.9rem;

color:white;

}

/* ELECTRONS */

.electronPlaced{

position:absolute;

width:22px;
height:22px;

border-radius:50%;

background:#2563eb;

box-shadow:
0 0 10px #2563eb;

transform:
translate(
-50%,
-50%
);

}

/* ACTIVE SLOT */

.activeSlot{

position:absolute;

width:48px;
height:48px;

border-radius:50%;

border:
3px dashed #4fd8ff;

animation:
pulse 1s infinite;

}

@keyframes pulse{

0%{
transform:
translate(-50%,-50%)
scale(1);
}

50%{
transform:
translate(-50%,-50%)
scale(1.15);
}

100%{
transform:
translate(-50%,-50%)
scale(1);
}

}

/* STATUS */

#status{

margin-top:15px;

color:#4fd8ff;

line-height:1.7;

font-weight:bold;

}

button{

width:100%;

padding:12px;

border:none;

border-radius:12px;

background:#22c55e;

color:white;

cursor:pointer;

margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<h1 class="title">

🧪 Carbon Atom Research Lab

</h1>

<div class="game">

<!-- LEFT PANEL -->

<div class="panel">

<h2>

Instructions

</h2>

<br>

<div class="instructions">

Drag the subatomic particles and drop them in the correct location.

<br><br>

Build Carbon-12:

<br><br>

➕ 6 Protons

<br>

🟡 6 Neutrons

<br>

🔵 2 Electrons in K Shell

<br>

🔵 4 Electrons in L Shell

</div>

<br>

<div id="particleArea">

</div>

</div>

<!-- CENTER PANEL -->

<div class="panel">

<div
class="atomArea"
id="atomArea">

<div class="shell2"></div>

<div class="shell1"></div>

<div id="nucleus"></div>

</div>

</div>

<!-- RIGHT PANEL -->

<div class="panel">

<h2>

Mission

</h2>

<br>

<div id="missionText">

Stage 1:
Add 6 Protons

</div>

<div id="status">

0 / 6 Protons Added

</div>

<button
onclick="checkProgress()">

Check Progress

</button>

</div>

</div>
<!-- PART 2 -->

<script>

/* =====================================
   GAME VARIABLES
===================================== */

let stage="proton";

let protonCount=0;
let neutronCount=0;

let kElectronCount=0;
let lElectronCount=0;

let draggedParticle=null;

let activeSlot=null;

const particleArea=
document.getElementById(
"particleArea"
);

const nucleus=
document.getElementById(
"nucleus"
);

const atomArea=
document.getElementById(
"atomArea"
);

/* =====================================
   NUCLEUS CLUSTER POSITIONS
   (Like your reference image)
===================================== */

const nucleusPositions=[

{left:50,top:20},
{left:35,top:30},
{left:50,top:30},
{left:65,top:30},

{left:28,top:45},
{left:43,top:45},
{left:58,top:45},
{left:73,top:45},

{left:35,top:60},
{left:50,top:60},
{left:65,top:60},

{left:50,top:75}

];

/* =====================================
   CREATE PARTICLE
===================================== */

function createParticle(type){

particleArea.innerHTML="";

const particle=
document.createElement(
"div"
);

particle.className=
"particle "+type;

particle.draggable=true;

particle.dataset.type=
type;

if(type==="proton"){

particle.innerHTML="P";

}

if(type==="neutron"){

particle.innerHTML="N";

}

if(type==="electron"){

particle.innerHTML="−";

}

particleArea.appendChild(
particle
);

}

/* =====================================
   START GAME
===================================== */

createParticle(
"proton"
);

/* =====================================
   DRAG START
===================================== */

document.addEventListener(
"dragstart",
function(e){

if(
e.target.classList.contains(
"particle"
)
){

draggedParticle=
e.target;

}

}
);

/* =====================================
   UPDATE STATUS
===================================== */

function updateStatus(){

const status=
document.getElementById(
"status"
);

if(stage==="proton"){

status.innerHTML=

protonCount+
" / 6 Protons Added";

}

else if(
stage==="neutron"
){

status.innerHTML=

neutronCount+
" / 6 Neutrons Added";

}

else if(
stage==="k"
){

status.innerHTML=

kElectronCount+
" / 2 Electrons Added";

}

else if(
stage==="l"
){

status.innerHTML=

lElectronCount+
" / 4 Electrons Added";

}

}

/* =====================================
   NUCLEUS DROP
===================================== */

nucleus.addEventListener(
"dragover",
function(e){

e.preventDefault();

}
);

nucleus.addEventListener(
"drop",
function(){

if(
!draggedParticle
) return;

const type=
draggedParticle.dataset.type;

if(
type==="electron"
){

return;

}

addToNucleus(type);

draggedParticle.remove();

nextParticle();

}
);

/* =====================================
   ADD TO NUCLEUS
===================================== */

function addToNucleus(type){

const index=
protonCount+
neutronCount;

const pos=
nucleusPositions[index];

const particle=
document.createElement(
"div"
);

particle.className=
"nucleusParticle";

particle.style.left=
pos.left+"%";

particle.style.top=
pos.top+"%";

particle.style.transform=
"translate(-50%,-50%)";

if(type==="proton"){

particle.style.background=
"#ff3b30";

particle.innerHTML="P";

protonCount++;

}

if(type==="neutron"){

particle.style.background=
"#e7d54a";

particle.style.color=
"#333";

particle.innerHTML="N";

neutronCount++;

}

nucleus.appendChild(
particle
);

updateStatus();

}
<!-- PART 3 -->

/* =====================================
   ELECTRON POSITIONS
   EXACTLY ON SHELLS
===================================== */

/* K SHELL (2 electrons) */

const kShellPositions=[

{
left:"50%",
top:"28%"
},

{
left:"50%",
top:"72%"
}

];

/* L SHELL (4 electrons) */

const lShellPositions=[

{
left:"50%",
top:"13%"
},

{
left:"87%",
top:"50%"
},

{
left:"50%",
top:"87%"
},

{
left:"13%",
top:"50%"
}

];

/* =====================================
   CREATE ACTIVE SLOT
===================================== */

function createSlot(
left,
top
){

if(activeSlot){

activeSlot.remove();

}

activeSlot=
document.createElement(
"div"
);

activeSlot.className=
"activeSlot";

activeSlot.style.left=
left;

activeSlot.style.top=
top;

atomArea.appendChild(
activeSlot
);

activeSlot.addEventListener(
"dragover",
function(e){

e.preventDefault();

}
);

activeSlot.addEventListener(
"drop",
function(){

if(
!draggedParticle
) return;

if(
draggedParticle.dataset.type
!=="electron"
){

return;

}

placeElectron(
left,
top
);

draggedParticle.remove();

activeSlot.remove();

activeSlot=null;

nextParticle();

}
);

}

/* =====================================
   PLACE ELECTRON
===================================== */

function placeElectron(
left,
top
){

const electron=
document.createElement(
"div"
);

electron.className=
"electronPlaced";

electron.style.left=
left;

electron.style.top=
top;

atomArea.appendChild(
electron
);

if(stage==="k"){

kElectronCount++;

}

else if(
stage==="l"
){

lElectronCount++;

}

updateStatus();

}

/* =====================================
   SHOW NEXT K SLOT
===================================== */

function showNextKSlot(){

const pos=
kShellPositions[
kElectronCount
];

createSlot(
pos.left,
pos.top
);

}

/* =====================================
   SHOW NEXT L SLOT
===================================== */

function showNextLSlot(){

const pos=
lShellPositions[
lElectronCount
];

createSlot(
pos.left,
pos.top
);

}

/* =====================================
   NEXT PARTICLE
===================================== */

function nextParticle(){

/* PROTONS */

if(stage==="proton"){

if(protonCount<6){

createParticle(
"proton"
);

return;

}

stage="neutron";

document
.getElementById(
"missionText"
)
.innerHTML=

`
Stage 2
<br>
Add 6 Neutrons
`;

createParticle(
"neutron"
);

updateStatus();

return;

}

/* NEUTRONS */

if(stage==="neutron"){

if(neutronCount<6){

createParticle(
"neutron"
);

return;

}

stage="k";

document
.getElementById(
"missionText"
)
.innerHTML=

`
Stage 3
<br>
Place 2 Electrons
in K Shell
`;

createParticle(
"electron"
);

showNextKSlot();

updateStatus();

return;

}

/* K SHELL */

if(stage==="k"){

if(kElectronCount<2){

createParticle(
"electron"
);

showNextKSlot();

return;

}

stage="l";

document
.getElementById(
"missionText"
)
.innerHTML=

`
Stage 4
<br>
Place 4 Electrons
in L Shell
`;

createParticle(
"electron"
);

showNextLSlot();

updateStatus();

return;

}

/* L SHELL */

if(stage==="l"){

if(lElectronCount<4){

createParticle(
"electron"
);

showNextLSlot();

return;

}

stage="complete";

particleArea.innerHTML=

`
<div style="
text-align:center;
font-size:1.3rem;
color:#22c55e;
font-weight:bold;
">

🏆 Carbon Atom Complete

</div>
`;

document
.getElementById(
"missionText"
)
.innerHTML=

`
Carbon Atom Built

<br><br>

Electronic Configuration

<br>

2,4

`;

document
.getElementById(
"status"
)
.innerHTML=

`
✔ 6 Protons

<br>

✔ 6 Neutrons

<br>

✔ 6 Electrons
`;

showQuiz();

}
<!-- PART 4 -->

<script>

/* =====================================
   CHECK PROGRESS
===================================== */

function checkProgress(){

if(stage==="complete"){

showQuiz();

return;

}

alert(
"Keep building the Carbon Atom!"
);

}

/* =====================================
   QUIZ SCREEN
===================================== */

const quizHTML=

`
<div
id="quizScreen"
class="panel"
style="
display:none;
margin-top:20px;
">

<h2>

🧠 Carbon Challenge

</h2>

<br>

<p>

1. What is the Atomic Number of Carbon?

</p>

<input
id="q1"
type="number"
style="
width:100%;
padding:10px;
border-radius:10px;
">

<br><br>

<p>

2. What is the Mass Number of Carbon-12?

</p>

<input
id="q2"
type="number"
style="
width:100%;
padding:10px;
border-radius:10px;
">

<br><br>

<p>

3. How many Valence Electrons does Carbon have?

</p>

<input
id="q3"
type="number"
style="
width:100%;
padding:10px;
border-radius:10px;
">

<br><br>

<button
onclick="checkQuiz()">

Submit Quiz

</button>

</div>
`;

document
.querySelector(
".container"
)
.insertAdjacentHTML(
"beforeend",
quizHTML
);

/* =====================================
   SHOW QUIZ
===================================== */

function showQuiz(){

document
.getElementById(
"quizScreen"
)
.style.display=
"block";

window.scrollTo({

top:
document.body.scrollHeight,

behavior:"smooth"

});

}

/* =====================================
   CHECK QUIZ
===================================== */

function checkQuiz(){

const q1=
document
.getElementById(
"q1"
).value;

const q2=
document
.getElementById(
"q2"
).value;

const q3=
document
.getElementById(
"q3"
).value;

if(

q1==="6" &&
q2==="12" &&
q3==="4"

){

showCertificate();

}

else{

alert(
"Some answers are incorrect. Try again."
);

}

}

/* =====================================
   CERTIFICATE SCREEN
===================================== */

const certificateHTML=

`
<div
id="certificateScreen"
class="panel"
style="
display:none;
margin-top:20px;
text-align:center;
">

<h1>

🏆 Certificate of Achievement

</h1>

<br>

<p>

Enter Student Name

</p>

<br>

<input
id="studentName"
placeholder="Student Name"
style="
width:300px;
max-width:100%;
padding:12px;
border-radius:10px;
text-align:center;
">

<br><br>

<button
onclick="generateCertificate()">

Generate Certificate

</button>

<br><br>

<div
id="certificateContent"
style="
display:none;
">

<h2
id="studentDisplay">

</h2>

<br>

<p>

Successfully Built a Carbon-12 Atom

</p>

<br>

<p>

Atomic Number: 6

</p>

<p>

Mass Number: 12

</p>

<p>

Electronic Configuration: 2,4

</p>

<p>

Valence Electrons: 4

</p>

<br>

<h2>

⭐ Carbon Atom Master ⭐

</h2>

<br>

<button
onclick="location.reload()">

Play Again

</button>

</div>

</div>
`;

document
.querySelector(
".container"
)
.insertAdjacentHTML(
"beforeend",
certificateHTML
);

/* =====================================
   SHOW CERTIFICATE
===================================== */

function showCertificate(){

document
.getElementById(
"certificateScreen"
)
.style.display=
"block";

window.scrollTo({

top:
document.body.scrollHeight,

behavior:"smooth"

});

}

/* =====================================
   GENERATE CERTIFICATE
===================================== */

function generateCertificate(){

const name=
document
.getElementById(
"studentName"
)
.value
.trim();

if(name===""){

alert(
"Please enter your name."
);

return;

}

document
.getElementById(
"studentDisplay"
)
.innerHTML=name;

document
.getElementById(
"certificateContent"
)
.style.display=
"block";

}

</script>

</body>

</html>
