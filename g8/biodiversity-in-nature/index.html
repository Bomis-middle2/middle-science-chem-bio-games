<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Food Chain Role Assignment Game</title>
<style>
body{
margin:0;font-family:Arial,sans-serif;color:white;
background:linear-gradient(#0b1f14,#183d2a,#0b1f14);
min-height:100vh;overflow:hidden;
}
h1{text-align:center}
.wrap{max-width:1200px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center}
.panel{background:rgba(255,255,255,.08);padding:12px;border-radius:12px}
.game{display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:20px}
.org{background:#234;padding:10px;border-radius:10px;margin:10px 0;cursor:grab;text-align:center}
.circle{position:relative;height:650px}
.slot{
position:absolute;width:140px;height:70px;border:2px dashed #8ff;
border-radius:12px;display:flex;align-items:center;justify-content:center;
background:rgba(255,255,255,.08)
}
.s1{top:10px;left:50%;transform:translateX(-50%)}
.s2{top:140px;right:70px}
.s3{top:300px;right:20px}
.s4{bottom:140px;right:70px}
.s5{bottom:10px;left:50%;transform:translateX(-50%)}
.s6{top:300px;left:20px}
.centerChain{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
font-size:120px
}
button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
#msg{font-size:22px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>🌲 Food Chain Role Assignment</h1>
<div class="panel">Tries: <span id="tries">0</span></div>
</div>

<div class="game">
<div class="panel">
<h3>Drag Organisms</h3>

<div class="org" draggable="true" data-name="Producer">🌱 Grass</div>
<div class="org" draggable="true" data-name="Consumer1">🦗 Grasshopper</div>
<div class="org" draggable="true" data-name="Consumer2">🐦 Bird</div>
<div class="org" draggable="true" data-name="Consumer3">🐍 Snake</div>
<div class="org" draggable="true" data-name="Predator">🦅 Eagle</div>
<div class="org" draggable="true" data-name="Decomposer">🍄 Mushroom</div>

<button onclick="resetGame()">Reset</button>
</div>

<div class="circle">
<div class="centerChain">🌳</div>

<div class="slot s1" data-correct="Producer">Producer</div>
<div class="slot s2" data-correct="Consumer1">Consumer</div>
<div class="slot s3" data-correct="Consumer2">Consumer</div>
<div class="slot s4" data-correct="Consumer3">Consumer</div>
<div class="slot s5" data-correct="Predator">Predator</div>
<div class="slot s6" data-correct="Decomposer">Decomposer</div>
</div>
</div>

<div id="msg"></div>
</div>

<script>
let dragged=null;
let tries=0;

document.querySelectorAll('.org').forEach(el=>{
 el.addEventListener('dragstart',()=>dragged=el);
});

document.querySelectorAll('.slot').forEach(slot=>{
 slot.addEventListener('dragover',e=>e.preventDefault());
 slot.addEventListener('drop',()=>{
   if(!dragged) return;
   slot.dataset.value=dragged.dataset.name;
   slot.innerHTML=dragged.innerHTML;
   checkWin();
 });
});

function checkWin(){
 tries++;
 document.getElementById('tries').innerText=tries;

 let ok=true;
 document.querySelectorAll('.slot').forEach(slot=>{
   if(slot.dataset.value!==slot.dataset.correct) ok=false;
 });

 if(ok){
   document.getElementById('msg').innerHTML=
   "🏆 Excellent! Food Chain Completed Successfully!";
 }
}

function resetGame(){
 location.reload();
}
</script>
</body>
</html>
