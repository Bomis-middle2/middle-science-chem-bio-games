<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Types of Microorganisms

</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
180deg,
#0a2342,
#05111f
);

padding:15px;

color:white;

}

.container{

max-width:1400px;

margin:auto;

}

.header{

text-align:center;

background:#1e3a8a;

padding:15px;

border-radius:15px;

margin-bottom:20px;

}

.header h1{

font-size:
clamp(
1.6rem,
3vw,
3rem
);

}

.instructions{

text-align:center;

font-size:1.2rem;

margin-bottom:20px;

}

.gameArea{

display:grid;

grid-template-columns:
1fr 260px;

gap:20px;

}

@media(max-width:900px){

.gameArea{

grid-template-columns:
1fr;

}

}

.board{

background:#f5f1e8;

border-radius:20px;

padding:20px;

color:black;

}

.microbeGrid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(220px,1fr)
);

gap:25px;

}

.microbeCard{

text-align:center;

}

.microbe{

height:180px;

display:flex;

justify-content:center;
align-items:center;

}

.dropzone{

height:55px;

border:
3px dashed #555;

border-radius:10px;

margin-top:10px;

display:flex;

justify-content:center;
align-items:center;

font-weight:bold;

background:white;

}

.sidebar{

background:
rgba(
255,
255,
255,
0.08
);

padding:20px;

border-radius:20px;

}

.sidebar h2{

text-align:center;

margin-bottom:20px;

}

.label{

background:#60a5fa;

color:#001b44;

padding:12px;

border-radius:12px;

margin-bottom:12px;

font-weight:bold;

text-align:center;

cursor:grab;

}

.scoreBox{

margin-top:20px;

padding:15px;

background:
rgba(
255,
255,
255,
0.08
);

border-radius:12px;

text-align:center;

font-size:1.2rem;

}

button{

width:100%;

padding:12px;

margin-top:15px;

border:none;

border-radius:12px;

background:#22c55e;

color:white;

cursor:pointer;

font-size:1rem;

}

#message{

margin-top:15px;

text-align:center;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

🦠 TYPES OF MICROORGANISMS

</h1>

</div>

<div class="instructions">

Drag the correct name to each microorganism.

</div>

<div class="gameArea">

<div class="board">

<div class="microbeGrid">

<!-- FUNGI -->

<div class="microbeCard">

<div
class="microbe"
id="fungiImage">

</div>

<div
class="dropzone"
data-answer="FUNGI">

</div>

</div>

<!-- BACTERIA -->

<div class="microbeCard">

<div
class="microbe"
id="bacteriaImage">

</div>

<div
class="dropzone"
data-answer="BACTERIA">

</div>

</div>

<!-- PROTOZOA -->

<div class="microbeCard">

<div
class="microbe"
id="protozoaImage">

</div>

<div
class="dropzone"
data-answer="PROTOZOA">

</div>

</div>

<!-- VIRUS -->

<div class="microbeCard">

<div
class="microbe"
id="virusImage">

</div>

<div
class="dropzone"
data-answer="VIRUS">

</div>

</div>

<!-- ALGAE -->

<div class="microbeCard">

<div
class="microbe"
id="algaeImage">

</div>

<div
class="dropzone"
data-answer="ALGAE">

</div>

</div>

</div>

</div>

<div class="sidebar">

<h2>

Drag From Here

</h2>

<div
class="label"
draggable="true"
data-name="FUNGI">

FUNGI

</div>

<div
class="label"
draggable="true"
data-name="BACTERIA">

BACTERIA

</div>

<div
class="label"
draggable="true"
data-name="PROTOZOA">

PROTOZOA

</div>

<div
class="label"
draggable="true"
data-name="VIRUS">

VIRUS

</div>

<div
class="label"
draggable="true"
data-name="ALGAE">

ALGAE

</div>

<div class="scoreBox">

Score:
<span id="score">

0

</span>

/ 5

</div>

<button
onclick="resetGame()">

Reset

</button>

<div id="message"></div>

</div>

</div>
<!-- PART 2 -->

<script>

/* =====================================
   SCIENTIFIC SVG MICROORGANISMS
===================================== */

/* FUNGI */

document
.getElementById(
"fungiImage"
)
.innerHTML=

`
<svg
width="180"
height="160"
viewBox="0 0 180 160">

<ellipse
cx="70"
cy="55"
rx="35"
ry="18"
fill="#d8b4fe"
stroke="#6b21a8"
stroke-width="3"/>

<ellipse
cx="120"
cy="45"
rx="28"
ry="15"
fill="#d8b4fe"
stroke="#6b21a8"
stroke-width="3"/>

<rect
x="60"
y="55"
width="18"
height="55"
rx="8"
fill="#f3e8ff"/>

<rect
x="112"
y="45"
width="14"
height="60"
rx="7"
fill="#f3e8ff"/>

</svg>
`;

/* BACTERIA */

document
.getElementById(
"bacteriaImage"
)
.innerHTML=

`
<svg
width="180"
height="160"
viewBox="0 0 180 160">

<ellipse
cx="90"
cy="80"
rx="60"
ry="30"
fill="#84cc16"
stroke="#3f6212"
stroke-width="4"/>

<circle cx="70" cy="75" r="4" fill="#365314"/>
<circle cx="90" cy="85" r="4" fill="#365314"/>
<circle cx="110" cy="70" r="4" fill="#365314"/>

<path
d="M25 80 Q0 50 10 20"
stroke="#65a30d"
stroke-width="3"
fill="none"/>

<path
d="M155 80 Q180 110 170 140"
stroke="#65a30d"
stroke-width="3"
fill="none"/>

</svg>
`;

/* PROTOZOA (AMOEBA) */

document
.getElementById(
"protozoaImage"
)
.innerHTML=

`
<svg
width="180"
height="160"
viewBox="0 0 180 160">

<path
d="
M45 80
Q30 40 70 30
Q90 10 130 35
Q160 45 150 90
Q170 120 130 135
Q95 150 60 125
Q25 115 45 80
"
fill="#93c5fd"
stroke="#1d4ed8"
stroke-width="4"/>

<circle
cx="95"
cy="80"
r="16"
fill="#2563eb"/>

</svg>
`;

/* VIRUS */

document
.getElementById(
"virusImage"
)
.innerHTML=

`
<svg
width="180"
height="180"
viewBox="0 0 180 180">

<circle
cx="90"
cy="90"
r="40"
fill="#c084fc"
stroke="#6b21a8"
stroke-width="4"/>

<line x1="90" y1="25" x2="90" y2="50"
stroke="#6b21a8"
stroke-width="4"/>

<line x1="90" y1="130" x2="90" y2="155"
stroke="#6b21a8"
stroke-width="4"/>

<line x1="25" y1="90" x2="50" y2="90"
stroke="#6b21a8"
stroke-width="4"/>

<line x1="130" y1="90" x2="155" y2="90"
stroke="#6b21a8"
stroke-width="4"/>

<circle cx="90" cy="20" r="6" fill="#9333ea"/>
<circle cx="90" cy="160" r="6" fill="#9333ea"/>
<circle cx="20" cy="90" r="6" fill="#9333ea"/>
<circle cx="160" cy="90" r="6" fill="#9333ea"/>

</svg>
`;

/* ALGAE */

document
.getElementById(
"algaeImage"
)
.innerHTML=

`
<svg
width="180"
height="180"
viewBox="0 0 180 180">

<circle
cx="90"
cy="90"
r="50"
fill="#4ade80"
stroke="#166534"
stroke-width="4"/>

<circle
cx="70"
cy="75"
r="10"
fill="#15803d"/>

<circle
cx="110"
cy="70"
r="12"
fill="#15803d"/>

<circle
cx="90"
cy="105"
r="14"
fill="#15803d"/>

</svg>
`;

/* =====================================
   GAME VARIABLES
===================================== */

let draggedLabel=null;

let score=0;

const correctSound=
new Audio(
"assets/correct.mp3"
);

const wrongSound=
new Audio(
"assets/wrong.mp3"
);

const applause=
new Audio(
"assets/freesound_community-claps-44774.mp3"
);
<!-- PART 3 -->

/* =====================================
   DRAG START
===================================== */

document
.querySelectorAll(
".label"
)
.forEach(label=>{

label.addEventListener(
"dragstart",
function(){

draggedLabel=
this;

}
);

});

/* =====================================
   DROP ZONES
===================================== */

document
.querySelectorAll(
".dropzone"
)
.forEach(zone=>{

zone.addEventListener(
"dragover",
function(e){

e.preventDefault();

}
);

zone.addEventListener(
"drop",
function(e){

e.preventDefault();

if(
this.innerHTML!==""
){

return;

}

const correct=
this.dataset.answer;

const chosen=
draggedLabel.dataset.name;

if(
correct===chosen
){

this.innerHTML=
chosen;

this.style.background=
"#bbf7d0";

this.style.border=
"3px solid #16a34a";

draggedLabel.style.display=
"none";

score++;

document
.getElementById(
"score"
)
.innerHTML=
score;

correctSound.play();

checkWin();

}
else{

wrongSound.play();

this.style.background=
"#fecaca";

setTimeout(()=>{

this.style.background=
"white";

},500);

}

}
);

});

/* =====================================
   WIN CHECK
===================================== */

function checkWin(){

if(score===5){

applause.play();

document
.getElementById(
"message"
)
.innerHTML=

`
🏆 Excellent!

All microorganisms identified correctly.

<br><br>

<button
onclick="showCertificate()">

Get Certificate

</button>
`;

}

}

/* =====================================
   CERTIFICATE
===================================== */

function showCertificate(){

const student=
prompt(
"Enter Student Name"
);

if(
!student
){

return;

}

document.body.innerHTML=

`
<div style="
max-width:900px;
margin:auto;
padding:40px;
text-align:center;
font-family:Arial;
">

<img
src="assets/innovine-logo.png"
style="
max-width:180px;
">

<h1>

🏆 CERTIFICATE OF ACHIEVEMENT

</h1>

<br>

<h2>

${student}

</h2>

<br>

<p>

Successfully completed

</p>

<h2>

Types of Microorganisms

</h2>

<p>

Grade 8 Science

</p>

<br>

<h2>

🦠 MICROBE DETECTIVE

</h2>

<br>

<p>

Score: 5 / 5

</p>

<br>

<button
onclick="location.reload()">

Play Again

</button>

</div>
`;

}

/* =====================================
   RESET
===================================== */

function resetGame(){

location.reload();

}

</script>

</body>

</html>
