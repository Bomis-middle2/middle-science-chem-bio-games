<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Interactive Atomic Research Lab</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  background: linear-gradient(180deg, #07131d, #02070c);
  color: white;
  min-height: 100vh;
  padding: 15px;
}

/* Splash Screen (Plain Screen with Innovine Logo) */
#splash-overlay {
  position: fixed;
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%;
  background-color: #07131d;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#splash-overlay img {
  max-width: 280px;
  width: 70%;
  height: auto;
  object-fit: contain;
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.container{
  max-width: 1400px;
  margin: auto;
  display: none; /* Hidden until splash screen finishes */
}

.header-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.title{
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  color: #4fd8ff;
  text-shadow: 0 0 10px rgba(79, 216, 255, 0.3);
  text-align: center;
}

.element-select-container {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

select {
  padding: 8px 16px;
  border-radius: 8px;
  background: #0d233a;
  color: #4fd8ff;
  border: 1px solid #4fd8ff;
  font-size: 1rem;
  cursor: pointer;
  outline: none;
}

.game{
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  gap: 15px;
}

@media(max-width: 960px){
  .game{
    grid-template-columns: 1fr;
  }
}

.panel{
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  backdrop-filter: blur(4px);
}

#instructionBox{
  line-height: 1.6;
  font-size: 1rem;
  color: #e2e8f0;
}

#particleArea{
  display: flex;
  justify-content: center;
  align-items: center;
  height: 120px;
  margin-top: 15px;
}

.particle{
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.8rem;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.particle:hover{
  transform: scale(1.08);
}

.proton{
  background: #ff3b30;
  box-shadow: 0 0 15px rgba(255, 59, 48, 0.6);
}

.neutron{
  background: #e7d54a;
  color: #333;
  box-shadow: 0 0 15px rgba(231, 213, 74, 0.6);
}

.electron{
  background: #2563eb;
  box-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
}

.atomArea{
  position: relative;
  height: 550px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

@media(max-width: 700px){
  .atomArea{
    height: 400px;
  }
}

/* Dynamic Shells */
.shell {
  position: absolute;
  border-radius: 50%;
  border: 2px dashed rgba(255, 255, 255, 0.35);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.shell1 { width: 220px; height: 220px; }
.shell2 { width: 340px; height: 340px; }
.shell3 { width: 460px; height: 460px; }

@media(max-width: 700px){
  .shell1 { width: 150px; height: 150px; }
  .shell2 { width: 240px; height: 240px; }
  .shell3 { width: 330px; height: 330px; }
}

#nucleus{
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 3px solid gold;
  background: rgba(255, 200, 0, 0.08);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: background 0.2s;
}

#nucleus:hover {
  background: rgba(255, 200, 0, 0.18);
}

@media(max-width: 700px){
  #nucleus{
    width: 110px;
    height: 110px;
  }
}

.nucleusParticle{
  position: absolute;
  pointer-events: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: .75rem;
  font-weight: bold;
  box-shadow:
    inset -2px -2px 4px rgba(0,0,0,0.35),
    0 0 0 1px rgba(255,255,255,0.12);
  z-index: 3;
}

@media(max-width: 700px){
  .nucleusParticle{
    width: 16px;
    height: 16px;
    font-size: .52rem;
  }
}

.electronPlaced{
  position: absolute;
  pointer-events: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #2563eb;
  box-shadow: 0 0 12px #2563eb;
  transform: translate(-50%, -50%);
  z-index: 5;
}

.activeTarget{
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 3px dashed #4fd8ff;
  cursor: pointer;
  transform: translate(-50%, -50%);
  z-index: 10;
  background: rgba(79, 216, 255, 0.16);
  box-shadow:
    0 0 0 5px rgba(79,216,255,.08),
    0 0 18px rgba(79,216,255,.55);
  animation: targetGlow 1s ease-in-out infinite alternate;
}

@keyframes targetGlow{
  from{
    opacity:.72;
    box-shadow:
      0 0 0 4px rgba(79,216,255,.07),
      0 0 10px rgba(79,216,255,.34);
  }
  to{
    opacity:1;
    box-shadow:
      0 0 0 7px rgba(79,216,255,.12),
      0 0 20px rgba(79,216,255,.72);
  }
}

button{
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #22c55e;
  color: white;
  cursor: pointer;
  margin-top: 15px;
  font-size: 1rem;
  font-weight: bold;
  transition: background 0.2s, transform 0.1s;
}

button:hover{
  background: #16a34a;
}

button:active{
  transform: scale(0.98);
}

.activeTarget,
.activeTarget:hover,
.activeTarget:active{
  width:42px;
  height:42px;
  padding:0;
  margin:0;
  background:rgba(79,216,255,.16);
  transform:translate(-50%,-50%);
}

#status{
  margin-top: 15px;
  color: #4fd8ff;
  font-weight: bold;
  line-height: 1.6;
}

input{
  font-size: 1rem;
  background: #0d233a;
  border: 1px solid #334155;
  color: white;
  outline: none;
}

input:focus {
  border-color: #4fd8ff;
}
</style>

<body>

<!-- Initial Plain Splash Screen with Innovine Logo -->
<div id="splash-overlay">
  <div style="text-align:center;">
    <div style="font-size:54px;line-height:1;margin-bottom:10px;">⚛️</div>
    <img src="assets/innovine-logo.png" alt="Innovine Logo"
         style="margin:auto;"
         onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='assets/logo.png';}else{this.style.display='none';}">
    <div style="margin-top:10px;color:#4fd8ff;font-weight:800;font-size:1.15rem;">Atomic Structure Research Lab</div>
  </div>
</div>

<!-- Audio Assets -->
<audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
<audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

<div class="container" id="main-container">

<div class="header-bar">
  <h1 class="title">🧪 Atomic Structure Research Lab</h1>
</div>

<div class="element-select-container">
  <label for="elementSelect"><strong>Target Element:</strong></label>
  <select id="elementSelect" onchange="resetLab()">
    <option value="H">Hydrogen (H)</option>
    <option value="He">Helium (He)</option>
    <option value="C" selected>Carbon (C)</option>
    <option value="O">Oxygen (O)</option>
    <option value="Na">Sodium (Na)</option>
  </select>
</div>

<div class="game">

<div class="panel">
  <h2>Instructions</h2>
  <br>
  <div id="instructionBox">Tap the particle and then tap the highlighted location.</div>
  <div id="particleArea"></div>
</div>

<div class="panel">
  <div class="atomArea" id="atomArea">
    <div class="shell shell3" id="shell3" style="display:none;"></div>
    <div class="shell shell2" id="shell2" style="display:none;"></div>
    <div class="shell shell1" id="shell1" style="display:none;"></div>
    <div id="nucleus"></div>
  </div>
</div>

<div class="panel">
  <h2>Mission</h2>
  <br>
  <div id="missionText">
    Stage 1
    <br><br>
    Add Protons
  </div>

  <div id="status">0 / 0 Protons Added</div>
  <div id="layoutNote" style="margin-top:8px;font-size:.78rem;color:#94a3b8;line-height:1.4;">
    Nucleons are packed inside the nucleus; electrons are placed on shells.
  </div>

  <button onclick="checkProgress()">Check Progress</button>
</div>

</div>
</div>

<script>
// Splash screen timer.
// Use DOMContentLoaded instead of window.onload so missing/slow images or audio
// cannot keep the game stuck on the splash screen.
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(() => {
    const splash = document.getElementById('splash-overlay');
    const main = document.getElementById('main-container');
    if (splash) splash.style.display = 'none';
    if (main) main.style.display = 'block';
  }, 850);
});

// Element Database
const ELEMENTS = {
  H:  { name: "Hydrogen", protons: 1,  neutrons: 0,  k: 1, l: 0, m: 0, mass: 1,  valenceElectrons: 1, valency: 1 },
  He: { name: "Helium",   protons: 2,  neutrons: 2,  k: 2, l: 0, m: 0, mass: 4,  valenceElectrons: 2, valency: 0 },
  C:  { name: "Carbon",   protons: 6,  neutrons: 6,  k: 2, l: 4, m: 0, mass: 12, valenceElectrons: 4, valency: 4 },
  O:  { name: "Oxygen",   protons: 8,  neutrons: 8,  k: 2, l: 6, m: 0, mass: 16, valenceElectrons: 6, valency: 2 },
  Na: { name: "Sodium",   protons: 11, neutrons: 12, k: 2, l: 8, m: 1, mass: 23, valenceElectrons: 1, valency: 1 }
};

let currentElementKey = "C";
let currentElement = ELEMENTS.C;

let stage = "proton"; // proton -> neutron -> k -> l -> m -> complete
let protonCount = 0;
let neutronCount = 0;
let kElectronCount = 0;
let lElectronCount = 0;
let mElectronCount = 0;

let selectedParticle = null;
let activeTarget = null;

const particleArea = document.getElementById("particleArea");
const nucleus = document.getElementById("nucleus");
const atomArea = document.getElementById("atomArea");

// Compact nucleus layout.
// Uses concentric rings that always stay inside the nucleus.
// Ring capacity is based on hexagonal packing: 1, 6, 12, 18...
function getNucleusPositions(totalParticles) {
  if (totalParticles <= 0) return [];

  const positions = [{ left: 50, top: 50 }];

  if (totalParticles === 1) return positions;

  let remaining = totalParticles - 1;
  let ring = 1;

  // Centre positions are kept within about 40% of the nucleus diameter,
  // leaving enough clearance for the particle radius at the edge.
  const radiusByRing = [0, 18, 33, 40];

  while (remaining > 0) {
    const ringCapacity = ring * 6;
    const particlesOnThisRing = Math.min(ringCapacity, remaining);
    const radiusPct = radiusByRing[ring] ?? 40;

    // Rotate alternate rings so particles do not form straight radial lines.
    const angleOffset =
      -Math.PI / 2 +
      (ring % 2 === 0 ? Math.PI / Math.max(particlesOnThisRing, 1) : 0);

    for (let i = 0; i < particlesOnThisRing; i++) {
      const angle =
        angleOffset +
        (i / particlesOnThisRing) * 2 * Math.PI;

      positions.push({
        left: 50 + radiusPct * Math.cos(angle),
        top: 50 + radiusPct * Math.sin(angle)
      });
    }

    remaining -= particlesOnThisRing;
    ring++;
  }

  return positions;
}


// Assign protons and neutrons to alternating nucleus slots.
// This keeps the nucleus visually mixed instead of making a red core
// with a yellow outer layer when protons are added before neutrons.
function getNucleusLayout(protons, neutrons) {
  const total = protons + neutrons;
  const positions = getNucleusPositions(total);
  const types = [];

  let pLeft = protons;
  let nLeft = neutrons;

  while (pLeft > 0 || nLeft > 0) {
    if (pLeft > 0) {
      types.push("proton");
      pLeft--;
    }

    if (nLeft > 0) {
      types.push("neutron");
      nLeft--;
    }
  }

  // Pair the alternating particle types with the compact positions.
  return positions.map((pos, i) => ({
    ...pos,
    type: types[i] || (i % 2 === 0 ? "proton" : "neutron")
  }));
}


function playAudio(type) {
  const audio = document.getElementById("audio-" + type);
  if (audio) {
    audio.currentTime = 0;
    audio.play().catch(() => {}); // catch browser autoplay restrictions safely
  }
}

function getShellPoint(shellSelector, index, totalInShell) {
  const areaRect = atomArea.getBoundingClientRect();
  const shell = document.querySelector(shellSelector);
  const shellRect = shell.getBoundingClientRect();

  const cx = shellRect.left - areaRect.left + shellRect.width / 2;
  const cy = shellRect.top - areaRect.top + shellRect.height / 2;
  const radius = shellRect.width / 2;

  // Spread electrons evenly across 360 degrees
  const angleDeg = -90 + (index * (360 / totalInShell));
  const angle = angleDeg * Math.PI / 180;

  return {
    left: (cx + radius * Math.cos(angle)) + "px",
    top: (cy + radius * Math.sin(angle)) + "px"
  };
}

function createParticle(type) {
  particleArea.innerHTML = "";

  const particle = document.createElement("div");
  particle.className = "particle " + type;
  particle.dataset.type = type;

  if (type === "proton") particle.innerHTML = "P";
  if (type === "neutron") particle.innerHTML = "N";
  if (type === "electron") particle.innerHTML = "−";

  particle.onclick = function() {
    selectParticle(particle);
  };

  particleArea.appendChild(particle);
}

function selectParticle(particle) {
  selectedParticle = particle;
  particle.style.transform = "scale(1.15)";
}

function updateStatus() {
  const status = document.getElementById("status");

  if (stage === "proton") {
    status.innerHTML = protonCount + " / " + currentElement.protons + " Protons Added";
  } else if (stage === "neutron") {
    status.innerHTML = neutronCount + " / " + currentElement.neutrons + " Neutrons Added";
  } else if (stage === "k") {
    status.innerHTML = kElectronCount + " / " + currentElement.k + " K-Shell Electrons";
  } else if (stage === "l") {
    status.innerHTML = lElectronCount + " / " + currentElement.l + " L-Shell Electrons";
  } else if (stage === "m") {
    status.innerHTML = mElectronCount + " / " + currentElement.m + " M-Shell Electrons";
  }
}

function updateInstructions() {
  const box = document.getElementById("instructionBox");

  if (stage === "proton") {
    box.innerHTML = "Tap the <strong>Proton</strong>, then tap the golden nucleus.";
  } else if (stage === "neutron") {
    box.innerHTML = "Tap the <strong>Neutron</strong>, then tap the golden nucleus.";
  } else if (stage === "k") {
    box.innerHTML = "Tap the <strong>Electron</strong>, then tap the glowing target on the K shell.";
  } else if (stage === "l") {
    box.innerHTML = "Tap the <strong>Electron</strong>, then tap the glowing target on the L shell.";
  } else if (stage === "m") {
    box.innerHTML = "Tap the <strong>Electron</strong>, then tap the glowing target on the M shell.";
  } else {
    box.innerHTML = "🏆 <strong>" + currentElement.name + " atom completed!</strong> Complete the assessment below.";
  }
}

nucleus.addEventListener("click", function() {
  if (!selectedParticle) return;

  const type = selectedParticle.dataset.type;

  if (type !== "proton" && type !== "neutron") {
    playAudio("wrong");
    return;
  }

  playAudio("correct");
  addToNucleus(type);
  selectedParticle = null;
  nextStep();
});

function addToNucleus(type) {
  const layout = getNucleusLayout(
    currentElement.protons,
    currentElement.neutrons
  );

  const matchingSlots = layout.filter(slot => slot.type === type);

  const typeIndex =
    type === "proton"
      ? protonCount
      : neutronCount;

  const pos =
    matchingSlots[typeIndex] ||
    { left: 50, top: 50 };

  const particle = document.createElement("div");
  particle.className = "nucleusParticle";
  particle.style.left = pos.left + "%";
  particle.style.top = pos.top + "%";
  particle.style.transform = "translate(-50%,-50%)";

  if (type === "proton") {
    particle.style.background = "#ff3b30";
    particle.style.color = "#fff";
    particle.innerHTML = "P";
    protonCount++;
  }

  if (type === "neutron") {
    particle.style.background = "#e7d54a";
    particle.style.color = "#333";
    particle.innerHTML = "N";
    neutronCount++;
  }

  nucleus.appendChild(particle);
  updateStatus();
}


function createTarget(left, top) {
  if (activeTarget) {
    activeTarget.remove();
  }

  activeTarget = document.createElement("button");
  activeTarget.type = "button";
  activeTarget.className = "activeTarget";
  activeTarget.style.left = left;
  activeTarget.style.top = top;
  activeTarget.setAttribute("aria-label", "Place electron on highlighted shell position");

  atomArea.appendChild(activeTarget);

  activeTarget.addEventListener("click", function(event) {
    event.stopPropagation();
    placeElectron(left, top);
  });
}

function placeElectron(left, top) {
  if (!selectedParticle) return;

  if (selectedParticle.dataset.type !== "electron") {
    playAudio("wrong");
    return;
  }

  playAudio("correct");

  const electron = document.createElement("div");
  electron.className = "electronPlaced";
  electron.style.left = left;
  electron.style.top = top;

  atomArea.appendChild(electron);

  if (activeTarget) {
    activeTarget.remove();
    activeTarget = null;
  }

  if (stage === "k") kElectronCount++;
  else if (stage === "l") lElectronCount++;
  else if (stage === "m") mElectronCount++;

  selectedParticle = null;
  updateStatus();
  nextStep();
}

function showNextTarget() {
  let pos;
  if (stage === "k") {
    pos = getShellPoint("#shell1", kElectronCount, currentElement.k);
  } else if (stage === "l") {
    pos = getShellPoint("#shell2", lElectronCount, currentElement.l);
  } else if (stage === "m") {
    pos = getShellPoint("#shell3", mElectronCount, currentElement.m);
  }
  if (pos) createTarget(pos.left, pos.top);
}

function nextStep() {
  // Protons Phase
  if (stage === "proton") {
    if (protonCount < currentElement.protons) {
      createParticle("proton");
      return;
    }
    
    if (currentElement.neutrons > 0) {
      stage = "neutron";
      document.getElementById("missionText").innerHTML = "<strong>Stage 2</strong> • Add " + currentElement.neutrons + " neutrons";
      createParticle("neutron");
      updateStatus();
      updateInstructions();
      return;
    } else {
      stage = "neutron"; // Bypass if element has 0 neutrons
    }
  }

  // Neutrons Phase
  if (stage === "neutron") {
    if (neutronCount < currentElement.neutrons) {
      createParticle("neutron");
      return;
    }

    if (currentElement.k > 0) {
      stage = "k";
      document.getElementById("shell1").style.display = "block";
      document.getElementById("missionText").innerHTML = "<strong>Stage 3</strong> • Place " + currentElement.k + " electron(s) in K shell";
      createParticle("electron");
      showNextTarget();
      updateStatus();
      updateInstructions();
      return;
    }
  }

  // K-Shell Phase
  if (stage === "k") {
    if (kElectronCount < currentElement.k) {
      createParticle("electron");
      showNextTarget();
      return;
    }

    if (currentElement.l > 0) {
      stage = "l";
      document.getElementById("shell2").style.display = "block";
      document.getElementById("missionText").innerHTML = "<strong>Stage 4</strong> • Place " + currentElement.l + " electron(s) in L shell";
      createParticle("electron");
      showNextTarget();
      updateStatus();
      updateInstructions();
      return;
    } else {
      stage = "complete";
    }
  }

  // L-Shell Phase
  if (stage === "l") {
    if (lElectronCount < currentElement.l) {
      createParticle("electron");
      showNextTarget();
      return;
    }

    if (currentElement.m > 0) {
      stage = "m";
      document.getElementById("shell3").style.display = "block";
      document.getElementById("missionText").innerHTML = "<strong>Stage 5</strong> • Place " + currentElement.m + " electron(s) in M shell";
      createParticle("electron");
      showNextTarget();
      updateStatus();
      updateInstructions();
      return;
    } else {
      stage = "complete";
    }
  }

  // M-Shell Phase
  if (stage === "m") {
    if (mElectronCount < currentElement.m) {
      createParticle("electron");
      showNextTarget();
      return;
    }
    stage = "complete";
  }

  // Assembly Completed
  if (stage === "complete") {
    particleArea.innerHTML = '<div style="text-align:center;font-size:1.2rem;color:#22c55e;font-weight:bold;">🏆 Assembly Complete</div>';

    let configStr = [currentElement.k, currentElement.l, currentElement.m].filter(x => x > 0).join(",");

    document.getElementById("missionText").innerHTML =
      currentElement.name + " Built<br><br>Atomic Number: " + currentElement.protons +
      "<br>Mass Number: " + currentElement.mass +
      "<br>Electronic Config: " + configStr +
      "<br>Outer-shell Electrons: " + currentElement.valenceElectrons +
      "<br>Valency: " + currentElement.valency;

    document.getElementById("status").innerHTML =
      "✔ " + protonCount + " Protons<br>" +
      "✔ " + neutronCount + " Neutrons<br>" +
      "✔ " + (kElectronCount + lElectronCount + mElectronCount) + " Electrons";

    updateInstructions();
    showQuiz();
  }
}

function resetLab() {
  currentElementKey = document.getElementById("elementSelect").value;
  currentElement = ELEMENTS[currentElementKey];

  stage = "proton";
  protonCount = 0;
  neutronCount = 0;
  kElectronCount = 0;
  lElectronCount = 0;
  mElectronCount = 0;
  selectedParticle = null;

  if (activeTarget) activeTarget.remove();
  activeTarget = null;

  // Clear visual nodes
  nucleus.innerHTML = "";
  document.querySelectorAll(".electronPlaced").forEach(e => e.remove());

  // Hide Orbit Shells
  document.getElementById("shell1").style.display = "none";
  document.getElementById("shell2").style.display = "none";
  document.getElementById("shell3").style.display = "none";

  // Reset UI Screens
  const quiz = document.getElementById("quizScreen");
  const cert = document.getElementById("certificateScreen");
  if (quiz) quiz.style.display = "none";
  if (cert) cert.style.display = "none";

  document.getElementById("missionText").innerHTML = "<strong>Stage 1</strong> • Add " + currentElement.protons + " protons";
  
  createParticle("proton");
  updateStatus();
  updateInstructions();
}

// Inject Quiz UI
const quizHTML = `
<div id="quizScreen" class="panel" style="display:none;margin-top:20px;">
  <h2>🧠 <span id="quizTitle"></span> Assessment Challenge</h2>
  <br>

  <p>1. What is the Atomic Number of this element?</p>
  <input id="q1" type="number" style="width:100%;padding:10px;border-radius:10px;margin-top:5px;">
  <br><br>

  <p>2. What is the Mass Number?</p>
  <input id="q2" type="number" style="width:100%;padding:10px;border-radius:10px;margin-top:5px;">
  <br><br>

  <p>3. How many electrons are present in the outermost occupied shell?</p>
  <input id="q3" type="number" style="width:100%;padding:10px;border-radius:10px;margin-top:5px;">
  <br><br>

  <p>4. What is the valency of this element?</p>
  <input id="q4" type="number" style="width:100%;padding:10px;border-radius:10px;margin-top:5px;">
  <br><br>

  <button onclick="checkQuiz()">Submit Assessment</button>
</div>
`;

document.querySelector(".container").insertAdjacentHTML("beforeend", quizHTML);

function showQuiz() {
  document.getElementById("quizTitle").innerText = currentElement.name;
  document.getElementById("q1").value = "";
  document.getElementById("q2").value = "";
  document.getElementById("q3").value = "";
  document.getElementById("q4").value = "";
  document.getElementById("quizScreen").style.display = "block";
}

function checkQuiz() {
  const q1 = parseInt(document.getElementById("q1").value);
  const q2 = parseInt(document.getElementById("q2").value);
  const q3 = parseInt(document.getElementById("q3").value);
  const q4 = parseInt(document.getElementById("q4").value);

  if (
    q1 === currentElement.protons &&
    q2 === currentElement.mass &&
    q3 === currentElement.valenceElectrons &&
    q4 === currentElement.valency
  ) {
    playAudio("correct");
    showCertificate();
  } else {
    playAudio("wrong");
    alert("Some answers are incorrect. Check your atomic calculations and try again!");
  }
}

// Inject Certificate UI
const certificateHTML = `
<div id="certificateScreen" class="panel" style="display:none;margin-top:20px;text-align:center;">
  <h1>🏆 Certificate of Achievement</h1>
  <br>

  <p>Enter Student Name</p>
  <br>

  <input id="studentName" placeholder="Student Name" style="width:300px;max-width:100%;padding:12px;border-radius:10px;text-align:center;">
  <br><br>

  <button onclick="generateCertificate()">Generate Certificate</button>
  <br><br>

  <div id="certificateContent" style="display:none; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; border: 1px solid #22c55e;">
    <h2 id="studentDisplay" style="color:#4fd8ff;"></h2>
    <br>

    <p id="certSummary"></p>
    <br>

    <h2 style="color:#22c55e;">⭐ Atomic Master ⭐</h2>
    <br>

    <button onclick="resetLab()">Build Another Atom</button>
  </div>
</div>
`;

document.querySelector(".container").insertAdjacentHTML("beforeend", certificateHTML);

function showCertificate() {
  document.getElementById("certificateScreen").style.display = "block";
  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

function generateCertificate() {
  const name = document.getElementById("studentName").value.trim();

  if (name === "") {
    playAudio("wrong");
    alert("Please enter a student name.");
    return;
  }

  playAudio("correct");
  document.getElementById("studentDisplay").innerHTML = name;
  document.getElementById("certSummary").innerHTML = 
    "Has successfully assembled a <strong>" + currentElement.name + "</strong> atom.<br>" +
    "Atomic Number: " + currentElement.protons + " | Mass Number: " + currentElement.mass + "<br>" +
    "Outer-shell Electrons: " + currentElement.valenceElectrons + "<br>" +
    "Valency: " + currentElement.valency;
    
  document.getElementById("certificateContent").style.display = "block";
}

function checkProgress() {
  if (stage === "complete") {
    showQuiz();
  } else {
    playAudio("wrong");
    alert("Keep building the " + currentElement.name + " atom!");
  }
}

// Initialize default lab setup
resetLab();
</script>
