<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrient Detective</title>

<style>

/* ================= GLOBAL RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;

/* FADED BACKGROUND RULE */
background:
linear-gradient(rgba(255,255,255,0.88),rgba(255,255,255,0.92)),
url("assets/clinic-bg.png");

background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* ================= SPLASH ================= */
#splash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

#splash img{
width:220px;
animation:fade 1s ease;
}

@keyframes fade{
from{opacity:0;transform:scale(0.7);}
to{opacity:1;transform:scale(1);}
}

/* ================= SCREENS ================= */
.screen{
display:none;
padding:15px;
text-align:center;
}

.card{
background:rgba(255,255,255,0.96);
max-width:900px;
margin:auto;
padding:18px;
border-radius:18px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

/* ================= BUTTONS ================= */
button{
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
width:100%;
}

.start{
background:#2e7d32;
color:white;
}

/* ================= HUD ================= */
.hud{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
font-weight:bold;
margin-bottom:10px;
font-size:14px;
}

/* ================= OPTIONS ================= */
.option{
margin:8px 0;
padding:12px;
background:#e3f2fd;
border-radius:10px;
font-size:15px;
}

/* ================= FEEDBACK ================= */
.correct{background:#c8e6c9;padding:10px;border-radius:10px;}
.wrong{background:#ffcdd2;padding:10px;border-radius:10px;}
.hint{background:#fff3cd;padding:10px;border-radius:10px;}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
.card{margin:10px;}
.hud{font-size:13px;}
button{font-size:15px;}
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png">
</div>

<!-- INTRO -->
<div class="screen" id="intro">
<div class="card">
<img src="assets/innovine-logo.png" style="width:140px;">
<h2>🧪 Nutrient Detective</h2>
<p>Diagnose nutrient deficiencies using symptoms & food clues.</p>
<button class="start" onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div class="screen" id="game">

<div class="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div>❤️ Lives: <span id="life">2</span></div>
<div>📌 Q: <span id="qno">1</span></div>
</div>

<div class="card">
<h3 id="question"></h3>
<div id="options"></div>
<div id="feedback"></div>
</div>

</div>

<!-- RESULT -->
<div class="screen" id="result">
<div class="card">
<h2>🏁 Completed!</h2>
<p>Final Score: <span id="final"></span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

/* ================= SPLASH 3s ================= */
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="block";
},3000);

/* ================= START ================= */
function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
loadQ();
}

/* ================= STATE ================= */
let score=0;
let life=2;
let qIndex=0;
let attempt=1;
let lock=false;

/* ================= QUESTIONS ================= */
const data=[
{
q:"A child cannot see in dim light. Which nutrient is missing?",
o:["Vitamin A","Vitamin C","Iron","Calcium"],
a:"Vitamin A",
hint:"Think about vision 👁️"
},
{
q:"Bleeding gums and slow healing?",
o:["Vitamin C","Vitamin A","Iron","Calcium"],
a:"Vitamin C",
hint:"Think about wounds 🩹"
},
{
q:"Pale skin and tiredness?",
o:["Iron","Calcium","Vitamin A","Iodine"],
a:"Iron",
hint:"Think about blood ❤️"
},
{
q:"Swollen thyroid gland?",
o:["Iodine","Iron","Vitamin C","Calcium"],
a:"Iodine",
hint:"Think neck gland 🧠"
},
{
q:"Weak bones and teeth decay?",
o:["Calcium","Iron","Vitamin A","Vitamin C"],
a:"Calcium",
hint:"Think bones 🦴"
}
];

/* ================= LOAD ================= */
function loadQ(){

if(qIndex>=data.length){
end();
return;
}

attempt=1;
lock=false;

document.getElementById("qno").innerText=qIndex+1;
document.getElementById("question").innerText=data[qIndex].q;

let html="";
data[qIndex].o.forEach(opt=>{
html+=`<div class="option" onclick="check('${opt}')">${opt}</div>`;
});

document.getElementById("options").innerHTML=html;
document.getElementById("feedback").innerHTML="";
}

/* ================= CHECK ================= */
function check(ans){

if(lock) return;

let q=data[qIndex];

if(ans===q.a){

document.getElementById("correctSound").play();

score+=10;
document.getElementById("feedback").innerHTML="✅ Correct!";
document.getElementById("feedback").className="correct";

lock=true;

setTimeout(()=>{
qIndex++;
updateHUD();
loadQ();
},1000);

}else{

document.getElementById("wrongSound").play();
life--;
updateHUD();

if(attempt===1){

document.getElementById("feedback").innerHTML="💡 Hint: "+q.hint;
document.getElementById("feedback").className="hint";
attempt=2;
lock=false;

}else{

document.getElementById("feedback").innerHTML="❌ Answer: "+q.a;
document.getElementById("feedback").className="wrong";

lock=true;

setTimeout(()=>{
qIndex++;
loadQ();
},1500);

}

if(life<0){
end();
}

}
}

/* ================= HUD ================= */
function updateHUD(){
document.getElementById("score").innerText=score;
document.getElementById("life").innerText=life;
}

/* ================= END ================= */
function end(){
document.getElementById("game").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("final").innerText=score;
document.getElementById("clapSound").play();
}

</script>

</body>
</html>
