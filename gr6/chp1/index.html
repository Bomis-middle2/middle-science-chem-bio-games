<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrient Detective</title>

<style>
body{
margin:0;
font-family:Segoe UI,sans-serif;
background:url("assets/clinic-bg.png") center/cover fixed;
overflow-x:hidden;
}

/* SPLASH */
#splash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}
#splash img{
width:250px;
}

/* SCREEN */
.screen{
display:none;
padding:20px;
text-align:center;
}

/* CARD */
.card{
background:rgba(255,255,255,0.95);
max-width:900px;
margin:auto;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* BUTTON */
button{
padding:15px 25px;
margin:10px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

.start{
background:#2e7d32;
color:white;
}

/* HUD */
.hud{
display:flex;
justify-content:space-around;
margin-bottom:15px;
font-weight:bold;
}

/* OPTIONS */
.option{
display:block;
width:100%;
padding:15px;
margin:10px 0;
border-radius:12px;
background:#e3f2fd;
}

/* FEEDBACK */
.correct{background:#c8e6c9;}
.wrong{background:#ffcdd2;}

img.logo{
width:160px;
margin-bottom:10px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png">
</div>

<!-- INSTRUCTION -->
<div class="screen" id="intro">
<div class="card">
<img class="logo" src="assets/innovine-logo.png">
<h2>🧪 Nutrient Detective</h2>
<p>Find the missing nutrients from symptoms and food clues!</p>
<button class="start" onclick="startGame()">Start</button>
</div>
</div>

<!-- GAME -->
<div class="screen" id="game">
<div class="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div>❤️ Lives: <span id="life">2</span></div>
<div>📌 Q: <span id="qno">1</span></div>
</div>

<div class="card">
<h3 id="question"></h3>
<div id="options"></div>
<div id="feedback"></div>
</div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
<div class="card">
<h2>🏁 Game Over</h2>
<p>Final Score: <span id="final"></span></p>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="block";
},1500);

function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
loadQ();
}

let score=0;
let life=2;
let q=0;

const data=[
{
q:"A child cannot see in dim light. Which nutrient is missing?",
o:["Vitamin A","Vitamin C","Iron","Calcium"],
a:"Vitamin A"
},
{
q:"Bleeding gums and slow healing?",
o:["Vitamin C","Vitamin A","Iron","Calcium"],
a:"Vitamin C"
},
{
q:"Pale skin and tiredness?",
o:["Iron","Calcium","Vitamin A","Iodine"],
a:"Iron"
},
{
q:"Swollen thyroid gland?",
o:["Iodine","Iron","Vitamin C","Calcium"],
a:"Iodine"
},
{
q:"Weak bones and teeth decay?",
o:["Calcium","Iron","Vitamin A","Vitamin C"],
a:"Calcium"
}
];

function loadQ(){
if(q>=data.length){
end();
return;
}

document.getElementById("qno").innerText=q+1;
document.getElementById("question").innerText=data[q].q;

let opt="";
data[q].o.forEach(op=>{
opt+=`<button class="option" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=opt;
document.getElementById("feedback").innerHTML="";
}

function check(ans){
let d=data[q];

if(ans===d.a){
document.getElementById("correctSound").play();
score+=10;
document.getElementById("feedback").innerHTML="✅ Correct!";
document.getElementById("feedback").className="correct";
setTimeout(()=>{q++;loadQ();},1000);
}
else{
document.getElementById("wrongSound").play();
life--;
document.getElementById("feedback").innerHTML="❌ Try again!";
document.getElementById("feedback").className="wrong";

if(life<0){
end();
}
}
updateHUD();
}

function updateHUD(){
document.getElementById("score").innerText=score;
document.getElementById("life").innerText=life;
}

function end(){
document.getElementById("game").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("final").innerText=score;
document.getElementById("clapSound").play();
}

</script>

</body>
</html>
