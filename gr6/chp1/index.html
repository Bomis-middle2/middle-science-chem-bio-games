<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrient Detective</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI,sans-serif;
background:
radial-gradient(circle at center,
rgba(255,255,255,0.75),
rgba(255,255,255,0.92)),
url("assets/clinic-bg.png");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* SPLASH */
#splash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

#splash img{width:220px;}

/* SCREENS */
.screen{display:none;padding:15px;}

.card{
background:rgba(255,255,255,0.96);
max-width:900px;
margin:auto;
padding:18px;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
text-align:center;
}

/* BUTTON */
button{
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
width:100%;
}

.start{background:#2e7d32;color:white;}

/* LAYOUT */
.game-wrapper{
display:grid;
grid-template-columns:1fr;
gap:15px;
max-width:1100px;
margin:auto;
}

/* HUD */
.hud{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
font-weight:bold;
font-size:14px;
background:rgba(255,255,255,0.85);
padding:10px;
border-radius:12px;
margin-bottom:10px;
}

/* CASE */
.case-panel{
background:rgba(255,255,255,0.95);
padding:15px;
border-radius:16px;
box-shadow:0 6px 15px rgba(0,0,0,0.12);
}

.case-title{
background:#1976d2;
color:white;
padding:8px;
border-radius:10px;
margin-bottom:10px;
font-weight:bold;
}

/* OPTIONS */
.option{
margin:8px 0;
padding:12px;
background:#e3f2fd;
border-radius:10px;
cursor:pointer;
}

/* FEEDBACK */
.correct{background:#c8e6c9;padding:10px;border-radius:10px;margin-top:10px;}
.wrong{background:#ffcdd2;padding:10px;border-radius:10px;margin-top:10px;}
.hint{background:#fff3cd;padding:10px;border-radius:10px;margin-top:10px;}

/* WHEEL */
#wheelModal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
z-index:99999;
}

#wheelBox{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
width:260px;
}

#wheel{
width:160px;
height:160px;
border-radius:50%;
border:8px solid #1976d2;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
margin:15px auto;
transition:transform 3s ease;
}

/* DESKTOP */
@media(min-width:900px){
.game-wrapper{grid-template-columns:1fr 1fr;}
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png">
</div>

<!-- INTRO -->
<div class="screen" id="intro">
<div class="card">
<img src="assets/innovine-logo.png" style="width:140px;">
<h2>🏥 Nutrient Detective</h2>
<p>Diagnose patients using symptoms</p>
<button class="start" onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div class="screen" id="game">

<div class="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div>❤️ Lives: <span id="life">2</span></div>
<div>📌 Q: <span id="qno">1</span></div>
</div>

<div class="game-wrapper">

<div class="case-panel">
<div class="case-title">🏥 CASE FILE</div>
<div id="caseText"></div>
</div>

<div class="card">
<h3 id="question"></h3>
<div id="options"></div>
<div id="feedback"></div>
</div>

</div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
<div class="card">
<h2>🏁 Completed</h2>
<p>Final Score: <span id="final"></span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<!-- WHEEL -->
<div id="wheelModal">
<div id="wheelBox">
<h3>🎡 Spin Reward</h3>
<div id="wheel">SPIN</div>
<button onclick="spinWheel()">SPIN</button>
</div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

/* ================= SPLASH (FIXED) ================= */
window.onload=function(){
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="block";
},3000);
}

/* ================= STATE ================= */
let score=0;
let life=2;
let qIndex=0;
let attempt=1;
let lock=false;

/* ================= QUESTIONS ================= */
const data=[
{
q:"Night blindness detected",
case:"Patient cannot see in dim light.",
o:["Vitamin A","Vitamin C","Iron","Calcium"],
a:"Vitamin A",
hint:"Think eyes 👁️"
},
{
q:"Bleeding gums",
case:"Gums are bleeding.",
o:["Vitamin C","Vitamin A","Iron","Calcium"],
a:"Vitamin C",
hint:"Think healing 🩹"
},
{
q:"Pale skin",
case:"Weak patient.",
o:["Iron","Calcium","Vitamin A","Iodine"],
a:"Iron",
hint:"Think blood ❤️"
}
];

/* ================= START ================= */
function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
loadQ();
}

/* ================= LOAD ================= */
function loadQ(){

if(qIndex>=data.length){
end();
return;
}

attempt=1;
lock=false;

let q=data[qIndex];

document.getElementById("qno").innerText=qIndex+1;
document.getElementById("question").innerText=q.q;
document.getElementById("caseText").innerText=q.case;

let html="";
q.o.forEach(opt=>{
html+=`<div class="option" onclick="check('${opt}')">${opt}</div>`;
});

document.getElementById("options").innerHTML=html;
document.getElementById("feedback").innerHTML="";
}

/* ================= CHECK ================= */
function check(ans){

if(lock) return;

let q=data[qIndex];

if(ans===q.a){

document.getElementById("correctSound").play();
score+=10;
lock=true;

document.getElementById("feedback").innerHTML="✅ Correct!";

setTimeout(()=>{
qIndex++;
updateHUD();
loadQ();

/* SAFE WHEEL TRIGGER */
if(qIndex>0 && qIndex%2===0){
showWheel();
}

},1000);

}else{

document.getElementById("wrongSound").play();
life--;
updateHUD();

if(attempt===1){
document.getElementById("feedback").innerHTML="💡 Hint: "+q.hint;
attempt=2;
lock=false;
}else{
document.getElementById("feedback").innerHTML="❌ Answer: "+q.a;
lock=true;

setTimeout(()=>{
qIndex++;
loadQ();
},1200);
}

if(life<0) end();
}
}

/* ================= HUD ================= */
function updateHUD(){
document.getElementById("score").innerText=score;
document.getElementById("life").innerText=life;
document.getElementById("qno").innerText=qIndex+1;
}

/* ================= WHEEL ================= */
let rewards=["+10","+5","Life","Nothing"];

function showWheel(){
document.getElementById("wheelModal").style.display="flex";
}

function spinWheel(){

let wheel=document.getElementById("wheel");
let deg=Math.floor(Math.random()*360)+720;

wheel.style.transform=`rotate(${deg}deg)`;

setTimeout(()=>{

let r=rewards[Math.floor(Math.random()*rewards.length)];

if(r==="+10") score+=10;
if(r==="+5") score+=5;
if(r==="Life") life++;

updateHUD();

document.getElementById("wheelModal").style.display="none";

},2500);
}

/* ================= END ================= */
function end(){
document.getElementById("game").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("final").innerText=score;
}

</script>

</body>
</html>
