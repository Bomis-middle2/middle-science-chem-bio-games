<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plant Adaptation Lab - Immersive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
overflow-x:hidden;
background:#0b1220;
color:white;
}

/* 🌿 ANIMATED BACKGROUND */
.bg{
position:fixed;
inset:0;
background:linear-gradient(120deg,#0b1220,#0f2a3a,#0b1220);
animation:bgMove 10s infinite alternate;
z-index:-2;
}

@keyframes bgMove{
0%{filter:hue-rotate(0deg);}
100%{filter:hue-rotate(25deg);}
}

/* FLOATING ICONS */
.float{
position:absolute;
width:40px;
opacity:0.3;
animation:floatUp 12s infinite linear;
}

@keyframes floatUp{
0%{transform:translateY(100vh) scale(0.8);}
100%{transform:translateY(-120vh) scale(1.2);}
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

/* INTRO */
.screen{
display:none;
min-height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
}

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:25px;
border-radius:16px;
width:95%;
max-width:900px;
text-align:center;
border:1px solid rgba(255,255,255,0.2);
}

/* GAME */
#game{
display:none;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
display:flex;
gap:20px;
flex-wrap:wrap;
}

.left,.right{
flex:1;
min-width:280px;
}

img{
width:100%;
border-radius:12px;
}

/* OPTIONS */
.option{
background:rgba(255,255,255,0.1);
padding:12px;
margin:10px 0;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#22c55e;
color:black;
}

/* SCORE */
.top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

/* FEEDBACK */
#feedback{
margin-top:10px;
font-weight:bold;
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg"></div>

<!-- FLOATING ICONS -->
<img src="assets/pea.png" class="float" style="left:10%; animation-delay:0s;">
<img src="assets/cactus.png" class="float" style="left:30%; animation-delay:2s;">
<img src="assets/onion.png" class="float" style="left:60%; animation-delay:4s;">
<img src="assets/mangrove.png" class="float" style="left:80%; animation-delay:6s;">

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" width="180">
</div>

<!-- INTRO -->
<div class="screen" id="intro">
<div class="card">
<h1>🌿 Plant Adaptation Lab</h1>
<p>Explore how plants survive in different environments</p>
<button onclick="startGame()">ENTER LAB</button>
</div>
</div>

<!-- GAME -->
<div id="game">

<div class="top">
<div>Score: <span id="score">0</span></div>
<div>Question: <span id="qno">1</span>/5</div>
</div>

<div class="container">

<div class="left">
<img id="img">
</div>

<div class="right">
<h3 id="q"></h3>

<div class="option" onclick="check('Root')">Root Adaptation</div>
<div class="option" onclick="check('Stem')">Stem Adaptation</div>
<div class="option" onclick="check('Leaf')">Leaf Adaptation</div>

<p id="feedback"></p>

</div>

</div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
<div class="card">
<h1>🎉 Lab Complete</h1>
<p>Score: <span id="final"></span></p>
<p id="badge"></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<!-- AUDIO -->
<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>

<script>

setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="flex";
},3000);

const data=[
{img:"assets/carrot.png",q:"Carrot stores food underground. Identify adaptation.",a:"Root"},
{img:"assets/mangrove.png",q:"Mangrove has breathing roots.",a:"Root"},
{img:"assets/onion.png",q:"Onion stores food in bulb.",a:"Stem"},
{img:"assets/cactus.png",q:"Cactus has spines instead of leaves.",a:"Leaf"},
{img:"assets/pea.png",q:"Pea plant climbs using tendrils.",a:"Stem"}
];

let i=0;
let score=0;

function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
load();
}

function load(){
document.getElementById("img").src=data[i].img;
document.getElementById("q").innerText=data[i].q;
document.getElementById("qno").innerText=i+1;
document.getElementById("feedback").innerText="";
}

function check(ans){

if(ans===data[i].a){
score++;
document.getElementById("correct").play();
document.getElementById("feedback").innerText="✔ Correct!";
}else{
document.getElementById("wrong").play();
document.getElementById("feedback").innerText="❌ Wrong!";
}

setTimeout(()=>{
i++;
if(i<data.length){
load();
}else{
end();
}
},900);
}

function end(){
document.getElementById("game").style.display="none";
document.getElementById("result").style.display="flex";
document.getElementById("final").innerText=score;

let badge="🌱 Beginner Botanist";
if(score>=4) badge="🌿 Plant Explorer";
if(score===5) badge="🌳 Plant Scientist";

document.getElementById("badge").innerText=badge;
}

</script>

</body>
</html>
