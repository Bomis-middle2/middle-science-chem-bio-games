<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🌿 Adaptation in Plants</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family: Arial;
  background:#0b1220;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* SPLASH */
.splash{
  position:fixed;inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.splash img{
  width:300px;
  animation:float 2s infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

/* MAIN */
.container{
  width:95%;
  max-width:1000px;
  background:#111827;
  border-radius:20px;
  padding:20px;
  display:none;
}

.header{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin-bottom:10px;
  color:#4ade80;
}

.panel{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.left,.right{
  flex:1;
  min-width:300px;
  background:#0f172a;
  padding:15px;
  border-radius:15px;
}

.box{
  background:#1e293b;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.options button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#334155;
  color:#fff;
}

.options button:hover{
  background:#22c55e;
  color:#000;
}

.score{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.feedback{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  display:none;
}

.correct{background:#14532d;}
.wrong{background:#7f1d1d;}

.nextBtn{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  background:#22c55e;
  color:#000;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->
<div class="container" id="game">

<div class="header">🌿 Separation of Substances Lab</div>

<div class="score">
  <div>Question: <span id="qno">1</span>/8</div>
  <div>Score: <span id="score">0</span></div>
</div>

<div class="panel">

  <div class="left">
    <div class="box">
      <b>Lab Observation</b>
      <div id="questionText"></div>
    </div>

    <div class="box options" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <button class="nextBtn" id="nextBtn">Next</button>
  </div>

</div>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

// SPLASH
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
  document.getElementById("game").style.display="block";
  loadQ();
},3000);

// QUESTIONS (STRICT G6 BIOLOGY)
const data = [
{
q:"A plant has very long roots that go deep into soil to absorb water in dry areas.",
options:["Storage Root","Tap Root Modification","Climbing Root","Respiratory Root"],
ans:1
},
{
q:"Some roots grow above ground in mangroves to help in breathing.",
options:["Prop Root","Respiratory Root","Fibrous Root","Tuber"],
ans:1
},
{
q:"A stem of ginger stores food underground.",
options:["Rhizome","Bulb","Leaf Spine","Tap Root"],
ans:0
},
{
q:"Onion stores food in its modified stem.",
options:["Bulb","Tuber","Fibrous Root","Climbing Stem"],
ans:0
},
{
q:"Cactus leaves are modified into spines.",
options:["Photosynthesis Leaf","Spine Leaf","Storage Leaf","Climbing Leaf"],
ans:1
},
{
q:"Pea plant uses tendrils to climb support.",
options:["Climbing Stem","Tendril Leaf","Storage Root","Respiration Leaf"],
ans:0
},
{
q:"Carrot stores food in its root.",
options:["Fibrous Root","Storage Root","Respiratory Root","Climbing Root"],
ans:1
},
{
q:"Banyan tree has roots growing from branches for support.",
options:["Prop Root","Tap Root","Bulb","Rhizome"],
ans:0
}
];

let i=0;
let score=0;

function loadQ(){
document.getElementById("qno").innerText=i+1;

let q=data[i];
document.getElementById("questionText").innerText=q.q;

let optBox=document.getElementById("options");
optBox.innerHTML="";

q.options.forEach((o,index)=>{
let btn=document.createElement("button");
btn.innerText=o;

btn.onclick=()=>{
check(index);
};
optBox.appendChild(btn);
});

document.getElementById("feedback").style.display="none";
document.getElementById("nextBtn").style.display="none";
}

function check(selected){
let q=data[i];
let fb=document.getElementById("feedback");

if(selected==q.ans){
score++;
document.getElementById("score").innerText=score;
fb.innerText="Correct!";
fb.className="feedback correct";
document.getElementById("correctSound").play();
}else{
fb.innerText="Wrong Answer!";
fb.className="feedback wrong";
document.getElementById("wrongSound").play();
}

fb.style.display="block";
document.getElementById("nextBtn").style.display="block";
}

document.getElementById("nextBtn").onclick=()=>{
i++;
if(i<data.length){
loadQ();
}else{
document.getElementById("game").innerHTML=
`<h1 style="text-align:center;color:#4ade80">🎉 Lab Completed</h1>
<p style="text-align:center">Score: ${score}/${data.length}</p>`;
document.getElementById("clapSound").play();
}
};

</script>

</body>
</html>
