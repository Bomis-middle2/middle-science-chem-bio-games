<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Detective Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI;
background:#eaf6ff;
}

/* FULL SCREEN CENTER */
.screen{
display:none;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
}

/* CARD */
.card{
background:white;
width:95%;
max-width:900px;
padding:20px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
text-align:center;
}

/* BUTTON */
button{
padding:14px;
border:none;
border-radius:10px;
width:100%;
cursor:pointer;
font-size:16px;
}

.start{background:#2e7d32;color:white;}

/* STORY */
#storyBox{
background:white;
padding:20px;
border-radius:12px;
max-width:900px;
line-height:1.6;
}

/* WORD BANK */
.wordbank{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:10px;
}

.wordbank div{
background:#d6ecff;
padding:6px 10px;
border-radius:8px;
}

/* INPUT */
input{
width:100%;
padding:12px;
margin-top:10px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
text-align:center;
}

</style>
</head>

<body>

<!-- 🟡 1. SPLASH -->
<div class="screen" id="splash">
<img src="assets/innovine-logo.png" style="width:220px;">
</div>

<!-- 🟢 2. INTRO -->
<div class="screen" id="intro">
<div class="card">

<img src="assets/innovine-logo.png" style="width:120px;">

<h2>🧬 Life Detective</h2>

<p style="text-align:left;margin:10px 0;">
✔ Watch story carefully<br>
✔ Listen to narration<br>
✔ Identify living characteristics<br>
✔ Type answer from word bank
</p>

<button class="start" onclick="startGame()">START MISSION</button>

</div>
</div>

<!-- 🌿 3. STORY -->
<div class="screen" id="storyScreen">
<div id="storyBox"></div>
</div>

<!-- ❓ 4. QUESTION -->
<div class="screen" id="questionScreen">
<div class="card">

<div class="wordbank">
<div>locomotion</div>
<div>growth</div>
<div>respiration</div>
<div>reproduction</div>
<div>sensitivity</div>
<div>nutrition</div>
<div>excretion</div>
</div>

<h3 id="questionText"></h3>

<input id="answer" placeholder="Type your answer here">

<button onclick="checkAnswer()">SUBMIT</button>

<p id="feedback"></p>

</div>
</div>

<!-- 🏁 5. RESULT -->
<div class="screen" id="result">
<div class="card">
<h2>🏁 Mission Complete</h2>
<p>Score: <span id="score">0</span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<script>

let index=0;
let score=0;

/* STORY DATA */
const data=[
{
story:`A bright sun shines over a playground. Children are running. Birds are chirping. Plants are growing taller. A Mimosa plant closes when touched.`,
question:`You saw that the boy was running in the playground. Type the correct living characteristic.`,
answer:`locomotion`
}
];

/* SPLASH */
window.onload=function(){
setTimeout(()=>{
show("intro");
},3000);
}

/* SCREEN CONTROL */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="flex";
}

/* START */
function startGame(){
show("storyScreen");

let s=data[index].story;

/* SHOW STORY */
document.getElementById("storyBox").innerText=s;

/* AUTO SPEECH (FEMALE VOICE DEFAULT BROWSER) */
let speech=new SpeechSynthesisUtterance(s);
speech.rate=0.9;
speech.pitch=1;
speechSynthesis.speak(speech);

/* MOVE TO QUESTION AFTER 6 SEC */
setTimeout(()=>{
show("questionScreen");
document.getElementById("questionText").innerText=data[index].question;
},6000);
}

/* CHECK ANSWER */
function checkAnswer(){

let user=document.getElementById("answer").value.toLowerCase().trim();
let correct=data[index].answer;

if(user===correct){
score+=10;
document.getElementById("feedback").innerText="✅ Correct!";
}else{
document.getElementById("feedback").innerText="❌ Try again!";
}

/* NEXT */
setTimeout(()=>{
index++;

if(index>=data.length){
document.getElementById("score").innerText=score;
show("result");
}else{
startGame();
}
},1500);
}

</script>

</body>
</html>
