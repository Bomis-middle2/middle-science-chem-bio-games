<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Detective Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI;
}

/* 🔵 SPLASH */
#splash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

/* 🟡 SCREEN BASE */
.screen{
display:none;
height:100vh;
width:100%;
}

/* 🧠 INTRO */
#intro{
display:flex;
align-items:center;
justify-content:center;
background:#eaf6ff;
}

.card{
background:white;
padding:20px;
border-radius:16px;
width:90%;
max-width:800px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* 🌿 STORY SCREEN FIX (IMPORTANT PART) */
#storyScreen{
position:relative;
background:url("assets/living-story-background.png") center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
}

#storyOverlay{
background:rgba(255,255,255,0.85);
padding:20px;
border-radius:16px;
width:85%;
max-width:850px;
font-size:18px;
line-height:1.6;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* ❓ QUESTION SCREEN */
#questionScreen{
background:#eaf6ff;
display:flex;
align-items:center;
justify-content:center;
}

.qbox{
background:white;
padding:20px;
border-radius:16px;
width:90%;
max-width:850px;
text-align:center;
}

.wordbank{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:10px;
}

.wordbank div{
background:#d6ecff;
padding:6px 10px;
border-radius:8px;
}

input{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
margin-top:10px;
text-align:center;
}

button{
margin-top:10px;
padding:12px;
width:100%;
border:none;
border-radius:10px;
background:#2e7d32;
color:white;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- 🔵 SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" style="width:220px;">
</div>

<!-- 🟡 INTRO -->
<div class="screen" id="intro">
<div class="card">
<img src="assets/innovine-logo.png" style="width:120px;">
<h2>🧬 Life Detective</h2>
<p>Learn characteristics of living things through real-life stories</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- 🌿 STORY -->
<div class="screen" id="storyScreen">
<div id="storyOverlay"></div>
</div>

<!-- ❓ QUESTION -->
<div class="screen" id="questionScreen">
<div class="qbox">

<div class="wordbank">
<div>locomotion</div>
<div>growth</div>
<div>respiration</div>
<div>reproduction</div>
<div>sensitivity</div>
<div>nutrition</div>
<div>excretion</div>
</div>

<h3 id="questionText"></h3>

<input id="answer" placeholder="Type your answer">

<button onclick="checkAnswer()">SUBMIT</button>

<p id="feedback"></p>

</div>
</div>

<script>

/* 🌿 STORY */
const story = `
A bright morning sun shines over a lively playground. Children are running and playing. Birds are chirping in trees. Plants are growing taller every day. A Mimosa plant closes its leaves when touched.
`;

/* ❓ QUESTIONS */
const questions = [
{
q:"You saw that the boy was running in the playground. Type the correct living characteristic:",
a:"locomotion"
}
];

let index=0;

/* 🚀 START */
function startGame(){
show("storyScreen");

let box=document.getElementById("storyOverlay");
box.innerText=story;

/* AUTO SPEECH */
let speech=new SpeechSynthesisUtterance(story);
speech.rate=0.9;

/* AFTER VOICE → MOVE */
speech.onend=function(){
show("questionScreen");
loadQ();
};

speechSynthesis.cancel();
speechSynthesis.speak(speech);
}

/* ❓ LOAD QUESTION */
function loadQ(){
document.getElementById("questionText").innerText=
questions[index].q;
}

/* ✔ CHECK */
function checkAnswer(){

let user=document.getElementById("answer").value.toLowerCase().trim();
let correct=questions[index].a;

if(user===correct){
document.getElementById("feedback").innerText="✅ Correct!";
}else{
document.getElementById("feedback").innerText="❌ Try again!";
}
}

/* 🧠 SCREEN SWITCH */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="flex";
}

</script>

</body>
</html>
