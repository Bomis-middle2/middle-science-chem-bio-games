<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Detective Image Game</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI;
background:#eaf6ff;
}

/* 🔵 SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

/* 🟡 SCREEN SYSTEM */
.screen{
display:none;
height:100vh;
width:100%;
}

/* ACTIVE SCREEN */
.active{
display:flex;
align-items:center;
justify-content:center;
}

/* 🧠 INTRO */
#intro .box{
background:white;
padding:20px;
border-radius:16px;
width:90%;
max-width:800px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* 🌿 GAME LAYOUT */
.game-container{
display:flex;
width:95%;
max-width:1100px;
gap:15px;
}

/* 🖼 IMAGE PANEL */
.image-box{
flex:1;
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.image-box img{
width:100%;
height:100%;
object-fit:cover;
}

/* ❓ QUESTION PANEL */
.qbox{
flex:1;
background:white;
border-radius:16px;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
display:flex;
flex-direction:column;
justify-content:center;
}

/* WORD BANK */
.wordbank{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:10px;
}

.wordbank div{
background:#d6ecff;
padding:6px 10px;
border-radius:8px;
font-size:14px;
}

/* INPUT */
input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
text-align:center;
font-size:16px;
}

button{
margin-top:10px;
padding:12px;
width:100%;
border:none;
border-radius:10px;
background:#2e7d32;
color:white;
font-size:16px;
cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){
.game-container{
flex-direction:column;
}
}

</style>
</head>

<body>

<!-- 🔵 SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" style="width:220px;">
</div>

<!-- 🟡 INTRO -->
<div id="intro" class="screen active">
<div class="box">
<img src="assets/innovine-logo.png" style="width:120px;">
<h2>🧬 Life Detective</h2>
<p>Observe the image and identify characteristics of living things.</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- 🌿 GAME -->
<div id="game" class="screen">

<div class="game-container">

<!-- IMAGE -->
<div class="image-box">
<img id="sceneImg" src="">
</div>

<!-- QUESTION -->
<div class="qbox">

<div class="wordbank">
<div>locomotion</div>
<div>growth</div>
<div>respiration</div>
<div>reproduction</div>
<div>sensitivity</div>
<div>nutrition</div>
<div>excretion</div>
</div>

<h3 id="questionText"></h3>

<input id="answer" placeholder="Type your answer">

<button onclick="checkAnswer()">SUBMIT</button>

<p id="feedback"></p>

</div>

</div>

</div>

<script>

/* 🧠 DATA (IMAGE + QUESTION) */
const data=[
{
img:"assets/living-story-background.png",
q:"You saw that the boy was running in the playground. Type the correct living characteristic.",
a:"locomotion"
},
{
img:"assets/living-story-background.png",
q:"Plants are growing taller every day. Type the correct characteristic.",
a:"growth"
},
{
img:"assets/living-story-background.png",
q:"A Mimosa plant closes its leaves when touched. Type the correct characteristic.",
a:"sensitivity"
}
];

let index=0;

/* 🔵 SPLASH */
window.onload=function(){
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").classList.add("active");
},3000);
}

/* 🚀 START */
function startGame(){
showGame();
loadQ();
}

/* 🧩 SHOW GAME */
function showGame(){
document.getElementById("intro").classList.remove("active");
document.getElementById("game").classList.add("active");
}

/* 🖼 LOAD QUESTION */
function loadQ(){

document.getElementById("sceneImg").src=data[index].img;
document.getElementById("questionText").innerText=data[index].q;
document.getElementById("answer").value="";
document.getElementById("feedback").innerText="";
}

/* ✔ CHECK */
function checkAnswer(){

let user=document.getElementById("answer").value.toLowerCase().trim();
let correct=data[index].a;

if(user===correct){
document.getElementById("feedback").innerText="✅ Correct!";
}else{
document.getElementById("feedback").innerText="❌ Try again!";
return;
}

setTimeout(()=>{
index++;

if(index>=data.length){
alert("Game Completed!");
location.reload();
}else{
loadQ();
}
},1000);

}

</script>

</body>
</html>
