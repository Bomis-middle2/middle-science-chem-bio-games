<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Detective</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI,sans-serif;
background:#eaf6ff;
}

/* ================= SPLASH ================= */
#splash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

/* ================= SCREENS ================= */
.screen{
display:none;
min-height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
}

/* ================= CARD ================= */
.card{
background:white;
width:95%;
max-width:900px;
padding:20px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
text-align:center;
}

/* ================= BUTTON ================= */
button{
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
width:100%;
}

.start{background:#2e7d32;color:white;}

/* ================= WORD BANK ================= */
.wordbank{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:10px;
}

.word{
background:#d6ecff;
padding:8px 12px;
border-radius:8px;
font-weight:bold;
}

/* ================= INPUT ================= */
input{
width:100%;
padding:12px;
font-size:16px;
text-align:center;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
}

/* ================= HUD ================= */
.hud{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-weight:bold;
}

.story{
background:#f2f9ff;
padding:15px;
border-radius:12px;
margin-bottom:10px;
line-height:1.6;
}

</style>
</head>

<body>

<!-- 🔵 SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" style="width:220px;">
</div>

<!-- 🟡 INTRO -->
<div class="screen" id="intro">
<div class="card">
<img src="assets/innovine-logo.png" style="width:120px;">
<h2>🧬 Life Detective</h2>

<p style="text-align:left;margin:10px 0;">
✔ Read the story carefully<br>
✔ Observe living things<br>
✔ Use word bank to answer<br>
✔ Type correct characteristic
</p>

<button class="start" onclick="startGame()">START MISSION</button>
</div>
</div>

<!-- 🟢 GAME -->
<div class="screen" id="game">

<div class="card">

<div class="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div>❤️ Lives: <span id="life">2</span></div>
</div>

<div id="story" class="story"></div>

<div class="wordbank">
<div class="word">locomotion</div>
<div class="word">growth</div>
<div class="word">respiration</div>
<div class="word">reproduction</div>
<div class="word">sensitivity</div>
<div class="word">nutrition</div>
<div class="word">excretion</div>
</div>

<h3 id="question"></h3>

<input id="answer" placeholder="Type your answer here...">

<button onclick="checkAnswer()">SUBMIT</button>

<p id="feedback"></p>

</div>
</div>

<!-- 🏁 RESULT -->
<div class="screen" id="result">
<div class="card">
<h2>🏁 Mission Completed</h2>
<p>Final Score: <span id="final"></span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<!-- 🔊 AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

/* ================= DATA ================= */
let score=0;
let life=2;
let index=0;

const stories=[
{
text:`A bright morning sun lights up the school playground where children are happily playing. Some boys are running while birds are chirping in the trees. Plants are growing taller every day. A Mimosa plant closes its leaves when touched.`,
answer:"locomotion"
}
];

/* ================= SPLASH ================= */
window.onload=function(){
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="flex";
},3000);
}

/* ================= START ================= */
function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="flex";
loadStory();
}

/* ================= STORY ================= */
function loadStory(){

let s=stories[index];

document.getElementById("story").innerText=s.text;
document.getElementById("question").innerText=
"You saw that the boy was running in the playground. Type in the correct living characteristic from the word bank.";

speechSynthesis.cancel();

let speech=new SpeechSynthesisUtterance(s.text);
speech.rate=0.9;
speechSynthesis.speak(speech);
}

/* ================= CHECK ================= */
function checkAnswer(){

let user=document.getElementById("answer").value.toLowerCase().trim();
let correct=stories[index].answer;

if(user===correct){
document.getElementById("correctSound").play().catch(()=>{});
score+=10;
document.getElementById("feedback").innerText="✅ Correct!";
}
else{
document.getElementById("wrongSound").play().catch(()=>{});
life--;
document.getElementById("feedback").innerText="❌ Try Again!";
}

updateHUD();

if(life<0){
endGame();
}
}

/* ================= HUD ================= */
function updateHUD(){
document.getElementById("score").innerText=score;
document.getElementById("life").innerText=life;
}

/* ================= END ================= */
function endGame(){
document.getElementById("game").style.display="none";
document.getElementById("result").style.display="flex";
document.getElementById("final").innerText=score;
}

</script>

</body>
</html>
