<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Detective Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI;
background:#eaf6ff;
}

/* SPLASH */
#splash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

/* SCREENS */
.screen{
display:none;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
}

/* CARD */
.card{
background:white;
width:95%;
max-width:900px;
padding:20px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
text-align:center;
}

/* BUTTON */
button{
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
width:100%;
}

.start{background:#2e7d32;color:white;}

/* STORY BOX */
#storyBox{
background:white;
padding:20px;
border-radius:12px;
max-width:900px;
line-height:1.6;
font-size:18px;
}

/* INPUT */
input{
width:100%;
padding:12px;
font-size:16px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
text-align:center;
}

/* QUESTION */
.wordbank{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:10px;
}

.wordbank div{
background:#d6ecff;
padding:6px 10px;
border-radius:8px;
font-size:14px;
}

</style>
</head>

<body>

<!-- 🔵 SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" style="width:220px;">
</div>

<!-- 🟡 INTRO -->
<div class="screen" id="intro">
<div class="card">

<img src="assets/innovine-logo.png" style="width:120px;">

<h2>🧬 Life Detective Pro</h2>

<p style="text-align:left;margin:10px 0;">
✔ Listen to the story carefully<br>
✔ Observe living things<br>
✔ Identify characteristics<br>
✔ Type answers correctly
</p>

<button class="start" onclick="startGame()">START MISSION</button>

</div>
</div>

<!-- 🌿 STORY -->
<div class="screen" id="storyScreen">
<div id="storyBox"></div>
</div>

<!-- ❓ QUESTION -->
<div class="screen" id="questionScreen">
<div class="card">

<div class="wordbank">
<div>locomotion</div>
<div>growth</div>
<div>respiration</div>
<div>reproduction</div>
<div>sensitivity</div>
<div>nutrition</div>
<div>excretion</div>
</div>

<h3 id="questionText"></h3>

<input id="answer" placeholder="Type your answer">

<button onclick="checkAnswer()">SUBMIT</button>

<p id="feedback"></p>

<p>⭐ Score: <span id="score">0</span></p>

</div>
</div>

<!-- 🏁 RESULT -->
<div class="screen" id="result">
<div class="card">
<h2>🏁 Mission Completed</h2>
<p>Final Score: <span id="final">0</span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<!-- 🔊 AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

let index=0;
let score=0;

/* 🌿 STORY */
const storyText = `
A bright morning sun shines over a lively playground. Children are running and playing on the ground. Birds are chirping in the trees. Plants are growing taller every day. Bird eggs have just hatched into chicks. A Mimosa plant closes its leaves when touched.
`;

/* ❓ QUESTIONS */
const questions=[
{
q:"You saw that the boy was running in the playground. Type the correct living characteristic:",
a:"locomotion"
},
{
q:"Plants are growing taller every day. Type the characteristic:",
a:"growth"
},
{
q:"Birds respond to sounds and movement. Type the characteristic:",
a:"sensitivity"
},
{
q:"Bird eggs have just hatched into chicks. Type the characteristic:",
a:"reproduction"
},
{
q:"A child breathes faster after running. Type the characteristic:",
a:"respiration"
},
{
q:"A child eats food to get energy. Type the characteristic:",
a:"nutrition"
},
{
q:"The body removes waste through sweat. Type the characteristic:",
a:"excretion"
}
];

/* 🚀 SPLASH */
window.onload=function(){
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="flex";
},3000);
}

/* 🚀 START */
function startGame(){
document.getElementById("intro").style.display="none";
startStory();
}

/* 🌿 STORY + TTS */
function startStory(){

document.getElementById("storyScreen").style.display="flex";
document.getElementById("storyBox").innerText=storyText;

/* voice */
let speech=new SpeechSynthesisUtterance(storyText);
speech.rate=0.9;

/* when voice ends → move to questions */
speech.onend=function(){
showQuestion();
};

speechSynthesis.cancel();
speechSynthesis.speak(speech);
}

/* ❓ QUESTION */
function showQuestion(){

document.getElementById("storyScreen").style.display="none";
document.getElementById("questionScreen").style.display="flex";

loadQuestion();
}

function loadQuestion(){

document.getElementById("answer").value="";
document.getElementById("feedback").innerText="";

document.getElementById("questionText").innerText=
questions[index].q;
}

/* ✔ CHECK */
function checkAnswer(){

let user=document.getElementById("answer").value.toLowerCase().trim();
let correct=questions[index].a;

if(user===correct){
score+=10;
document.getElementById("correctSound").play().catch(()=>{});
document.getElementById("feedback").innerText="✅ Correct!";
}else{
document.getElementById("wrongSound").play().catch(()=>{});
document.getElementById("feedback").innerText="❌ Try again!";
return;
}

/* NEXT */
setTimeout(()=>{

index++;

if(index>=questions.length){
endGame();
}else{
loadQuestion();
}

document.getElementById("score").innerText=score;

},1200);
}

/* 🏁 END */
function endGame(){
document.getElementById("questionScreen").style.display="none";
document.getElementById("result").style.display="flex";
document.getElementById("final").innerText=score;
}

</script>

</body>
</html>
