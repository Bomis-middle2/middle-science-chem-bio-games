<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Detective Clean Engine</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI;
background:#eaf6ff;
}

/* 🔵 SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

/* 🟡 SCREEN SYSTEM (IMPORTANT) */
.screen{
display:none;
width:100%;
height:100vh;
}

/* ACTIVE SCREEN ONLY */
.active{
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

/* 🧠 INTRO */
#intro .box{
background:white;
padding:20px;
border-radius:16px;
width:90%;
max-width:800px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* 🌿 STORY SCREEN */
#storyScreen{
background:url("assets/living-story-background.png") center/cover no-repeat;
}

#storyBox{
background:rgba(255,255,255,0.88);
padding:20px;
border-radius:14px;
width:85%;
max-width:850px;
font-size:18px;
line-height:1.6;
}

/* ❓ QUESTION SCREEN */
#questionScreen{
background:#eaf6ff;
}

.qbox{
background:white;
padding:20px;
border-radius:16px;
width:90%;
max-width:850px;
text-align:center;
}

.wordbank{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:10px;
}

.wordbank div{
background:#d6ecff;
padding:6px 10px;
border-radius:8px;
font-size:14px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
text-align:center;
font-size:16px;
}

button{
margin-top:10px;
padding:12px;
width:100%;
border:none;
border-radius:10px;
background:#2e7d32;
color:white;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- 🔵 SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" style="width:220px;">
</div>

<!-- 🟡 INTRO -->
<div id="intro" class="screen active">
<div class="box">
<img src="assets/innovine-logo.png" style="width:120px;">
<h2>🧬 Life Detective</h2>
<p>Learn characteristics of living things through real-world observation.</p>
<p>✔ Listen → ✔ Observe → ✔ Answer</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- 🌿 STORY -->
<div id="storyScreen" class="screen">
<div id="storyBox"></div>
</div>

<!-- ❓ QUESTION -->
<div id="questionScreen" class="screen">
<div class="qbox">

<div class="wordbank">
<div>locomotion</div>
<div>growth</div>
<div>respiration</div>
<div>reproduction</div>
<div>sensitivity</div>
<div>nutrition</div>
<div>excretion</div>
</div>

<h3 id="questionText"></h3>

<input id="answer" placeholder="Type your answer">

<button onclick="checkAnswer()">SUBMIT</button>

<p id="feedback"></p>

</div>
</div>

<script>

let index = 0;
let score = 0;

/* 🌿 STORY */
const story = `
A bright sun rises over a lively playground. Children are running and playing. Birds are chirping in trees. Plants are growing taller every day. A Mimosa plant closes its leaves when touched.
`;

/* ❓ QUESTIONS */
const questions = [
{
q:"You saw that the boy was running in the playground. Type the correct living characteristic:",
a:"locomotion"
},
{
q:"Plants are growing taller every day. Type the correct characteristic:",
a:"growth"
},
{
q:"Birds respond to movement and sound. Type the correct characteristic:",
a:"sensitivity"
},
{
q:"Bird eggs have hatched into chicks. Type the correct characteristic:",
a:"reproduction"
},
{
q:"A child breathes faster after running. Type the correct characteristic:",
a:"respiration"
},
{
q:"A child eats food for energy. Type the correct characteristic:",
a:"nutrition"
},
{
q:"The body removes waste through sweat. Type the correct characteristic:",
a:"excretion"
}
];

/* 🚀 SPLASH */
window.onload = function(){
setTimeout(()=>{
document.getElementById("splash").style.display="none";
},3000);
};

/* 🚀 START */
function startGame(){
show("storyScreen");

document.getElementById("storyBox").innerText = story;

/* TTS */
let speech = new SpeechSynthesisUtterance(story);
speech.rate = 0.9;

/* AFTER STORY → QUESTION */
speech.onend = function(){
show("questionScreen");
loadQ();
};

speechSynthesis.cancel();
speechSynthesis.speak(speech);
}

/* ❓ LOAD QUESTION */
function loadQ(){
document.getElementById("questionText").innerText =
questions[index].q;

document.getElementById("answer").value="";
document.getElementById("feedback").innerText="";
}

/* ✔ CHECK */
function checkAnswer(){

let user = document.getElementById("answer").value.toLowerCase().trim();
let correct = questions[index].a;

if(user === correct){
score += 10;
document.getElementById("feedback").innerText = "✅ Correct!";
}else{
document.getElementById("feedback").innerText = "❌ Try again!";
return;
}

setTimeout(()=>{
index++;

if(index >= questions.length){
alert("Game Complete! Score: " + score);
location.reload();
}else{
loadQ();
}
},1000);
}

/* 🧠 SCREEN ENGINE */
function show(id){

document.querySelectorAll(".screen").forEach(s=>{
s.classList.remove("active");
});

document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
