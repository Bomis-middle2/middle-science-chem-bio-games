<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Detective Fixed Engine</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI;
background:#eaf6ff;
}

.screen{
display:none;
height:100vh;
width:100%;
}

.active{
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

/* INTRO */
.box{
background:white;
padding:20px;
border-radius:16px;
width:90%;
max-width:800px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* GAME LAYOUT */
.container{
display:flex;
width:95%;
max-width:1100px;
gap:15px;
}

/* IMAGE */
.image{
flex:1;
background:white;
border-radius:16px;
overflow:hidden;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
}

/* QUESTION */
.qbox{
flex:1;
background:white;
border-radius:16px;
padding:20px;
}

.wordbank{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:10px;
}

.wordbank div{
background:#d6ecff;
padding:6px 10px;
border-radius:8px;
}

input{
width:100%;
padding:12px;
text-align:center;
border-radius:10px;
border:1px solid #ccc;
}

button{
margin-top:10px;
padding:12px;
width:100%;
border:none;
border-radius:10px;
background:#2e7d32;
color:white;
font-size:16px;
}

@media(max-width:900px){
.container{flex-direction:column;}
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" style="width:220px;">
</div>

<!-- INTRO -->
<div id="intro" class="screen active">
<div class="box">
<img src="assets/innovine-logo.png" style="width:120px;">
<h2>🧬 Life Detective</h2>
<p>Observe, Listen and Answer</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div id="game" class="screen">

<div class="container">

<div class="image">
<img id="sceneImg">
</div>

<div class="qbox">

<div class="wordbank">
<div>locomotion</div>
<div>growth</div>
<div>respiration</div>
<div>reproduction</div>
<div>sensitivity</div>
<div>nutrition</div>
<div>excretion</div>
</div>

<h3 id="question"></h3>

<input id="answer">

<button onclick="check()">SUBMIT</button>

<p id="feedback"></p>

</div>

</div>

</div>

<!-- END -->
<div id="end" class="screen">
<div class="box">
<h2>🎉 Congratulations!</h2>
<p>Your Score: <span id="score"></span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

let index=0;
let score=0;

/* QUESTIONS */
const data=[
{
img:"assets/living-story-background.png",
story:"A boy is running in the playground.",
q:"You saw the boy running. Type the characteristic.",
a:"locomotion"
},
{
img:"assets/living-story-background.png",
story:"Plants are growing every day.",
q:"Plants are growing. Type the characteristic.",
a:"growth"
},
{
img:"assets/living-story-background.png",
story:"Mimosa plant reacts when touched.",
q:"Plant responds to touch. Type the characteristic.",
a:"sensitivity"
}
];

/* SPLASH */
window.onload=function(){
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").classList.add("active");
},3000);
}

/* START */
function startGame(){
document.getElementById("intro").classList.remove("active");
document.getElementById("game").classList.add("active");
load();
}

/* LOAD */
function load(){

document.getElementById("sceneImg").src=data[index].img;
document.getElementById("question").innerText=data[index].q;
document.getElementById("answer").value="";
document.getElementById("feedback").innerText="";

/* FIX: STORY + VOICE ALWAYS RUNS */
let speech=new SpeechSynthesisUtterance(data[index].story);
speech.rate=0.9;

speech.onend=function(){
console.log("story finished");
};

speechSynthesis.cancel();
speechSynthesis.speak(speech);

}

/* CHECK */
function check(){

let user=document.getElementById("answer").value.toLowerCase().trim();
let correct=data[index].a;

if(user===correct){
document.getElementById("correctSound").play();
score+=10;
document.getElementById("feedback").innerText="✅ Correct!";
}else{
document.getElementById("wrongSound").play();
document.getElementById("feedback").innerText="❌ Try again!";
return;
}

setTimeout(()=>{
index++;

if(index>=data.length){
endGame();
}else{
load();
}
},1200);

}

/* END */
function endGame(){
document.getElementById("game").classList.remove("active");
document.getElementById("end").classList.add("active");
document.getElementById("score").innerText=score;
}

</script>

</body>
</html>
