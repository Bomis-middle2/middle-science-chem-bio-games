<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>River Cleanup Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:url("assets/river-bg.png") center/cover no-repeat;
overflow:hidden;
}

/* TOP BAR */
.topbar{
position:fixed;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
padding:10px 15px;
background:white;
font-weight:bold;
z-index:10;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* INSTRUCTION */
#instruction{
position:fixed;
top:55px;
left:10px;
right:10px;
background:#ffffffcc;
padding:10px;
border-radius:10px;
font-weight:bold;
text-align:center;
z-index:9;
}

/* GAME AREA */
#gameArea{
position:absolute;
top:120px;
bottom:140px;
left:0;
right:0;
overflow:hidden;
}

/* WASTE */
.waste{
position:absolute;
font-size:32px;
cursor:pointer;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(0px);}
100%{transform:translateY(-400px);}
}

/* BINS FIXED BOTTOM (IMPORTANT FIX ✔) */
.bins{
position:fixed;
bottom:10px;
left:0;
right:0;
display:flex;
justify-content:space-evenly;
padding:10px;
z-index:10;
}

.bin{
background:white;
padding:12px;
border-radius:12px;
width:28%;
text-align:center;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

/* INTRO */
#intro{
display:none;
height:100vh;
align-items:center;
justify-content:center;
text-align:center;
}

/* END */
#end{
display:none;
height:100vh;
align-items:center;
justify-content:center;
text-align:center;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" width="150">
</div>

<!-- INTRO -->
<div id="intro">
<div>
<h2>🌊 River Cleanup Challenge</h2>
<p>Tap waste → then tap correct bin</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div id="gameArea"></div>

<div class="topbar">
<div>⭐ Score: <span id="score">0</span></div>
<div>River Rescue</div>
</div>

<div id="instruction">
👉 Tap waste → then tap correct bin
</div>

<div class="bins">
<div class="bin" onclick="check('plastic')">🥤 Plastic</div>
<div class="bin" onclick="check('organic')">🍌 Organic</div>
<div class="bin" onclick="check('hazard')">☠ Hazard</div>
</div>

<!-- END -->
<div id="end">
<h2>🎉 Great Job!</h2>
<p>You cleaned the river!</p>
<p>⭐ Score: <span id="final"></span></p>
</div>

<!-- AUDIO -->
<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

let score=0;
let selected=null;

setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="flex";
},3000);

function startGame(){
document.getElementById("intro").style.display="none";
spawnWaste();
}

const wasteItems=[
{emoji:"🥤",type:"plastic"},
{emoji:"🍌",type:"organic"},
{emoji:"☠️",type:"hazard"},
{emoji:"🧴",type:"plastic"},
{emoji:"🍃",type:"organic"}
];

function spawnWaste(){
let area=document.getElementById("gameArea");

wasteItems.forEach((w,i)=>{
let div=document.createElement("div");
div.className="waste";
div.innerHTML=w.emoji;
div.dataset.type=w.type;

/* RANDOM POSITION (FIXED FOR MOBILE) */
div.style.left=Math.random()*80+"%";
div.style.top=(50 + Math.random()*200)+"px";

div.onclick=()=>{
selected=div;
div.style.transform="scale(1.3)";
};

area.appendChild(div);
});
}

function check(type){
if(!selected) return;

if(selected.dataset.type===type){
score++;
document.getElementById("correct").play();
selected.remove();
}else{
document.getElementById("wrong").play();
}

selected=null;
document.getElementById("score").innerText=score;

if(score===5){
endGame();
}
}

function endGame(){
document.getElementById("gameArea").style.display="none";
document.getElementById("end").style.display="flex";
document.getElementById("final").innerText=score;

/* CLAP FIX ✔ */
let clap=document.getElementById("clap");
clap.currentTime=0;
clap.play();
}

</script>

</body>
</html>
