<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>River Rescue Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:url('assets/river-bg.png') center/cover no-repeat;
overflow:hidden;
height:100vh;
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

/* INTRO */
#intro{
display:none;
position:fixed;
inset:0;
background:rgba(255,255,255,0.85);
align-items:center;
justify-content:center;
text-align:center;
}

/* CARD */
.card{
background:white;
padding:20px;
border-radius:18px;
max-width:90%;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* BUTTON */
button{
padding:12px 20px;
background:#0077b6;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

/* GAME */
#game{
display:none;
position:fixed;
inset:0;
}

/* TOP BAR */
.topbar{
position:absolute;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
background:white;
padding:10px;
font-weight:bold;
z-index:10;
}

/* INSTRUCTION (FIXED MOBILE SPACE) */
#instruction{
position:absolute;
top:50px;
left:10px;
right:10px;
background:#ffffffee;
padding:8px;
border-radius:10px;
font-size:14px;
text-align:center;
z-index:10;
}

/* GAME AREA (ADJUSTED) */
#items{
position:absolute;
top:110px;
bottom:140px;   /* IMPORTANT FIX */
left:0;
right:0;
}

/* ITEMS */
.item{
position:absolute;
width:60px;
height:60px;
background:white;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
box-shadow:0 5px 10px rgba(0,0,0,0.15);
cursor:pointer;
}

/* BINS (FIXED MOBILE SAFE AREA) */
.bins{
position:absolute;
bottom:10px;
left:0;
right:0;
display:flex;
justify-content:space-evenly;
padding:10px;
z-index:20;
}

.bin{
width:30%;
height:80px;
background:white;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:14px;
box-shadow:0 8px 15px rgba(0,0,0,0.15);
}

/* END */
#end{
display:none;
position:fixed;
inset:0;
background:white;
align-items:center;
justify-content:center;
text-align:center;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" width="140">
</div>

<!-- INTRO -->
<div id="intro">
<div class="card">
<h2>🌊 River Rescue Mission</h2>
<p>
Clean the polluted river 🌍<br><br>
Tap waste → then tap correct bin
</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div id="game">

<div class="topbar">
<div>⭐ Score: <span id="score">0</span></div>
<div>River Cleanup</div>
</div>

<div id="instruction">
👉 Tap the moving waste and then the correct bin to clean the river
</div>

<div id="items"></div>

<div class="bins">
<div class="bin" onclick="check('plastic')">🥤 Plastic</div>
<div class="bin" onclick="check('organic')">🍌 Organic</div>
<div class="bin" onclick="check('hazard')">☠ Hazard</div>
</div>

</div>

<!-- END -->
<div id="end">
<h2>🎉 Great Job!</h2>
<p>You cleaned the river 🌊</p>
<p>Score: <span id="scoreFinal"></span></p>
</div>

<script>

setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="flex";
},2500);

const items=[
{icon:"🥤",type:"plastic"},
{icon:"🍌",type:"organic"},
{icon:"🧴",type:"plastic"},
{icon:"🔋",type:"hazard"},
{icon:"🐟",type:"organic"},
{icon:"🧪",type:"hazard"}
];

let score=0;
let selected=null;
let moving=[];

function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
spawn();
animate();
}

function spawn(){
let box=document.getElementById("items");
box.innerHTML="";
moving=[];

items.forEach(it=>{
let el=document.createElement("div");
el.className="item";
el.innerHTML=it.icon;
el.dataset.type=it.type;

let obj={
el:el,
x:Math.random()*window.innerWidth,
speed:1+Math.random()*1
};

el.style.left=obj.x+"px";
el.style.top=(20+Math.random()*200)+"px";

el.onclick=()=>selected=el;

moving.push(obj);
box.appendChild(el);
});
}

function animate(){
moving.forEach(o=>{
o.x+=o.speed;
if(o.x>window.innerWidth)o.x=-60;
o.el.style.left=o.x+"px";
});
requestAnimationFrame(animate);
}

function check(type){
if(!selected)return;

if(selected.dataset.type===type){
score++;
selected.remove();
}

selected=null;
document.getElementById("score").innerText=score;

if(document.querySelectorAll(".item").length===0){
endGame();
}
}

function endGame(){
document.getElementById("game").style.display="none";
document.getElementById("end").style.display="flex";
document.getElementById("scoreFinal").innerText=score;
}

</script>

</body>
</html>
