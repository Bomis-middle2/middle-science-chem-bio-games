<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>River Rescue Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:url('assets/river-bg.png') center/cover no-repeat;
overflow:hidden;
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

/* INTRO */
#intro{
display:none;
position:absolute;
inset:0;
background:rgba(255,255,255,0.85);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.card{
background:white;
padding:25px;
border-radius:18px;
max-width:500px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

button{
padding:12px 20px;
background:#0077b6;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

/* GAME */
#game{
display:none;
position:absolute;
inset:0;
}

/* TOP BAR */
.topbar{
position:absolute;
top:10px;
left:10px;
right:10px;
display:flex;
justify-content:space-between;
background:white;
padding:10px;
border-radius:12px;
font-weight:bold;
z-index:10;
}

/* GAME ZONE */
#items{
position:absolute;
top:80px;
bottom:220px;
width:100%;
}

/* FLOATING ITEMS */
.item{
position:absolute;
width:70px;
height:70px;
background:white;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
box-shadow:0 5px 10px rgba(0,0,0,0.15);
cursor:pointer;
}

/* BINS (FIXED UPWARD ✔) */
.bins{
position:absolute;
bottom:180px;
width:100%;
display:flex;
justify-content:center;
gap:40px;
z-index:5;
}

.bin{
width:150px;
height:120px;
background:white;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:16px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
transition:0.2s;
}

.bin:hover{
transform:translateY(-5px);
}

/* END */
#end{
display:none;
position:fixed;
inset:0;
background:white;
align-items:center;
justify-content:center;
text-align:center;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" width="150">
</div>

<!-- INTRO -->
<div id="intro">
<div class="card">
<h1>🌊 River Rescue Mission</h1>
<p>
Clean the river by sorting waste.<br><br>
✔ Save ecosystem<br>
✔ Earn stars ⭐<br>
✔ Become River Guardian 🌍
</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div id="game">

<div class="topbar">
<div>⭐ Score: <span id="score">0</span></div>
<div>River Cleanup Challenge</div>
</div>

<div id="items"></div>

<div class="bins">
<div class="bin" onclick="check('plastic')">🥤 Plastic</div>
<div class="bin" onclick="check('organic')">🍌 Organic</div>
<div class="bin" onclick="check('hazard')">☠ Hazard</div>
</div>

</div>

<!-- END -->
<div id="end">
<div>
<h1>🎉 River Cleaned!</h1>
<h2>You are a Water Guardian 🌊</h2>
<p>⭐ Score: <span id="final"></span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<!-- AUDIO -->
<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

/* SPLASH */
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="flex";
},3000);

/* DATA */
const items=[
{icon:"🥤",type:"plastic"},
{icon:"🍌",type:"organic"},
{icon:"🧴",type:"plastic"},
{icon:"🔋",type:"hazard"},
{icon:"🐟",type:"organic"},
{icon:"🧪",type:"hazard"}
];

let score=0;
let selected=null;

/* START GAME */
function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
createItems();
animate();
}

/* CREATE ITEMS */
function createItems(){
let box=document.getElementById("items");
box.innerHTML="";

items.forEach((it,i)=>{
let el=document.createElement("div");
el.className="item";
el.innerHTML=it.icon;
el.dataset.type=it.type;

el.style.left=Math.random()*window.innerWidth+"px";
el.style.top=(120+Math.random()*250)+"px";

el.onclick=()=>selected=el;

box.appendChild(el);
});
}

/* CHECK ANSWER */
function check(type){
if(!selected) return;

if(selected.dataset.type===type){
score++;
document.getElementById("correct").play();
selected.remove();
}else{
document.getElementById("wrong").play();
}

document.getElementById("score").innerText=score;

if(document.querySelectorAll(".item").length===0){
endGame();
}
}

/* ANIMATION */
function animate(){
let all=document.querySelectorAll(".item");

all.forEach(el=>{
let x=parseFloat(el.style.left);
x += 0.6 + Math.random()*0.4;

if(x > window.innerWidth){
x = -80;
}

el.style.left = x + "px";
el.style.transform = `rotate(${x%360}deg)`;
});

requestAnimationFrame(animate);
}

/* END GAME */
function endGame(){
document.getElementById("game").style.display="none";
document.getElementById("end").style.display="flex";
document.getElementById("final").innerText=score;
document.getElementById("clap").play();
}

</script>

</body>
</html>
