<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eco Energy Master Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(#eaf7ff,#ffffff);
overflow:hidden;
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

/* INTRO */
#intro{
display:none;
height:100vh;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.card{
background:white;
padding:22px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
max-width:520px;
}

.instruction{
margin-top:10px;
font-size:15px;
color:#333;
background:#f1f8ff;
padding:10px;
border-radius:10px;
}

/* GAME */
#game{
display:none;
height:100vh;
flex-direction:column;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
padding:10px 15px;
background:white;
font-weight:bold;
}

/* CARD */
#cardArea{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:15px;
padding:20px;
}

.energyCard{
background:white;
padding:35px;
border-radius:18px;
font-size:26px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
text-align:center;
min-width:260px;
}

/* BUTTONS */
.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
}

.btn{
padding:15px 18px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
min-width:140px;
}

.renewable{
background:#2ecc71;
color:white;
}

.nonrenewable{
background:#e74c3c;
color:white;
}

/* TIMER */
#timer{
font-weight:bold;
color:#ff6600;
}

/* FEEDBACK */
#feedback{
font-weight:bold;
min-height:20px;
}

/* END */
#end{
display:none;
height:100vh;
align-items:center;
justify-content:center;
text-align:center;
}

.endCard{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" width="150">
</div>

<!-- INTRO -->
<div id="intro">
<div class="card">
<h1>🌍 Eco Energy Master Pro</h1>

<p><b>Mission:</b> Classify energy resources correctly</p>

<div class="instruction">
👉 Tap Renewable or Non-Renewable based on the energy source shown<br>
✔ You get 2 attempts per question<br>
✔ Earn points and become Eco Master 🏆
</div>

<button onclick="startGame()">START MISSION</button>
</div>
</div>

<!-- GAME -->
<div id="game">

<div class="topbar">
<div>⭐ Score: <span id="score">0</span></div>
<div id="timer">⏱ 10</div>
<div>Q: <span id="qno">1</span>/6</div>
</div>

<div id="cardArea">

<div class="energyCard" id="question">☀️ Solar Energy</div>

<div class="buttons">
<button class="btn renewable" onclick="check('renewable')">🌱 Renewable</button>
<button class="btn nonrenewable" onclick="check('nonrenewable')">⛽ Non-Renewable</button>
</div>

<div id="feedback"></div>

</div>
</div>

<!-- END -->
<div id="end">
<div class="endCard">
<h1>🎉 Congratulations!</h1>
<p id="rank"></p>
<p>⭐ Score: <span id="final"></span>/6</p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<!-- AUDIO -->
<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="flex";
},3000);

const data=[
{q:"☀️ Solar Energy",a:"renewable"},
{q:"🌬️ Wind Energy",a:"renewable"},
{q:"💧 Hydropower",a:"renewable"},
{q:"🪨 Coal",a:"nonrenewable"},
{q:"🛢️ Oil",a:"nonrenewable"},
{q:"☢️ Uranium",a:"nonrenewable"}
];

data.sort(()=>Math.random()-0.5);

let i=0;
let score=0;
let attempt=1;
let time=10;
let timer;

function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="flex";
load();
startTimer();
}

function load(){
document.getElementById("question").innerText=data[i].q;
document.getElementById("feedback").innerText="";
attempt=1;
document.getElementById("qno").innerText=i+1;
time=10;
}

function startTimer(){
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏱ "+time;
if(time<=0){
next();
}
},1000);
}

function check(ans){
let q=data[i];

if(ans===q.a){
score++;
document.getElementById("correct").play();
document.getElementById("feedback").innerText="✔ Correct!";
next();
}
else{
if(attempt===1){
document.getElementById("wrong").play();
document.getElementById("feedback").innerText="Try again!";
attempt=2;
}else{
document.getElementById("feedback").innerText="Answer: "+q.a;
next();
}
}
}

function next(){
clearInterval(timer);
i++;
document.getElementById("score").innerText=score;

if(i<data.length){
load();
startTimer();
}else{
endGame();
}
}

function endGame(){
document.getElementById("game").style.display="none";
document.getElementById("end").style.display="flex";
document.getElementById("final").innerText=score;

let rank="🌱 Beginner Eco Learner";
if(score>=4) rank="🌍 Energy Explorer";
if(score===6) rank="🏆 Eco Master Scientist";

document.getElementById("rank").innerText=rank;

let clap=document.getElementById("clap");
clap.currentTime=0;
clap.play();
}

</script>

</body>
</html>
