<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chloroplast Explorer Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#eaf7ea;
overflow:hidden;
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

/* INTRO */
#intro{
display:none;
position:fixed;
inset:0;
background:#ffffffee;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
max-width:500px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

button{
padding:12px 18px;
background:#2e7d32;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

/* GAME */
#game{
display:none;
position:fixed;
inset:0;
}

/* TOP BAR */
.topbar{
position:absolute;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
background:white;
padding:10px;
font-weight:bold;
z-index:10;
}

/* IMAGE */
#imgBox{
position:absolute;
top:60px;
left:0;
right:0;
bottom:200px;
display:flex;
align-items:center;
justify-content:center;
}

#imgBox img{
max-width:95%;
max-height:100%;
border-radius:12px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* OPTIONS */
#options{
position:absolute;
bottom:10px;
left:0;
right:0;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
}

.opt{
background:white;
padding:12px 14px;
border-radius:12px;
box-shadow:0 5px 10px rgba(0,0,0,0.15);
cursor:pointer;
font-weight:bold;
min-width:40%;
text-align:center;
}

/* FEEDBACK */
#feedback{
position:absolute;
top:70px;
width:100%;
text-align:center;
font-weight:bold;
z-index:20;
padding:10px;
background:rgba(255,255,255,0.8);
}

/* END */
#end{
display:none;
position:fixed;
inset:0;
background:white;
align-items:center;
justify-content:center;
text-align:center;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png" width="150">
</div>

<!-- INTRO -->
<div id="intro">
<div class="card">
<h2>🌿 Chloroplast Explorer</h2>
<p>
Learn structure of chloroplast by identifying parts<br><br>
✔ Tap correct labels<br>
✔ Earn points ⭐<br>
✔ Become Cell Scientist 🧬
</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div id="game">

<div class="topbar">
<div>⭐ Score: <span id="score">0</span></div>
<div>Chloroplast Explorer</div>
</div>

<div id="feedback"></div>

<div id="imgBox">
<img src="assets/chloroplast.png">
</div>

<div id="options"></div>

</div>

<!-- END -->
<div id="end">
<h2>🎉 Congratulations!</h2>
<p>You are now a Cell Biologist 🧬</p>
<p>⭐ Score: <span id="final"></span></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>

let score = 0;
let qIndex = 0;

const questions = [
{
question:"Which part of chloroplast traps sunlight?",
a:["Thylakoids","Grana","Stroma","Cell wall"],
correct:"Thylakoids"
},
{
question:"Stacks of thylakoids are called?",
a:["Grana","Stroma","Nucleus","Vacuole"],
correct:"Grana"
},
{
question:"Gel-like fluid inside chloroplast is called?",
a:["Stroma","Grana","Cell membrane","Cytoplasm"],
correct:"Stroma"
},
{
question:"What is the main function of chloroplast?",
a:["Photosynthesis","Respiration","Digestion","Transport"],
correct:"Photosynthesis"
},
{
question:"Which pigment gives green colour to plants?",
a:["Chlorophyll","Haemoglobin","Melanin","Keratin"],
correct:"Chlorophyll"
}
];

function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
loadQ();
}

function loadQ(){

if(qIndex >= questions.length){
endGame();
return;
}

let q = questions[qIndex];
document.getElementById("feedback").innerText = "Tap correct: " + q.question;

let opts = document.getElementById("options");
opts.innerHTML = "";

let shuffled = [...q.a].sort(()=>Math.random()-0.5);

shuffled.forEach(o=>{
let div = document.createElement("div");
div.className = "opt";
div.innerText = o;

div.onclick = ()=>{

if(o === q.correct){
score++;
document.getElementById("feedback").innerText = "✔ Correct!";
document.getElementById("score").innerText = score;

setTimeout(()=>{
qIndex++;
loadQ();
},700);

}else{
document.getElementById("feedback").innerText = "❌ Try Again!";
}
};

opts.appendChild(div);
});
}

function endGame(){
document.getElementById("game").style.display="none";
document.getElementById("end").style.display="flex";
document.getElementById("final").innerText=score;
}

setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("intro").style.display="flex";
},3000);

</script>

</body>
</html>
